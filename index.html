<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>KZ Messenger Pro</title>
<style>
/* ===== ДИЗАЙН СИСТЕМА ===== */
:root{--brand:#0057b8;--bg:#fff;--surface:#f7f8fa;--text:#0a0a0c;--text2:#6b7280;--border:#e2e4ea;--safe-b:env(safe-area-inset-bottom,0px);--green:#22c55e;--red:#ef4444;--orange:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;font-size:15px;line-height:1.4}
button{cursor:pointer;border:0;background:0;color:inherit;font:inherit;outline:0}
input,textarea,select{font:inherit;color:inherit;background:0;border:0;outline:0;width:100%}
::-webkit-scrollbar{display:none}
.hidden{display:none!important}

/* ЭКРАНЫ */
#app-container{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;transition:.3s cubic-bezier(.32,.72,0,1);z-index:1;opacity:0;pointer-events:none;transform:translateX(100%);}
.screen.active{z-index:10;opacity:1;pointer-events:auto;transform:translateX(0);}

/* АВТОРИЗАЦИЯ */
#auth-screen{justify-content:center;padding:20px;background:linear-gradient(180deg,#fff,#f7f8fa)}
.brand{text-align:center;margin-bottom:30px}
.brand h1{font-size:22px;font-weight:700;color:var(--brand)}
.field{margin-bottom:12px}
.input{padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:16px}
.btn-main{width:100%;padding:15px;background:var(--brand);color:#fff;border-radius:12px;font-size:16px;font-weight:600;margin-top:10px}
.link{display:block;text-align:center;color:var(--brand);font-size:14px;margin-top:15px}
.err-msg{background:#fef2f2;color:var(--red);padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}

/* НАВИГАЦИЯ */
.nav-bar{padding:10px 15px calc(10px + var(--safe-b));background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);min-height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-title{font-size:17px;font-weight:700;flex:1}
.tab-bar{display:flex;border-top:1px solid var(--border);background:#fff;padding:5px 0 calc(5px + var(--safe-b));flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;color:var(--text2);font-size:10px;font-weight:600}
.tab-item.active{color:var(--brand)}

/* СПИСКИ */
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.avatar{width:45px;height:45px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0}
.li-body{flex:1;min-width:0}
.li-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-preview{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge-count{background:var(--red);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700}

/* ЧАТ */
.chat-header{padding:10px 15px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{color:var(--brand);font-size:16px;font-weight:500;display:flex;align-items:center;gap:4px}
.msg-list{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:var(--surface);-webkit-overflow-scrolling:touch}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.3;word-wrap:break-word;position:relative}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-meta{font-size:10px;opacity:.7;margin-top:2px;text-align:right}
.msg-img{max-width:100%;border-radius:8px;margin-top:5px;cursor:pointer}
.composer{padding:10px 15px calc(10px + var(--safe-b));background:#fff;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.comp-input{flex:1;background:var(--surface);border-radius:20px;padding:10px 15px;min-height:40px;max-height:100px;font-size:15px;resize:none}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.attach-btn{font-size:22px;color:var(--text2);padding:6px}

/* ЗАДАЧИ (TASK BOARD) */
.task-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 15px;box-shadow:0 2px 4px rgba(0,0,0,.02)}
.task-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.task-id{font-size:11px;color:var(--text2);font-weight:600}
.task-status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase}
.status-new{background:#dbeafe;color:#1e40af}
.status-progress{background:#fef3c7;color:#92400e}
.status-done{background:#dcfce7;color:#166534}
.task-title{font-weight:600;font-size:15px;margin-bottom:4px}
.task-desc{font-size:13px;color:var(--text2);margin-bottom:8px;line-clamp:2}
.task-footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2)}
.task-assigned{display:flex;align-items:center;gap:4px}
.mini-avatar{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.add-task-fab{position:fixed;bottom:calc(70px + var(--safe-b));right:20px;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 12px rgba(0,87,184,.4);z-index:20}

/* МОДАЛКА СОЗДАНИЯ ЗАДАЧИ */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9000;display:flex;align-items:flex-end;justify-content:center;animation:fadeUp .2s}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px 20px calc(24px + var(--safe-b));animation:sheetUp .3s cubic-bezier(.32,.72,0,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{font-size:19px;font-weight:700;margin-bottom:16px}
.m-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;gap:12px}
.m-key{color:var(--text2);flex-shrink:0}
.select-input{padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%}
</style>
<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, setDoc, getDocs, where, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyuK9iREDYiA-NmjeWgECT2np57V-m86s",
  authDomain: "kz-messenger-test.firebaseapp.com",
  projectId: "kz-messenger-test",
  storageBucket: "kz-messenger-test.firebasestorage.app",
  messagingSenderId: "60956478899",
  appId: "1:60956478899:web:43fbbc9d9755e967b68fc6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let currentUser = null;
let currentChatId = null;
let unsubscribeMessages = null;
let unsubscribeChats = null;
let unsubscribeTasks = null;
let allUsersCache = {}; 
let tasksCache = [];

// Глобальные функции
window.handleLogin = handleLogin;
window.handleRegister = handleRegister;
window.toggleReg = toggleReg;
window.logout = logout;
window.switchTab = switchTab;
window.openChat = openChat;
window.closeChat = closeChat;
window.sendMessage = sendMessage;
window.openOrCreateDM = openOrCreateDM;
window.openTaskModal = openTaskModal;
window.createTask = createTask;
window.changeTaskStatus = changeTaskStatus;
window.requestNotificationPermission = requestNotificationPermission;

document.addEventListener('DOMContentLoaded', () => {
    checkSession();
    // Запрос разрешений на пуш при старте
    if ('Notification' in window && Notification.permission === 'default') {
        setTimeout(() => Notification.requestPermission(), 2000);
    }
});

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
}

function toggleReg() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('regForm').classList.toggle('hidden');
    document.getElementById('authErr').style.display = 'none';
}

async function handleLogin(e) {
    e.preventDefault();
    const badge = document.getElementById('badgeInput').value.toUpperCase().trim();
    if (!badge) return showError("Введите табельный номер");
    
    try {
        const q = query(collection(db, "users"), where("badge", "==", badge), limit(1));
        const snapshot = await getDocs(q);
        
        let userFound = null;
        snapshot.forEach(docSnap => {
            userFound = { id: docSnap.id, ...docSnap.data() };
        });

        if (!userFound) throw new Error("Пользователь не найден");
        loginUser(userFound);
    } catch (err) {
        showError(err.message || "Ошибка входа");
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const dept = document.getElementById('regDept').value.trim();
    const badge = document.getElementById('regBadge').value.toUpperCase().trim();
    
    if (!name || !dept || !badge) return showError("Заполните все поля");

    try {
        const q = query(collection(db, "users"), where("badge", "==", badge), limit(1));
        const snapshot = await getDocs(q);
        if (!snapshot.empty) throw new Error("Такой табельный уже занят");

        const newUser = { badge, name, dept, role: 'employee', createdAt: serverTimestamp() };
        const userDocRef = await addDoc(collection(db, "users"), newUser);
        const userId = userDocRef.id;

        await ensureGeneralChannelExists(userId);
        loginUser({ id: userId, ...newUser });
    } catch (err) {
        showError(err.message || "Ошибка регистрации");
    }
}

async function ensureGeneralChannelExists(userId) {
    const channelsCol = collection(db, "chats");
    const q = query(channelsCol, where("type", "==", "channel"), where("title", "==", "Общий завод"));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
        const channelData = {
            type: 'channel', title: 'Общий завод', description: 'Главный канал предприятия',
            members: [userId], createdAt: serverTimestamp(),
            lastMessageText: 'Добро пожаловать!', lastMessageTime: serverTimestamp()
        };
        await addDoc(channelsCol, channelData);
    } else {
        const firstDoc = snapshot.docs[0];
        const data = firstDoc.data();
        if (!data.members.includes(userId)) {
            await updateDoc(firstDoc.ref, { members: [...data.members, userId] });
        }
    }
}

function loginUser(user) {
    currentUser = user;
    localStorage.setItem('kz_cloud_session', JSON.stringify(user));
    showScreen('home-screen');
    initApp();
}

function logout() {
    currentUser = null;
    localStorage.removeItem('kz_cloud_session');
    if (unsubscribeChats) unsubscribeChats();
    if (unsubscribeMessages) unsubscribeMessages();
    if (unsubscribeTasks) unsubscribeTasks();
    showScreen('auth-screen');
}

function checkSession() {
    const sess = localStorage.getItem('kz_cloud_session');
    if (sess) {
        try {
            currentUser = JSON.parse(sess);
            showScreen('home-screen');
            initApp();
        } catch (e) { logout(); }
    } else {
        showScreen('auth-screen');
    }
}

function showError(msg) {
    const el = document.getElementById('authErr');
    el.textContent = msg;
    el.style.display = 'block';
}

function switchTab(tab) {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    
    if (tab === 'tasks') {
        renderTasksList();
        subscribeToTasks();
    } else {
        if(unsubscribeTasks) unsubscribeTasks();
        renderList(tab);
    }
}

function initApp() {
    if (unsubscribeChats) unsubscribeChats();
    
    const chatsRef = collection(db, "chats");
    unsubscribeChats = onSnapshot(chatsRef, (snapshot) => {
        const myChats = [];
        snapshot.forEach(docSnap => {
            const data = docSnap.data();
            if (data.members && data.members.includes(currentUser.id)) {
                myChats.push({ id: docSnap.id, ...data });
            }
        });
        window.allMyChatsCache = myChats;
        
        if (document.getElementById('home-screen').classList.contains('active')) {
            const activeTab = document.querySelector('.tab-item.active').id.replace('tab','').toLowerCase();
            if(activeTab !== 'tasks') renderList(activeTab);
        }
    });

    loadAllUsers();
}

async function loadAllUsers() {
    const usersRef = collection(db, "users");
    const snapshot = await getDocs(usersRef);
    snapshot.forEach(docSnap => {
        allUsersCache[docSnap.id] = { id: docSnap.id, ...docSnap.data() };
    });
}

function renderList(tab) {
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    
    let items = [];
    const chats = window.allMyChatsCache || [];

    if (tab === 'channels') {
        items = chats.filter(c => c.type === 'channel').map(c => ({ ...c, displayTitle: c.title, subtitle: 'Канал завода' }));
    } else if (tab === 'contacts') {
        items = Object.values(allUsersCache).filter(u => u.id !== currentUser.id).map(u => ({
            id: 'contact_' + u.id, type: 'contact', userId: u.id, displayTitle: u.name, subtitle: u.dept
        }));
    } else {
        items = chats.filter(c => c.type === 'dm').map(c => {
            const otherId = c.members.find(m => m !== currentUser.id);
            const other = allUsersCache[otherId];
            return { ...c, displayTitle: other?.name || 'Неизвестный', subtitle: other?.dept || '' };
        });
    }

    if (items.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Нет элементов</div>';
        return;
    }

    items.sort((a,b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));

    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.onclick = () => {
            if (item.type === 'contact') openOrCreateDM(item.userId);
            else openChat(item.id);
        };
        
        const preview = item.lastMessageText ? item.lastMessageText.substring(0, 30) : 'Нет сообщений';
        
        div.innerHTML = `
            <div class="avatar">${getInitials(item.displayTitle)}</div>
            <div class="li-body">
                <div class="li-name">${escapeHtml(item.displayTitle)}</div>
                <div class="li-preview">${escapeHtml(preview)}</div>
            </div>
        `;
        container.appendChild(div);
    });
}

async function openOrCreateDM(userId) {
    try {
        const existing = window.allMyChatsCache.find(c => 
            c.type === 'dm' && c.members.includes(currentUser.id) && c.members.includes(userId)
        );

        if (existing) { openChat(existing.id); return; }

        const sortedIds = [currentUser.id, userId].sort();
        const chatData = {
            type: 'dm', members: sortedIds, createdAt: serverTimestamp(),
            lastMessageTime: serverTimestamp(), lastMessageText: '', lastMessageSender: ''
        };
        
        const docRef = await addDoc(collection(db, "chats"), chatData);
        openChat(docRef.id);
    } catch (e) { alert("Ошибка: " + e.message); }
}

function openChat(chatId) {
    currentChatId = chatId;
    const chat = window.allMyChatsCache.find(c => c.id === chatId);
    
    let title = chat?.title || 'Чат';
    if (chat?.type === 'dm') {
        const otherId = chat.members.find(m => m !== currentUser.id);
        title = allUsersCache[otherId]?.name || 'Диалог';
    }
    
    document.getElementById('chatHeaderName').textContent = title;
    document.getElementById('messagesContainer').innerHTML = ''; 
    
    loadHistorySafe(chatId);
}

async function loadHistorySafe(chatId) {
    try {
        const msgsRef = collection(db, "messages");
        const q = query(msgsRef, where("chatId", "==", chatId), limit(500));
        const snapshot = await getDocs(q);
        
        const docs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        docs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        
        renderMessages(docs);
        subscribeToNewMessages(chatId);
        
    } catch (error) {
        console.error("Load history error:", error);
    }
}

function subscribeToNewMessages(chatId) {
    if (unsubscribeMessages) unsubscribeMessages();
    
    const msgsRef = collection(db, "messages");
    const q = query(msgsRef, where("chatId", "==", chatId));
    
    unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const msgs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        msgs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderMessages(msgs);
        
        // Push Notification Logic
        if (msgs.length > 0) {
            const lastMsg = msgs[msgs.length - 1];
            if (lastMsg.senderId !== currentUser.id && document.visibilityState === 'hidden') {
                const senderName = allUsersCache[lastMsg.senderId]?.name || 'Коллега';
                notifyUser(senderName, lastMsg.text || '📎 Файл');
            }
        }
    });
}

function notifyUser(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: './icon.png' });
    }
}

function closeChat() {
    if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
    currentChatId = null;
    showScreen('home-screen');
    const activeTab = document.querySelector('.tab-item.active').id.replace('tab','').toLowerCase();
    if(activeTab !== 'tasks') renderList(activeTab);
}

function renderMessages(msgs) {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    
    msgs.forEach(m => {
        const isMe = m.senderId === currentUser.id;
        const senderName = allUsersCache[m.senderId]?.name || '???';
        const timeStr = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        
        let contentHtml = '';
        if (m.imageUrl) {
            contentHtml += `<img src="${m.imageUrl}" class="msg-img" onclick="window.open('${m.imageUrl}')">`;
        }
        if (m.text) {
            contentHtml += `<div>${escapeHtml(m.text)}</div>`;
        }
        
        div.innerHTML = `
            ${!isMe && currentChatId.startsWith('ch_') ? `<div style="font-size:11px;color:var(--brand);margin-bottom:2px">${senderName}</div>` : ''}
            ${contentHtml}
            <div class="msg-meta">${timeStr}</div>
        `;
        container.appendChild(div);
    });
    
    container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];
    
    if ((!text && !file) || !currentChatId) return;
    
    input.value = '';
    fileInput.value = '';
    
    try {
        let imageUrl = null;
        if (file) {
            // Upload to Storage
            const fileName = `${Date.now()}_${file.name}`;
            const storageReference = storageRef(storage, `uploads/${fileName}`);
            await uploadBytes(storageReference, file);
            imageUrl = await getDownloadURL(storageReference);
        }
        
        const msgData = { 
            chatId: currentChatId, 
            senderId: currentUser.id, 
            text: text, 
            imageUrl: imageUrl,
            createdAt: serverTimestamp() 
        };
        await addDoc(collection(db, "messages"), msgData);
        
        const chatRef = doc(db, "chats", currentChatId);
        await setDoc(chatRef, {
            lastMessageText: text || (imageUrl ? '📎 Фото' : ''), 
            lastMessageTime: serverTimestamp(), 
            lastMessageSender: currentUser.id
        }, { merge: true });
    } catch (e) { alert("Ошибка отправки: " + e.message); }
}

// ===== TASK MANAGER LOGIC =====

function subscribeToTasks() {
    if (unsubscribeTasks) unsubscribeTasks();
    
    const tasksRef = collection(db, "tasks");
    // Слушаем задачи, где я исполнитель или создатель, либо все публичные (для теста)
    // Для простоты демо слушаем ВСЕ задачи и фильтруем на клиенте
    unsubscribeTasks = onSnapshot(tasksRef, (snapshot) => {
        tasksCache = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        renderTasksList();
    });
}

function renderTasksList() {
    const container = document.getElementById('taskListContainer');
    if(!container) return;
    container.innerHTML = '';
    
    // Сортировка: Сначала новые, потом в работе, потом готовые
    const statusOrder = {'new': 1, 'progress': 2, 'done': 3};
    tasksCache.sort((a,b) => {
        const sa = statusOrder[a.status] || 4;
        const sb = statusOrder[b.status] || 4;
        if(sa !== sb) return sa - sb;
        return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
    });

    if (tasksCache.length === 0) {
        container.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#999">Нет активных задач.<br>Нажмите + чтобы создать.</div>';
        return;
    }

    tasksCache.forEach(task => {
        const assignee = allUsersCache[task.assigneeId];
        const creator = allUsersCache[task.creatorId];
        const initialsAssignee = assignee ? getInitials(assignee.name) : '?';
        const initialsCreator = creator ? getInitials(creator.name) : '?';
        
        const card = document.createElement('div');
        card.className = 'task-card';
        
        let statusClass = 'status-new';
        let statusText = 'Новая';
        if(task.status === 'progress') { statusClass = 'status-progress'; statusText = 'В работе'; }
        if(task.status === 'done') { statusClass = 'status-done'; statusText = 'Готово'; }

        card.innerHTML = `
            <div class="task-head">
                <span class="task-id">#${task.id.slice(-4)}</span>
                <span class="task-status ${statusClass}">${statusText}</span>
            </div>
            <div class="task-title">${escapeHtml(task.title)}</div>
            <div class="task-desc">${escapeHtml(task.description || '')}</div>
            <div class="task-footer">
                <div class="task-assigned">
                    <div class="mini-avatar">${initialsAssignee}</div>
                    <span>${assignee?.name.split(' ')[0] || 'Не назначен'}</span>
                </div>
                <div style="font-size:11px;color:var(--text2)">От: ${creator?.name.split(' ')[0] || '?'}</div>
            </div>
            <div style="margin-top:10px;display:flex;gap:8px">
                ${task.status !== 'done' ? `<button onclick="changeTaskStatus('${task.id}', 'progress')" style="flex:1;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:12px">▶ Взять в работу</button>` : ''}
                ${task.status === 'progress' ? `<button onclick="changeTaskStatus('${task.id}', 'done')" style="flex:1;padding:6px;background:var(--green);color:#fff;border-radius:6px;font-size:12px">✔ Завершить</button>` : ''}
            </div>
        `;
        container.appendChild(card);
    });
}

function openTaskModal() {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.onclick = (e) => { if(e.target === bg) bg.remove(); };
    
    const usersOptions = Object.values(allUsersCache).map(u => 
        `<option value="${u.id}">${u.name} (${u.dept})</option>`
    ).join('');

    bg.innerHTML = `
        <div class="modal-sheet">
            <h3>Новая задача</h3>
            <div class="field"><label>Заголовок</label><input class="input" id="tTitle" placeholder="Например: Согласовать чертеж"></div>
            <div class="field"><label>Описание</label><textarea class="input" id="tDesc" rows="3" placeholder="Детали задачи..."></textarea></div>
            <div class="field"><label>Исполнитель</label><select class="select-input" id="tAssignee">${usersOptions}</select></div>
            <button class="btn-main" onclick="createTask()">Создать задачу</button>
        </div>
    `;
    document.body.appendChild(bg);
}

async function createTask() {
    const title = document.getElementById('tTitle').value.trim();
    const desc = document.getElementById('tDesc').value.trim();
    const assigneeId = document.getElementById('tAssignee').value;
    
    if(!title || !assigneeId) return alert("Заполните заголовок и выберите исполнителя");
    
    try {
        const taskData = {
            title,
            description: desc,
            creatorId: currentUser.id,
            assigneeId: assigneeId,
            status: 'new',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        };
        await addDoc(collection(db, "tasks"), taskData);
        document.querySelector('.modal-bg')?.remove();
    } catch (e) { alert("Ошибка создания: " + e.message); }
}

async function changeTaskStatus(taskId, newStatus) {
    try {
        const taskRef = doc(db, "tasks", taskId);
        await updateDoc(taskRef, {
            status: newStatus,
            updatedAt: serverTimestamp()
        });
    } catch (e) { alert("Ошибка обновления статуса"); }
}

function requestNotificationPermission() {
    if ('Notification' in window) {
        Notification.requestPermission().then(perm => {
            alert("Разрешение на уведомления: " + perm);
        });
    }
}

// UTILS
function getInitials(name) {
    if (!name) return '?';
    const parts = name.split(' ');
    return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, m => map[m]);
}
</script>
</head>
<body>

<div id="app-container">
  
  <!-- 1. ЭКРАН ВХОДА -->
  <div id="auth-screen" class="screen active">
    <div class="brand">
      <h1>КОЛОМЕНСКИЙ ЗАВОД</h1>
      <p>Messenger & Task System</p>
    </div>
    <div id="authErr" class="err-msg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field"><label>Табельный номер</label><input class="input" id="badgeInput" placeholder="KZ-00001" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="passInput" placeholder="Любой пароль (демо)" required></div>
      <button class="btn-main">Войти</button>
      <a href="#" class="link" onclick="toggleReg()">Нет аккаунта? Зарегистрироваться</a>
    </form>
    <form id="regForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="field"><label>ФИО</label><input class="input" id="regName" placeholder="Иванов И.И." required></div>
      <div class="field"><label>Подразделение</label><input class="input" id="regDept" placeholder="IT-отдел" required></div>
      <div class="field"><label>Табельный номер</label><input class="input" id="regBadge" placeholder="KZ-00100" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="regPass" placeholder="Мин 6 символов" required minlength="6"></div>
      <button class="btn-main">Создать аккаунт</button>
      <a href="#" class="link" onclick="toggleReg()">Уже есть аккаунт? Войти</a>
    </form>
  </div>

  <!-- 2. ГЛАВНЫЙ ЭКРАН -->
  <div id="home-screen" class="screen">
    <div class="nav-bar">
      <div class="nav-title" id="pageTitle">Чаты</div>
      <button onclick="logout()" style="color:#ef4444;font-size:14px">Выйти</button>
    </div>
    
    <!-- Список Чатов/Контактов -->
    <div class="list-scroll hidden" id="chatListWrapper">
       <div class="list-scroll" id="chatListContainer"></div>
    </div>

    <!-- Список Задач -->
    <div class="list-scroll hidden" id="taskListWrapper">
       <div class="list-scroll" id="taskListContainer"></div>
    </div>

    <div class="tab-bar">
      <button class="tab-item active" onclick="switchTab('chats')" id="tabChats">💬<br>Чаты</button>
      <button class="tab-item" onclick="switchTab('channels')" id="tabChannels">📢<br>Каналы</button>
      <button class="tab-item" onclick="switchTab('contacts')" id="tabContacts">👥<br>Контакты</button>
      <button class="tab-item" onclick="switchTab('tasks')" id="tabTasks">✅<br>Задачи</button>
    </div>
    
    <!-- FAB для задач -->
    <button class="add-task-fab hidden" id="fabAddTask" onclick="openTaskModal()">+</button>
  </div>

  <!-- 3. ЭКРАН ЧАТА -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">‹ Назад</button>
      <div class="nav-title" id="chatHeaderName">Чат</div>
    </div>
    <div class="msg-list" id="messagesContainer"></div>
    <div class="composer">
      <label class="attach-btn">📎<input type="file" id="fileInput" class="hidden" onchange="sendMessage()"></label>
      <textarea class="comp-input" id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<script>
// Логика переключения видимости списков при смене таба
const originalSwitchTab = window.switchTab;
window.switchTab = function(tab) {
    originalSwitchTab(tab);
    
    const chatWrap = document.getElementById('chatListWrapper');
    const taskWrap = document.getElementById('taskListWrapper');
    const fab = document.getElementById('fabAddTask');
    const title = document.getElementById('pageTitle');
    
    if (tab === 'tasks') {
        chatWrap.classList.add('hidden');
        taskWrap.classList.remove('hidden');
        fab.classList.remove('hidden');
        title.textContent = 'Задачи';
    } else {
        chatWrap.classList.remove('hidden');
        taskWrap.classList.add('hidden');
        fab.classList.add('hidden');
        title.textContent = tab === 'chats' ? 'Чаты' : tab === 'channels' ? 'Каналы' : 'Контакты';
    }
};
</script>
</body>
</html>
