<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KZ Messenger | Коломенский завод</title>
<style>
/* ===== ДИЗАЙН СИСТЕМА (По мотивам референса) ===== */
:root {
    --brand-dark: #0a192f; /* Темно-синий фон сайдбара */
    --brand-blue: #0057b8; /* Акцентный синий */
    --bg-main: #ffffff;
    --bg-chat: #f0f2f5;
    --text-primary: #1c1e21;
    --text-secondary: #65676b;
    --border-color: #e4e6eb;
    --msg-out: #dcf8c6;
    --msg-in: #ffffff;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-chat); color: var(--text-primary); height: 100dvh; overflow: hidden; display: flex; }

button { cursor: pointer; border: none; background: none; font: inherit; }
input, textarea { font: inherit; border: none; background: none; width: 100%; }
::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
.hidden { display: none !important; }

/* LAYOUT GRID */
.app-container { display: flex; width: 100%; height: 100%; max-width: 1600px; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); background: #fff; }

/* LEFT SIDEBAR (NAVIGATION) */
.sidebar-nav {
    width: 70px; background: var(--brand-dark); color: white;
    display: flex; flex-direction: column; align-items: center; padding: 16px 0;
    flex-shrink: 0; z-index: 10;
}
.logo-kz { font-weight: 800; font-size: 20px; margin-bottom: 30px; letter-spacing: 1px; }
.nav-item {
    width: 48px; height: 48px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.6); margin-bottom: 12px; transition: all 0.2s; position: relative;
}
.nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: white; }
.nav-item svg { width: 24px; height: 24px; fill: currentColor; }
.badge-dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; border: 2px solid var(--brand-dark); }

/* MIDDLE COLUMN (CHAT LIST) */
.chat-list-col {
    width: 320px; background: white; border-right: 1px solid var(--border-color);
    display: flex; flex-direction: column; flex-shrink: 0;
}
.list-header { padding: 16px; border-bottom: 1px solid var(--border-color); }
.search-input-wrap { background: #f0f2f5; border-radius: 20px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
.search-input-wrap input { font-size: 14px; }
.list-content { flex: 1; overflow-y: auto; }
.chat-item {
    padding: 12px 16px; display: flex; gap: 12px; cursor: pointer; border-bottom: 1px solid #f5f5f5;
    transition: background 0.2s;
}
.chat-item:hover, .chat-item.active { background: #f0f2f5; }
.avatar-circle {
    width: 48px; height: 48px; border-radius: 50%; background: #ddd;
    display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;
    position: relative; flex-shrink: 0; font-size: 18px;
}
.status-indicator {
    position: absolute; bottom: 0; right: 0; width: 12px; height: 12px;
    border-radius: 50%; border: 2px solid white; background: #ccc;
}
.status-online { background: #31a24c; }
.chat-info { flex: 1; min-width: 0; }
.chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-preview { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.chat-meta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.chat-time { font-size: 11px; color: var(--text-secondary); }
.unread-count { background: var(--brand-blue); color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

/* RIGHT AREA (MAIN CHAT WINDOW) */
.main-chat-area {
    flex: 1; display: flex; flex-direction: column; background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cmVjdCBmaWxsPSIjZjBmMmY1IiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiLz48Y2lyY2xlIGN4PSIyMCIgY3k9IjIwIiByPSIxIiBmaWxsPSIjZWFlYWVhIi8+PC9zdmc+') repeat;
    position: relative;
}
.chat-header-bar {
    height: 60px; background: white; border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05); z-index: 5;
}
.header-user-info { display: flex; align-items: center; gap: 12px; }
.header-actions { display: flex; gap: 16px; color: var(--text-secondary); }
.messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.date-separator { text-align: center; margin: 10px 0; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.date-separator span { background: rgba(0,0,0,0.05); padding: 4px 12px; border-radius: 12px; backdrop-filter: blur(4px); }

.message-bubble {
    max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.4;
    position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word;
}
.msg-in { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 4px; }
.msg-out { align-self: flex-end; background: var(--msg-out); border-bottom-right-radius: 4px; }
.sender-name { font-size: 12px; font-weight: bold; color: var(--brand-blue); margin-bottom: 2px; display: block; }
.msg-time { font-size: 10px; color: var(--text-secondary); margin-top: 4px; text-align: right; display: block; opacity: 0.7; }
.msg-image { max-width: 100%; border-radius: 8px; margin-top: 4px; cursor: pointer; display: block; }
.msg-file-card { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.03); padding: 8px; border-radius: 8px; margin-top: 4px; }
.file-icon-box { width: 40px; height: 40px; background: #eee; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

.composer-area {
    background: white; padding: 12px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--border-color);
    display: flex; align-items: flex-end; gap: 12px;
}
.attach-btn { font-size: 24px; color: var(--text-secondary); padding: 4px; }
.input-wrapper { flex: 1; background: #f0f2f5; border-radius: 24px; padding: 8px 16px; display: flex; align-items: center; }
.input-wrapper textarea { resize: none; max-height: 120px; min-height: 24px; font-size: 15px; line-height: 1.4; }
.send-btn {
    width: 40px; height: 40px; background: var(--brand-blue); color: white;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: transform 0.1s;
}
.send-btn:active { transform: scale(0.95); }

/* EMPTY STATE */
.empty-state-view {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--text-secondary); text-align: center; padding: 40px;
}
.empty-icon-large { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }

/* MOBILE ADAPTATION */
@media (max-width: 768px) {
    .sidebar-nav { display: none; } /* Hide rail on mobile */
    .app-container { flex-direction: column; }
    .chat-list-col { width: 100%; height: 100%; position: absolute; z-index: 5; transform: translateX(0); transition: transform 0.3s; }
    .main-chat-area { width: 100%; height: 100%; position: absolute; z-index: 10; transform: translateX(100%); transition: transform 0.3s; }
    
    body.mobile-chat-open .chat-list-col { transform: translateX(-100%); }
    body.mobile-chat-open .main-chat-area { transform: translateX(0); }
    
    .back-mobile-btn { display: block !important; margin-right: 12px; font-size: 20px; color: var(--brand-blue); }
}
.back-mobile-btn { display: none; }

/* LOGIN SCREEN OVERLAY */
.login-overlay {
    position: fixed; inset: 0; background: white; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
}
.login-brand h1 { color: var(--brand-blue); font-size: 28px; margin-bottom: 8px; }
.login-form { width: 100%; max-width: 300px; }
.form-field { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 600; }
.form-input { padding: 12px 16px; background: #f0f2f5; border-radius: 12px; width: 100%; font-size: 16px; }
.btn-submit { width: 100%; padding: 14px; background: var(--brand-blue); color: white; border-radius: 12px; font-weight: 600; margin-top: 10px; }
.link-switch { display: block; text-align: center; color: var(--brand-blue); font-size: 14px; margin-top: 16px; cursor: pointer; }
.error-msg { color: red; font-size: 13px; margin-top: 8px; display: none; }
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<script>
// ==========================================
// КОНФИГУРАЦИЯ FIREBASE
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyDyuK9iREDYiA-NmjeWgECT2np57V-m86s",
  authDomain: "kz-messenger-test.firebaseapp.com",
  projectId: "kz-messenger-test",
  storageBucket: "kz-messenger-test.firebasestorage.app",
  messagingSenderId: "60956478899",
  appId: "1:60956478899:web:43fbbc9d9755e967b68fc6"
};

// ⚠️ ВСТАВЬ СЮДА СВОЙ VAPID KEY ИЗ CLOUD MESSAGING
const VAPID_KEY = "BBAJLwdFGqVuHh3lKD__uitkry2FxfCgJs5osTtuCeB0Ra7KCx5ZXRGW2Dkjt2eL6Pmph8msWDbe89514HwG-TQ";

let db, auth, storage, messaging;
let currentUser = null;
let activeChatId = null;
let unsubscribeChats = null;
let unsubscribeMessages = null;
let usersCache = {}; // Кэш всех пользователей для отображения имен

window.onload = async () => {
    try {
        const app = firebase.initializeApp(firebaseConfig);
        db = app.firestore();
        storage = app.storage();
        messaging = app.messaging();
        
        checkSession();
    } catch(e) {
        console.error("Init error:", e);
        alert("Ошибка запуска приложения");
    }
};

// --- АВТОРИЗАЦИЯ ---
function showLogin() { document.getElementById('loginOverlay').classList.remove('hidden'); }
function hideLogin() { document.getElementById('loginOverlay').classList.add('hidden'); }

async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const dept = document.getElementById('regDept').value.trim();
    const badge = document.getElementById('regBadge').value.toUpperCase().trim();
    
    if(!name || !badge) return showError("Заполните поля");

    try {
        // Проверка уникальности
        const exists = await db.collection("users").where("badge", "==", badge).limit(1).get();
        if (!exists.empty) throw new Error("Такой табельный уже занят");

        const userObj = { badge, name, dept, role: 'employee', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        const docRef = await db.collection("users").add(userObj);
        
        loginUser({ id: docRef.id, ...userObj });
    } catch(err) {
        showError(err.message);
    }
}

async function handleLogin(e) {
    e.preventDefault();
    const badge = document.getElementById('logBadge').value.toUpperCase().trim();
    if(!badge) return showError("Введите номер");

    try {
        const snap = await db.collection("users").where("badge", "==", badge).limit(1).get();
        if(snap.empty) throw new Error("Пользователь не найден");
        
        const data = snap.docs[0].data();
        loginUser({ id: snap.docs[0].id, ...data });
    } catch(err) {
        showError(err.message);
    }
}

function loginUser(user) {
    currentUser = user;
    localStorage.setItem('kz_user_session', JSON.stringify(user));
    hideLogin();
    initApp();
    requestPushPermission(); // Запрашиваем пуши сразу после входа
}

function logout() {
    currentUser = null;
    localStorage.removeItem('kz_user_session');
    location.reload();
}

function checkSession() {
    const sess = localStorage.getItem('kz_user_session');
    if(sess) {
        currentUser = JSON.parse(sess);
        hideLogin();
        initApp();
    } else {
        showLogin();
    }
}

function showError(msg) {
    const el = document.querySelector('.error-msg');
    el.textContent = msg;
    el.style.display = 'block';
}

// --- PUSH NOTIFICATIONS SETUP ---
async function requestPushPermission() {
    if (!('Notification' in window)) return;
    
    const permission = await Notification.requestPermission();
    if(permission === 'granted') {
        try {
            const reg = await navigator.serviceWorker.register('./sw.js');
            const token = await messaging.getToken({ vapidKey: VAPID_KEY });
            console.log("FCM Token:", token);
            
            // Сохраняем токен в профиль пользователя
            if(token && currentUser) {
                await db.collection("users").doc(currentUser.id).update({ fcmToken: token });
            }
        } catch(e) {
            console.error("Push setup failed", e);
        }
    }
}

// Слушаем входящие сообщения, когда вкладка открыта
messaging.onMessage((payload) => {
    playSound();
    showToast(payload.notification.title, payload.notification.body);
    refreshCurrentChat(); // Обновляем текущий чат
});

function playSound() {
    // Простой синтезатор звука "дзынь"
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800; osc.type = 'sine';
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(); osc.stop(ctx.currentTime + 0.5);
}

function showToast(title, body) {
    // Реализация toast уведомления внутри страницы (опционально)
    console.log(`TOAST: ${title} - ${body}`);
}

// --- ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ ---
async function initApp() {
    loadAllUsers();
    renderChatList();
}

async function loadAllUsers() {
    const snap = await db.collection("users").limit(100).get();
    snap.forEach(doc => {
        usersCache[doc.id] = { id: doc.id, ...doc.data() };
    });
}

// --- РЕНДЕР СПИСКА ЧАТОВ ---
function renderChatList(filterType = 'all') {
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';

    const q = db.collection("chats").where("members", "array-contains", currentUser.id);
    
    if(unsubscribeChats) unsubscribeChats();
    
    unsubscribeChats = q.onSnapshot((snapshot) => {
        let items = [];
        snapshot.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
        
        // Фильтрация по типу (если нужно)
        if(filterType === 'channels') items = items.filter(i => i.type === 'channel');
        else if(filterType === 'dms') items = items.filter(i => i.type === 'dm');

        // Сортировка по времени последнего сообщения
        items.sort((a,b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            if(activeChatId === item.id) div.classList.add('active');
            
            let displayName = item.title || "Диалог";
            let avatarText = "?";
            
            if(item.type === 'dm') {
                const otherId = item.members.find(m => m !== currentUser.id);
                const otherUser = usersCache[otherId];
                displayName = otherUser?.name || "Неизвестный";
                avatarText = getInitials(displayName);
            } else {
                avatarText = "#"; // Для канала
            }

            const preview = item.lastMessageText ? item.lastMessageText.substring(0, 30) : "Нет сообщений";
            
            div.innerHTML = `
                <div class="avatar-circle" style="background:${getColorForId(item.id)}">${avatarText}<div class="status-indicator status-online"></div></div>
                <div class="chat-info">
                    <div class="chat-name">${escapeHtml(displayName)}</div>
                    <div class="chat-preview">${escapeHtml(preview)}</div>
                </div>
                <div class="chat-meta">
                    <span class="chat-time">${formatTime(item.lastMessageTime)}</span>
                    ${item.unreadCount > 0 ? `<span class="unread-count">${item.unreadCount}</span>` : ''}
                </div>
            `;
            
            div.onclick = () => openChat(item.id);
            container.appendChild(div);
        });
    });
}

// --- ОТКРЫТИЕ ЧАТА ---
function openChat(chatId) {
    activeChatId = chatId;
    document.body.classList.add('mobile-chat-open');
    
    // Обновляем заголовок
    const chatInfo = usersCache[chatId] || {}; // Упрощенно, лучше искать в кэше чатов
    // TODO: Найти название из snapshot chats
    
    loadMessages(chatId);
    markAsRead(chatId);
}

function closeMobileChat() {
    document.body.classList.remove('mobile-chat-open');
    activeChatId = null;
    if(unsubscribeMessages) unsubscribeMessages();
}

async function loadMessages(chatId) {
    const msgsRef = db.collection("messages");
    const q = msgsRef.where("chatId", "==", chatId).orderBy("createdAt", "asc").limit(50);
    
    if(unsubscribeMessages) unsubscribeMessages();
    
    unsubscribeMessages = q.onSnapshot((snapshot) => {
        const container = document.getElementById('messagesArea');
        container.innerHTML = '';
        
        let lastDate = null;
        
        snapshot.forEach(doc => {
            const m = doc.data();
            const dateStr = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleDateString('ru-RU') : '';
            
            if(dateStr !== lastDate) {
                const sep = document.createElement('div');
                sep.className = 'date-separator';
                sep.innerHTML = `<span>${dateStr}</span>`;
                container.appendChild(sep);
                lastDate = dateStr;
            }
            
            const isMe = m.senderId === currentUser.id;
            const senderName = usersCache[m.senderId]?.name || '???';
            
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isMe ? 'msg-out' : 'msg-in'}`;
            
            let contentHtml = '';
            if(m.imageUrl) contentHtml += `<img src="${m.imageUrl}" class="msg-image">`;
            if(m.fileName) contentHtml += `
                <div class="msg-file-card">
                    <div class="file-icon-box">📄</div>
                    <div><strong>${escapeHtml(m.fileName)}</strong><br><small>${m.fileSize}</small></div>
                </div>`;
            if(m.text) contentHtml += `<div>${escapeHtml(m.text)}</div>`;
            
            bubble.innerHTML = `
                ${!isMe ? `<span class="sender-name" style="color:${getColorForId(m.senderId)}">${senderName.split(' ')[0]}</span>` : ''}
                ${contentHtml}
                <span class="msg-time">${new Date(m.createdAt.seconds*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
            `;
            
            container.appendChild(bubble);
        });
        
        container.scrollTop = container.scrollHeight;
    }, (err) => console.error("Msg load err", err));
}

// --- ОТПРАВКА СООБЩЕНИЙ ---
async function sendMessage() {
    const input = document.getElementById('messageInput');
    const fileInput = document.getElementById('fileInput');
    const text = input.value.trim();
    const file = fileInput.files[0];
    
    if(!text && !file) return;
    if(!activeChatId) return alert("Выберите чат");

    input.value = '';
    fileInput.value = '';
    
    try {
        let imageUrl = null;
        let fileName = null;
        let fileSize = null;

        // Если есть файл - грузим в Storage
        if(file) {
            const safeName = `${Date.now()}_${file.name}`;
            const ref = storage.ref(`uploads/${safeName}`);
            await ref.put(file);
            imageUrl = await ref.getDownloadURL();
            fileName = file.name;
            fileSize = formatBytes(file.size);
        }

        const msgData = {
            chatId: activeChatId,
            senderId: currentUser.id,
            text: text,
            imageUrl: imageUrl,
            fileName: fileName,
            fileSize: fileSize,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection("messages").add(msgData);
        
        // Обновляем метаданные чата (последнее сообщение)
        await db.collection("chats").doc(activeChatId).update({
            lastMessageText: text || (imageUrl ? "📎 Фото" : ""),
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessageSender: currentUser.id
        });

    } catch(e) {
        alert("Ошибка отправки: " + e.message);
    }
}

function refreshCurrentChat() {
    if(activeChatId) loadMessages(activeChatId);
}

function markAsRead(chatId) {
    // Логика сброса unreadCount (упрощенная)
    db.collection("chats").doc(chatId).update({ unreadCount: 0 }).catch(()=>{});
}

// --- UTILS ---
function getInitials(name) {
    if(!name) return '?';
    return name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
}

function getColorForId(id) {
    const colors = ['#0057b8','#e91e63','#9c27b0','#ff9800','#4caf50','#00bcd4'];
    let hash = 0;
    for(let i=0;i<id.length;i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

function formatTime(ts) {
    if(!ts) return '';
    const d = new Date(ts.seconds * 1000);
    const now = new Date();
    if(d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    return d.toLocaleDateString([], {day:'numeric',month:'short'});
}

function formatBytes(bytes) {
    if(bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function escapeHtml(text) {
    const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
    return String(text).replace(/[&<>"']/g, m => map[m]);
}
</script>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-brand">
        <h1>КОЛОМЕНСКИЙ ЗАВОД</h1>
        <p style="color:#888;margin-bottom:30px;">Корпоративная связь</p>
    </div>
    
    <!-- Форма входа -->
    <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
        <div class="form-field">
            <label class="form-label">Табельный номер</label>
            <input type="text" id="logBadge" class="form-input" placeholder="KZ-00001" required>
        </div>
        <button type="submit" class="btn-submit">Войти</button>
        <a class="link-switch" onclick="toggleForms()">Нет аккаунта? Зарегистрироваться</a>
    </form>

    <!-- Форма регистрации -->
    <form id="regForm" class="login-form hidden" onsubmit="handleRegister(event)">
        <div class="form-field">
            <label class="form-label">ФИО</label>
            <input type="text" id="regName" class="form-input" placeholder="Иванов И.И." required>
        </div>
        <div class="form-field">
            <label class="form-label">Подразделение</label>
            <input type="text" id="regDept" class="form-input" placeholder="IT-отдел" required>
        </div>
        <div class="form-field">
            <label class="form-label">Табельный номер</label>
            <input type="text" id="regBadge" class="form-input" placeholder="KZ-00100" required>
        </div>
        <button type="submit" class="btn-submit">Создать аккаунт</button>
        <a class="link-switch" onclick="toggleForms()">Уже есть аккаунт? Войти</a>
    </form>
    
    <div class="error-msg"></div>
</div>

<!-- MAIN APP CONTAINER -->
<div class="app-container">
    
    <!-- LEFT NAV -->
    <div class="sidebar-nav">
        <div class="logo-kz">KZ</div>
        <button class="nav-item active"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.2L4 17.2V4h16v12z"/></svg></button>
        <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></button>
        <button class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></button>
        <div style="flex:1"></div>
        <button class="nav-item" onclick="logout()"><svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg></button>
    </div>

    <!-- MIDDLE LIST -->
    <div class="chat-list-col">
        <div class="list-header">
            <div class="search-input-wrap">
                <span>🔍</span>
                <input type="text" placeholder="Поиск...">
            </div>
        </div>
        <div class="list-content" id="chatListContainer">
            <!-- Items injected by JS -->
        </div>
    </div>

    <!-- RIGHT CHAT AREA -->
    <div class="main-chat-area">
        <div class="empty-state-view" id="emptyStateView">
            <div class="empty-icon-large">💬</div>
            <h3>Выберите чат</h3>
            <p>Начните общение с коллегами</p>
        </div>

        <div id="activeChatView" class="hidden" style="display:flex;flex-direction:column;height:100%;">
            <div class="chat-header-bar">
                <div class="header-user-info">
                    <button class="back-mobile-btn" onclick="closeMobileChat()">←</button>
                    <div class="avatar-circle" style="width:40px;height:40px;font-size:14px;" id="headerAvatar">?</div>
                    <div>
                        <div style="font-weight:600;font-size:16px;" id="headerName">Имя</div>
                        <div style="font-size:12px;color:green;" id="headerStatus">В сети</div>
                    </div>
                </div>
                <div class="header-actions">
                    <button>📞</button>
                    <button>ℹ️</button>
                </div>
            </div>

            <div class="messages-container" id="messagesArea">
                <!-- Messages injected here -->
            </div>

            <div class="composer-area">
                <label class="attach-btn">
                    📎
                    <input type="file" id="fileInput" class="hidden">
                </label>
                <div class="input-wrapper">
                    <textarea id="messageInput" rows="1" placeholder="Написать сообщение..."></textarea>
                </div>
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

</div>

<script>
// Toggle forms helper
function toggleForms() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('regForm').classList.toggle('hidden');
    document.querySelector('.error-msg').style.display = 'none';
}

// Auto-resize textarea
document.getElementById('messageInput')?.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
});
</script>
</body>
