<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KZ Messenger</title>
<link rel="manifest" href="./manifest.json">
<style>
/* ===== ДИЗАЙН СИСТЕМА iOS ===== */
:root{--brand:#0057b8;--bg:#fff;--surface:#f7f8fa;--text:#0a0a0c;--text2:#6b7280;--border:#e2e4ea;--green:#22c55e;--red:#ef4444;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;font-size:15px;line-height:1.4}
button{cursor:pointer;border:0;background:0;color:inherit;font:inherit;outline:0}
input,textarea{font:inherit;color:inherit;background:0;border:0;outline:0;width:100%}
::-webkit-scrollbar{display:none}
.hidden{display:none!important}

/* ЭКРАНЫ */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);opacity:0;pointer-events:none;transition:.2s;z-index:1}
.screen.active{opacity:1;pointer-events:auto;z-index:10}
.slide-panel{transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.slide-panel.open{transform:translateX(0)}

/* АВТОРИЗАЦИЯ */
#auth{justify-content:center;padding:20px;background:linear-gradient(180deg,#fff,#f7f8fa)}
.brand{text-align:center;margin-bottom:30px}
.brand h1{font-size:22px;font-weight:700;color:var(--brand)}
.brand p{color:var(--text2);font-size:14px;margin-top:5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase}
.input{padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:16px}
.btn-main{width:100%;padding:15px;background:var(--brand);color:#fff;border-radius:12px;font-size:16px;font-weight:600;margin-top:10px}
.link{display:block;text-align:center;color:var(--brand);font-size:14px;margin-top:15px}
.err-msg{background:#fef2f2;color:var(--red);padding:10px;border-radius:8px;font-size:13px;margin-bottom:10px;display:none}

/* ГЛАВНЫЙ ЭКРАН */
.nav-bar{padding:10px 15px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);min-height:50px;display:flex;align-items:center;gap:10px}
.nav-title{font-size:17px;font-weight:700;flex:1}
.tab-bar{display:flex;border-top:1px solid var(--border);background:#fff;padding:5px 0 calc(5px + var(--safe-b))}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;color:var(--text2);font-size:10px;font-weight:600}
.tab-item.active{color:var(--brand)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.avatar{width:45px;height:45px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0}
.li-body{flex:1;min-width:0}
.li-name{font-weight:600;font-size:15px}
.li-preview{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--brand);color:#fff;font-size:11px;padding:2px 6px;border-radius:10px;font-weight:700}

/* ЧАТ */
.msg-list{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.3;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-meta{font-size:10px;opacity:.7;margin-top:2px;text-align:right}
.composer{padding:10px 15px calc(10px + var(--safe-b));background:#fff;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end}
.comp-input{flex:1;background:var(--surface);border-radius:20px;padding:10px 15px;min-height:40px;max-height:100px;font-size:15px}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.back-btn{color:var(--brand);font-size:16px;font-weight:500;display:flex;align-items:center;gap:4px}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth" class="screen active">
<div class="brand">
<h1>КОЛОМЕНСКИЙ ЗАВОД</h1>
<p>Корпоративный мессенджер</p>
</div>
<div id="authErr" class="err-msg"></div>
<form id="loginForm" onsubmit="handleLogin(event)">
<div class="field"><label>Табельный номер</label><input class="input" id="badgeInput" placeholder="KZ-00001" required></div>
<div class="field"><label>Пароль</label><input class="input" type="password" id="passInput" placeholder="••••••" required></div>
<button class="btn-main">Войти</button>
<a href="#" class="link" onclick="toggleReg()">Нет аккаунта? Зарегистрироваться</a>
</form>
<form id="regForm" class="hidden" onsubmit="handleRegister(event)">
<div class="field"><label>ФИО</label><input class="input" id="regName" placeholder="Иванов И.И." required></div>
<div class="field"><label>Подразделение</label><input class="input" id="regDept" placeholder="IT-отдел" required></div>
<div class="field"><label>Табельный номер</label><input class="input" id="regBadge" placeholder="KZ-00100" required></div>
<div class="field"><label>Пароль</label><input class="input" type="password" id="regPass" placeholder="Мин 6 символов" required minlength="6"></div>
<button class="btn-main">Создать аккаунт</button>
<a href="#" class="link" onclick="toggleReg()">Уже есть аккаунт? Войти</a>
</form>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="home" class="screen">
<div class="nav-bar">
<div class="nav-title" id="pageTitle">Чаты</div>
<button onclick="logout()" style="color:var(--red);font-size:14px">Выйти</button>
</div>
<div style="flex:1;overflow-y:auto" id="chatListContainer"></div>
<div class="tab-bar">
<button class="tab-item active" onclick="switchTab('chats')" id="tabChats">💬<br>Чаты</button>
<button class="tab-item" onclick="switchTab('channels')" id="tabChannels">📢<br>Каналы</button>
<button class="tab-item" onclick="switchTab('contacts')" id="tabContacts">👥<br>Контакты</button>
</div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chatView" class="screen slide-panel">
<div class="nav-bar">
<button class="back-btn" onclick="closeChat()">‹ Назад</button>
<div class="nav-title" id="chatHeaderName">Чат</div>
</div>
<div class="msg-list" id="messagesContainer"></div>
<div class="composer">
<textarea class="comp-input" id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
<button class="send-btn" onclick="sendMessage()">➤</button>
</div>
</div>

<script>
// ===== ЛОГИКА ПРИЛОЖЕНИЯ =====
const DB_KEY = 'kz_messenger_data_v6';
let db = { users: {}, chats: {}, messages: {} };
let currentUser = null;
let currentChatId = null;
let currentTab = 'chats';

// Загрузка данных
function loadDB() {
    try {
        const saved = localStorage.getItem(DB_KEY);
        if (saved) db = JSON.parse(saved);
    } catch (e) { console.error(e); }
    
    // Инициализация демо-данных если пусто
    if (Object.keys(db.users).length === 0) seedData();
}

function saveDB() {
    localStorage.setItem(DB_KEY, JSON.stringify(db));
}

function seedData() {
    // Демо пользователи
    db.users['u1'] = { id:'u1', badge:'KZ-00001', name:'Иванов И.С.', dept:'Дирекция', role:'admin' };
    db.users['u2'] = { id:'u2', badge:'KZ-00002', name:'Петрова М.А.', dept:'Дирекция', role:'manager' };
    db.users['u3'] = { id:'u3', badge:'KZ-00003', name:'Сидоров А.П.', dept:'Инженерия', role:'employee' };
    
    // Демо каналы
    db.chats['ch_all'] = { id:'ch_all', type:'channel', title:'Общий завод', members:['u1','u2','u3'] };
    db.chats['ch_it'] = { id:'ch_it', type:'channel', title:'IT Поддержка', members:['u1','u2','u3'] };
    
    // Стартовые сообщения
    db.messages['ch_all'] = [
        { id:'m1', from:'u1', text:'Доброе утро, коллеги!', ts: Date.now() - 3600000 },
        { id:'m2', from:'u2', text:'Планёрка в 10:00.', ts: Date.now() - 1800000 }
    ];
    saveDB();
}

// ===== АВТОРИЗАЦИЯ =====
function toggleReg() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('regForm').classList.toggle('hidden');
    document.getElementById('authErr').style.display = 'none';
}

function handleLogin(e) {
    e.preventDefault();
    const badge = document.getElementById('badgeInput').value.toUpperCase();
    const pass = document.getElementById('passInput').value;
    
    // Поиск пользователя (в демо режиме пароль не проверяем строго, просто ищем бейдж)
    const user = Object.values(db.users).find(u => u.badge === badge);
    
    if (!user) {
        showError("Пользователь не найден. Зарегистрируйтесь.");
        return;
    }
    
    // Для демо: любой пароль подходит, если пользователь существует
    loginUser(user);
}

function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const dept = document.getElementById('regDept').value;
    const badge = document.getElementById('regBadge').value.toUpperCase();
    const pass = document.getElementById('regPass').value;
    
    if (Object.values(db.users).some(u => u.badge === badge)) {
        showError("Такой табельный номер уже занят.");
        return;
    }
    
    const newUser = {
        id: 'u_' + Date.now(),
        badge, name, dept, role: 'employee'
    };
    
    db.users[newUser.id] = newUser;
    saveDB();
    alert("Регистрация успешна! Теперь войдите.");
    toggleReg();
}

function loginUser(user) {
    currentUser = user;
    sessionStorage.setItem('kz_session', JSON.stringify(user));
    showScreen('home');
    renderList();
}

function logout() {
    currentUser = null;
    sessionStorage.removeItem('kz_session');
    showScreen('auth');
}

function checkSession() {
    const sess = sessionStorage.getItem('kz_session');
    if (sess) {
        currentUser = JSON.parse(sess);
        showScreen('home');
        renderList();
    } else {
        showScreen('auth');
    }
}

function showError(msg) {
    const el = document.getElementById('authErr');
    el.textContent = msg;
    el.style.display = 'block';
}

// ===== НАВИГАЦИЯ =====
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    renderList();
}

// ===== РЕНДЕР СПИСКА =====
function renderList() {
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    
    let items = [];
    
    if (currentTab === 'chats') {
        // Личные чаты (DM)
        Object.values(db.chats).filter(c => c.type === 'dm' && c.members.includes(currentUser.id)).forEach(c => {
            const otherId = c.members.find(m => m !== currentUser.id);
            const other = db.users[otherId];
            items.push({ ...c, displayTitle: other?.name || 'Неизвестный', subtitle: other?.dept });
        });
    } else if (currentTab === 'channels') {
        // Каналы
        Object.values(db.chats).filter(c => c.type === 'channel').forEach(c => {
            items.push({ ...c, displayTitle: c.title, subtitle: 'Канал' });
        });
    } else if (currentTab === 'contacts') {
        // Контакты
        Object.values(db.users).filter(u => u.id !== currentUser.id).forEach(u => {
            items.push({ 
                id: 'contact_' + u.id, 
                type: 'contact', 
                displayTitle: u.name, 
                subtitle: u.dept,
                userId: u.id 
            });
        });
    }
    
    if (items.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Нет элементов</div>';
        return;
    }
    
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.onclick = () => {
            if (item.type === 'contact') openOrCreateDM(item.userId);
            else openChat(item.id);
        };
        
        // Получаем последнее сообщение для превью
        const msgs = db.messages[item.id] || [];
        const lastMsg = msgs[msgs.length - 1];
        const preview = lastMsg ? (lastMsg.from === currentUser.id ? 'Вы: ' : '') + (lastMsg.text || '[Файл]').substring(0, 30) : 'Нет сообщений';
        
        div.innerHTML = `
            <div class="avatar">${getInitials(item.displayTitle)}</div>
            <div class="li-body">
                <div class="li-name">${escapeHtml(item.displayTitle)}</div>
                <div class="li-preview">${escapeHtml(preview)}</div>
            </div>
            ${msgs.filter(m => m.ts > (db.reads?.[item.id]?.[currentUser.id] || 0) && m.from !== currentUser.id).length > 0 ? '<span class="badge">!</span>' : ''}
        `;
        container.appendChild(div);
    });
}

// ===== ЧАТЫ =====
function openOrCreateDM(userId) {
    // Ищем существующий DM или создаем новый
    let chat = Object.values(db.chats).find(c => 
        c.type === 'dm' && c.members.includes(currentUser.id) && c.members.includes(userId)
    );
    
    if (!chat) {
        const newId = 'dm_' + [currentUser.id, userId].sort().join('_');
        chat = { id: newId, type: 'dm', title: '', members: [currentUser.id, userId] };
        db.chats[newId] = chat;
        db.messages[newId] = [];
        saveDB();
    }
    
    openChat(chat.id);
}

function openChat(chatId) {
    currentChatId = chatId;
    const chat = db.chats[chatId];
    
    // Заголовок
    let title = chat.title;
    if (chat.type === 'dm') {
        const otherId = chat.members.find(m => m !== currentUser.id);
        title = db.users[otherId]?.name || 'Чат';
    }
    document.getElementById('chatHeaderName').textContent = title;
    
    // Сообщения
    renderMessages();
    
    // Открыть панель
    document.getElementById('chatView').classList.add('open');
    
    // Фокус на инпуте
    setTimeout(() => document.getElementById('messageInput').focus(), 300);
}

function closeChat() {
    document.getElementById('chatView').classList.remove('open');
    currentChatId = null;
    renderList(); // Обновить список при выходе
}

function renderMessages() {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    
    const msgs = db.messages[currentChatId] || [];
    
    msgs.forEach(m => {
        const isMe = m.from === currentUser.id;
        const sender = db.users[m.from];
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        div.innerHTML = `
            ${!isMe && currentChatId.startsWith('ch_') ? `<div style="font-size:11px;color:var(--brand);margin-bottom:2px">${sender?.name}</div>` : ''}
            <div>${escapeHtml(m.text)}</div>
            <div class="msg-meta">${new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
        `;
        container.appendChild(div);
    });
    
    // Скролл вниз
    container.scrollTop = container.scrollHeight;
}

function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    const msg = {
        id: 'm_' + Date.now(),
        from: currentUser.id,
        text: text,
        ts: Date.now()
    };
    
    if (!db.messages[currentChatId]) db.messages[currentChatId] = [];
    db.messages[currentChatId].push(msg);
    saveDB();
    
    input.value = '';
    renderMessages();
}

// ===== УТИЛИТЫ =====
function getInitials(name) {
    if (!name) return '?';
    const parts = name.split(' ');
    return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, m => map[m]);
}

// СТАРТ
window.onload = () => {
    loadDB();
    checkSession();
};
</script>
</body>
</html>
