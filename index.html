<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КЗ Мессенджер">
<meta name="theme-color" content="#ffffff">
<title>Коломенский Завод · Мессенджер</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='96' fill='%23ffffff'/><circle cx='256' cy='170' r='62' fill='none' stroke='%230057b8' stroke-width='14'/><circle cx='256' cy='170' r='20' fill='%230057b8'/><g stroke='%230057b8' stroke-width='12' stroke-linecap='round'><line x1='256' y1='98' x2='256' y2='128'/><line x1='256' y1='212' x2='256' y2='242'/><line x1='184' y1='170' x2='214' y2='170'/><line x1='298' y1='170' x2='328' y2='170'/></g><text x='256' y='340' text-anchor='middle' font-family='-apple-system,sans-serif' font-size='90' font-weight='800' fill='%230057b8'>КЗ</text></svg>">
<style>
:root{
--brand:#0057b8;--brand-dark:#004494;--brand-light:#e8f1fb;
--bg:#fff;--surface:#f7f8fa;--elevated:#eef0f4;--border:#e2e4ea;
--text:#0a0a0c;--text2:#6b7280;--text3:#9ca3af;
--green:#22c55e;--red:#ef4444;--orange:#f59e0b;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-size:15px;line-height:1.4}
button{cursor:pointer;border:0;background:0;color:inherit;font:inherit;outline:0}
input,textarea,select{font:inherit;color:inherit;background:0;border:0;outline:0;resize:none}
::-webkit-scrollbar{display:none}
.hidden{display:none!important}
a{color:var(--brand);text-decoration:none}

/* ===== ЭКРАНЫ ===== */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:1;opacity:0;pointer-events:none;transition:opacity .2s}
.screen.active{opacity:1;pointer-events:auto;z-index:10}
.slide-panel{transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.slide-panel.open{transform:translateX(0)}

/* ===== АВТОРИЗАЦИЯ ===== */
#auth{justify-content:center;padding:calc(20px + var(--safe-t)) 24px calc(20px + var(--safe-b));background:linear-gradient(180deg,#fff,#f7f8fa);overflow-y:auto}
.brand{text-align:center;margin-bottom:28px}
.brand-logo{width:88px;height:88px;margin:0 auto 14px;border-radius:20px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,87,184,.08)}
.brand h1{font-size:20px;font-weight:700;color:var(--brand);letter-spacing:.3px}
.brand p{color:var(--text2);font-size:14px;margin-top:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.input{width:100%;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:16px;transition:all .2s}
.input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(0,87,184,.1)}
.btn-main{width:100%;padding:15px;background:var(--brand);color:#fff;border-radius:12px;font-size:16px;font-weight:600;margin-top:6px;transition:all .15s;box-shadow:0 2px 8px rgba(0,87,184,.25)}
.btn-main:active{transform:scale(.98);background:var(--brand-dark)}
.btn-ghost{width:100%;padding:13px;background:var(--surface);color:var(--brand);border:1px solid var(--border);border-radius:12px;font-size:15px;font-weight:500;margin-top:8px}
.link{display:block;text-align:center;color:var(--brand);font-size:14px;margin-top:16px;font-weight:500}
.err-msg{background:#fef2f2;border:1px solid #fecaca;color:var(--red);padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px;display:none}
.ok-msg{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px;display:none}
.demo-box{background:var(--brand-light);border:1px dashed var(--brand);border-radius:12px;padding:14px;margin-top:16px}
.demo-box h4{font-size:13px;color:var(--brand);margin-bottom:8px;font-weight:700}
.demo-row{display:flex;gap:8px;margin-bottom:6px;font-size:13px;align-items:center}
.demo-row span{flex:1;color:var(--text2)}
.demo-row button{background:#fff;border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:12px;color:var(--brand);font-weight:600}
.demo-row button:active{background:var(--brand-light)}

/* ===== НАВИГАЦИЯ ===== */
.nav-bar{padding:calc(10px + var(--safe-t)) 14px 10px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);min-height:52px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-title{font-size:17px;font-weight:700;flex:1}
.nav-sub{font-size:12px;color:var(--text2)}
.back-btn{display:flex;align-items:center;gap:2px;color:var(--brand);font-size:16px;font-weight:500;padding:6px 10px 6px 4px;margin-left:-6px}
.back-arrow{font-size:24px;line-height:1}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .15s;color:var(--text2)}
.icon-btn:active{background:var(--elevated)}

/* ===== ТАБ-ПАНЕЛЬ ===== */
.tab-bar{display:flex;border-top:1px solid var(--border);background:rgba(255,255,255,.95);backdrop-filter:blur(20px);padding:6px 0 calc(6px + var(--safe-b));flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--text3);font-size:10px;font-weight:600;transition:color .15s;position:relative}
.tab-item.active{color:var(--brand)}
.tab-item .ti-icon{font-size:22px;line-height:1}
.tab-badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}

/* ===== ПОИСК ===== */
.search-wrap{padding:8px 14px;flex-shrink:0}
.search-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid transparent;border-radius:10px;padding:10px 12px;transition:all .2s}
.search-box:focus-within{border-color:var(--brand);background:#fff}
.search-box input{flex:1;font-size:15px}
.search-box .si{color:var(--text3);font-size:15px}

/* ===== СПИСКИ ===== */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(12px + var(--safe-b))}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);transition:background .12s;cursor:pointer}
.list-item:active{background:var(--surface)}
.avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;color:#fff;flex-shrink:0;position:relative}
.avatar.ch{border-radius:12px}
.online-dot{position:absolute;bottom:0;right:0;width:13px;height:13px;border-radius:50%;background:var(--green);border:2.5px solid #fff}
.li-body{flex:1;min-width:0}
.li-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;gap:8px}
.li-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-time{font-size:12px;color:var(--text3);flex-shrink:0}
.li-preview{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{background:var(--brand);color:#fff;font-size:12px;font-weight:600;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.empty-list{padding:48px 20px;text-align:center;color:var(--text2)}
.empty-list .ei{font-size:48px;margin-bottom:12px;opacity:.3}
.section-head{padding:8px 14px;font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}

/* ===== СООБЩЕНИЯ ===== */
.msg-list{padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#fafbfd,#fff)}
.date-sep{text-align:center;margin:10px 0;font-size:12px;color:var(--text2);font-weight:500}
.date-sep span{background:var(--elevated);padding:4px 10px;border-radius:10px}
.msg{max-width:78%;display:flex;flex-direction:column;animation:msgPop .2s ease}
@keyframes msgPop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.other{align-self:flex-start;align-items:flex-start}
.msg.sys{align-self:center;max-width:90%}
.msg .sender{font-size:12px;font-weight:600;margin-bottom:2px;padding:0 4px}
.bubble{padding:9px 13px;border-radius:16px;font-size:15px;line-height:1.35;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.me .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.other .bubble{background:var(--elevated);color:var(--text);border-bottom-left-radius:4px}
.msg.sys .bubble{background:0;color:var(--text2);font-size:13px;text-align:center;box-shadow:none}
.m-meta{font-size:11px;color:var(--text3);margin-top:2px;padding:0 4px;display:flex;gap:4px;align-items:center}
.msg.me .m-meta{color:rgba(255,255,255,.7)}
.check{font-size:12px}.check.read{color:#bae6fd}
.reply-ref{font-size:13px;color:var(--text2);border-left:3px solid var(--brand);padding:3px 8px;margin-bottom:3px;background:rgba(0,87,184,.06);border-radius:0 6px 6px 0;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-att{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.06);padding:8px 12px;border-radius:10px;margin-top:5px;cursor:pointer}
.msg.me .file-att{background:rgba(255,255,255,.15)}
.file-att .fi{font-size:22px}.file-att .fn{font-size:13px;font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-att .fs{font-size:11px;opacity:.7}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.rpill{background:#fff;border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:13px;cursor:pointer;transition:all .12s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.rpill:active{transform:scale(.92)}.rpill.mine{border-color:var(--brand);background:var(--brand-light)}

/* ===== КОМПОЗЕР ===== */
.composer{padding:8px 12px calc(8px + var(--safe-b));background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.comp-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:10px 14px;font-size:15px;min-height:40px;max-height:120px;line-height:1.35;transition:border .2s}
.comp-input:focus{border-color:var(--brand);background:#fff}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:transform .12s;box-shadow:0 2px 6px rgba(0,87,184,.3)}
.send-btn:active{transform:scale(.9)}
.att-btn{font-size:22px;color:var(--text2);padding:6px;flex-shrink:0}
.reply-bar{display:flex;align-items:center;gap:8px;background:var(--brand-light);padding:8px 12px;border-radius:10px;margin-bottom:6px;font-size:13px;border-left:3px solid var(--brand)}
.reply-bar b{color:var(--brand)}.reply-bar .rt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.reply-bar .rx{margin-left:auto;color:var(--text2);font-size:18px;padding:0 4px}

/* ===== МОДАЛКА / ТОСТ ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9000;display:flex;align-items:flex-end;justify-content:center;animation:fadeUp .2s}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px 20px calc(24px + var(--safe-b));animation:sheetUp .3s cubic-bezier(.32,.72,0,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-sheet h3{font-size:19px;font-weight:700;margin-bottom:14px}
.m-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;gap:12px}
.m-row:last-of-type{border:0}
.m-key{color:var(--text2);flex-shrink:0}
.m-val{font-weight:500;text-align:right;word-break:break-word}
.toast{position:fixed;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%);background:rgba(10,10,12,.92);backdrop-filter:blur(10px);color:#fff;padding:12px 20px;border-radius:20px;font-size:14px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:tIn .3s;max-width:90vw;text-align:center}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.out{animation:tOut .3s forwards}
@keyframes tOut{to{opacity:0;transform:translateX(-50%) translateY(-10px)}}

/* ===== КОНТАКТ ДЕТАЛИ ===== */
.contact-hero{padding:24px 20px;text-align:center;background:linear-gradient(180deg,var(--brand-light),#fff);border-bottom:1px solid var(--border)}
.contact-hero .avatar{width:88px;height:88px;font-size:32px;margin:0 auto 12px}
.contact-hero h2{font-size:20px;font-weight:700;margin-bottom:4px}
.contact-hero .dept{color:var(--text2);font-size:14px}
.contact-hero .badge-role{display:inline-block;margin-top:8px;padding:3px 10px;background:var(--brand);color:#fff;border-radius:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.contact-actions{display:flex;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
.contact-actions button{flex:1;padding:12px;background:var(--brand);color:#fff;border-radius:10px;font-weight:600;font-size:14px}
.contact-actions button.sec{background:var(--surface);color:var(--brand);border:1px solid var(--border)}
.info-grid{padding:14px 20px}
.info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border:0}
.info-row .k{color:var(--text2)}
.info-row .v{font-weight:500;text-align:right}
.dept-chips{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg)}
.dept-chip{padding:6px 12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;font-size:13px;white-space:nowrap;color:var(--text2);font-weight:500;transition:all .15s}
.dept-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ===== ГРУППА ===== */
.group-members{padding:14px 20px}
.gm-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.gm-item:last-child{border:0}
.gm-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;flex-shrink:0}
.gm-info{flex:1;min-width:0}
.gm-name{font-size:14px;font-weight:500}
.gm-pos{font-size:12px;color:var(--text2)}
.new-group-form{padding:14px 20px}
.ng-field{margin-bottom:12px}
.ng-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.ng-users{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--surface);border-radius:10px;min-height:44px}
.ng-user{display:flex;align-items:center;gap:6px;padding:4px 10px;background:#fff;border:1px solid var(--border);border-radius:16px;font-size:13px}
.ng-user.selected{background:var(--brand);color:#fff;border-color:var(--brand)}
.ng-user .ng-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:600}
</style>
</head>
<body>

<!-- ========== АВТОРИЗАЦИЯ ========== -->
<div id="auth" class="screen active">
<div class="brand">
<div class="brand-logo">
<svg width="64" height="64" viewBox="0 0 512 512"><circle cx="256" cy="170" r="62" fill="none" stroke="#0057b8" stroke-width="14"/><circle cx="256" cy="170" r="20" fill="#0057b8"/><g stroke="#0057b8" stroke-width="12" stroke-linecap="round"><line x1="256" y1="98" x2="256" y2="128"/><line x1="256" y1="212" x2="256" y2="242"/><line x1="184" y1="170" x2="214" y2="170"/><line x1="298" y1="170" x2="328" y2="170"/></g><text x="256" y="340" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="78" font-weight="800" fill="#0057b8">КЗ</text></svg>
</div>
<h1>КОЛОМЕНСКИЙ ЗАВОД</h1>
<p>Корпоративный мессенджер</p>
</div>
<div class="err-msg" id="authErr"></div>
<div class="ok-msg" id="authOk"></div>
<form id="loginF" onsubmit="doLogin(event)">
<div class="field"><label>Табельный номер</label><input class="input" id="lBadge" placeholder="KZ-00001" required autocomplete="off" autocapitalize="characters"></div>
<div class="field"><label>Пароль</label><input class="input" id="lPass" type="password" placeholder="••••••" required></div>
<button class="btn-main" type="submit">Войти</button>
<a class="link" href="#" onclick="showReg(event)">Нет аккаунта? Зарегистрироваться</a>
<div class="demo-box">
<h4>⚡ Быстрый вход (демо)</h4>
<div class="demo-row"><span>Иванов И.С. — Директор</span><button onclick="quickFill('KZ-00001')">Войти</button></div>
<div class="demo-row"><span>Петрова М.А. — Зам.</span><button onclick="quickFill('KZ-00002')">Войти</button></div>
<div class="demo-row"><span>Кузнецов Д.О. — IT</span><button onclick="quickFill('KZ-00004')">Войти</button></div>
<div class="demo-row"><span>Смирнова Е.В. — HR</span><button onclick="quickFill('KZ-00005')">Войти</button></div>
<div style="font-size:11px;color:var(--text2);margin-top:8px">Все пароли: <b>demo123</b></div>
</div>
</form>
<form id="regF" class="hidden" onsubmit="doRegister(event)">
<div class="field"><label>ФИО полностью</label><input class="input" id="rName" placeholder="Иванов Иван Иванович" required></div>
<div class="field"><label>Табельный номер</label><input class="input" id="rBadge" placeholder="KZ-00100" required autocomplete="off" autocapitalize="characters"></div>
<div class="field"><label>Подразделение</label><select class="input" id="rDept" required><option value="">Выберите…</option><option>Дирекция</option><option>Инженерия</option><option>Производство</option><option>IT-отдел</option><option>Отдел кадров</option><option>Финансы</option><option>Безопасность</option><option>Логистика</option><option>Коммерческий отдел</option></select></div>
<div class="field"><label>Должность</label><input class="input" id="rPos" placeholder="Инженер-технолог" required></div>
<div class="field"><label>Телефон (внутренний)</label><input class="input" id="rPhone" placeholder="доб. 1234"></div>
<div class="field"><label>Email</label><input class="input" id="rEmail" type="email" placeholder="i.ivanov@kolomna-zavod.ru"></div>
<div class="field"><label>Пароль (мин. 6)</label><input class="input" id="rPass" type="password" placeholder="••••••" required minlength="6"></div>
<button class="btn-main" type="submit">Создать аккаунт</button>
<a class="link" href="#" onclick="showLog(event)">Уже есть аккаунт? Войти</a>
</form>
</div>

<!-- ========== ГЛАВНЫЙ ЭКРАН ========== -->
<div id="home" class="screen">
<div class="nav-bar">
<div style="flex:1;display:flex;align-items:center;gap:8px">
<svg width="28" height="28" viewBox="0 0 512 512"><circle cx="256" cy="256" r="180" fill="none" stroke="#0057b8" stroke-width="20"/><text x="256" y="320" text-anchor="middle" font-family="sans-serif" font-size="200" font-weight="800" fill="#0057b8">КЗ</text></svg>
<div><div class="nav-title" id="homeTitle">Чаты</div></div>
</div>
<button class="icon-btn" onclick="openNewChat()" title="Новый чат">✏️</button>

// ---- REALTIME BUS ----
function initBus(){try{bc=new BroadcastChannel(BUS);bc.onmessage=e=>onBus(e.data);}catch(e){window.addEventListener('storage',ev=>{if(ev.key==='kz_bc'&&ev.newValue)try{onBus(JSON.parse(ev.newValue));}catch(_){}});}}
function post(ev){ev._from=me?.id;ev._ts=Date.now();if(bc){try{bc.postMessage(ev);return;}catch(e){}}try{localStorage.setItem('kz_bc',JSON.stringify({...ev,_r:Math.random()}));}catch(e){}}
function onBus(ev){if(!ev||ev._from===me?.id)return;
if(ev.type==='msg')recvMsg(ev.chatId,ev.payload);
else if(ev.type==='typing')showTyping(ev.chatId,ev.name);
else if(ev.type==='read')applyRead(ev.chatId,ev.upTo);
else if(ev.type==='react')applyReact(ev.chatId,ev.msgId,ev.emoji,ev.userId);
else if(ev.type==='presence'){const u=db.users[ev.userId];if(u){u.online=ev.online;save();if(curTab==='contacts'||curTab==='chats')renderList();}}
else if(ev.type==='group_created'){const g=db.chats[ev.chatId];if(g&&g.parts.includes(me.id)){renderList();toast('Вы добавлены в группу «'+g.title+'»');}}
}

// ---- АВТОРИЗАЦИЯ ----
function showScr(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function showReg(e){e.preventDefault();$('loginF').classList.add('hidden');$('regF').classList.remove('hidden');hideMsgs();}
function showLog(e){e.preventDefault();$('regF').classList.add('hidden');$('loginF').classList.remove('hidden');hideMsgs();}
function hideMsgs(){$('authErr').style.display='none';$('authOk').style.display='none';}
function showErr(m){$('authErr').textContent=m;$('authErr').style.display='block';$('authOk').style.display='none';}
function showOk(m){$('authOk').textContent=m;$('authOk').style.display='block';$('authErr').style.display='none';}
function quickFill(badge){$('lBadge').value=badge;$('lPass').value='demo123';}

function doLogin(e){e.preventDefault();
const badge=$('lBadge').value.trim().toUpperCase(),pass=$('lPass').value;
if(!badge||!pass)return showErr('Заполните все поля');
const user=Object.values(db.users).find(u=>u.badge===badge&&atob(u.pass)===pass);
if(!user)return showErr('Неверный табельный номер или пароль');
login(user);
}
function doRegister(e){e.preventDefault();
const name=$('rName').value.trim(),badge=$('rBadge').value.trim().toUpperCase(),dept=$('rDept').value,pos=$('rPos').value.trim(),phone=$('rPhone').value.trim(),email=$('rEmail').value.trim(),pass=$('rPass').value;
if(!name||!badge||!dept||!pos||!pass)return showErr('Заполните обязательные поля');
if(pass.length<6)return showErr('Пароль минимум 6 символов');
if(!/^KZ-\d+$/.test(badge))return showErr('Формат табельного: KZ-XXXXX');
if(Object.values(db.users).some(u=>u.badge===badge))return showErr('Такой табельный номер уже зарегистрирован');
const id=gid('u');
db.users[id]={id,badge,name,dept,pos,phone,email,role:'employee',pass:btoa(pass),online:true,lastSeen:Date.now()};
save();showOk('Аккаунт создан! Теперь войдите.');setTimeout(()=>showLog(new Event('x')),1500);
}
function login(user){
me=user;me.online=true;save();
localStorage.setItem(SK,JSON.stringify({uid:user.id,t:Date.now()}));
post({type:'presence',userId:user.id,online:true});
enterApp();requestPush();
}
function logout(){if(me){me.online=false;save();post({type:'presence',userId:me.id,online:false});}localStorage.removeItem(SK);me=null;activeChat=null;showScr('auth');}
function checkSession(){try{const s=JSON.parse(localStorage.getItem(SK));if(s&&db.users[s.uid]){me=db.users[s.uid];me.online=true;save();return true;}}catch(e){}return false;}

// ---- ВХОД В ПРИЛОЖЕНИЕ ----
function enterApp(){showScr('home');renderList();startHB();}

// ---- СПИСОК / ТАБЫ ----
function switchTab(tab){curTab=tab;document.querySelectorAll('.tab-item').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
$('homeTitle').textContent=tab==='chats'?'Чаты':tab==='channels'?'Каналы':'Контакты';
$('searchI').placeholder=tab==='contacts'?'Поиск по имени, должности…':'Поиск…';
renderList();
}
function renderList(){
const el=$('listEl');el.innerHTML='';
const q=($('searchI')?.value||'').toLowerCase();
if(curTab==='chats')renderChatsList(el,q);
else if(curTab==='channels')renderChannelsList(el,q);
else renderContactsList(el,q);
updateBadges();
}
function renderChatsList(el,q){
const items=getAllMyChats().filter(i=>!q||(i.title+i.sub).toLowerCase().includes(q));
if(!items.length){el.innerHTML='<div class="empty-list"><div class="ei">💬</div>Нет чатов<br><small style="color:var(--text3)">Нажмите ✏️ чтобы создать новый чат или перейдите в Контакты</small></div>';return;}
items.forEach(item=>el.appendChild(listItem(item)));
}
function renderChannelsList(el,q){
const items=getChannels().filter(i=>!q||(i.title+i.sub).toLowerCase().includes(q));
if(!items.length){el.innerHTML='<div class="empty-list"><div class="ei">📢</div>Нет доступных каналов</div>';return;}
items.forEach(item=>el.appendChild(listItem(item)));
}
function renderContactsList(el,q){
const all=getContacts();
const depts=[...new Set(all.map(u=>u.dept))].sort();
const chipsWrap=document.createElement('div');chipsWrap.className='dept-chips';
chipsWrap.innerHTML=`<button class="dept-chip ${!curDept?'active':''}" onclick="filterDept('')">Все (${all.length})</button>`+depts.map(d=>`<button class="dept-chip ${curDept===d?'active':''}" onclick="filterDept('${esc(d)}')">${esc(d)}</button>`).join('');
el.appendChild(chipsWrap);
let items=all.filter(u=>!curDept||u.dept===curDept);
if(q)items=items.filter(i=>(i.title+i.sub+(i.phone||'')+(i.email||'')).toLowerCase().includes(q));
if(!items.length){const emptyDiv=document.createElement('div');emptyDiv.className='empty-list';emptyDiv.innerHTML='<div class="ei">👥</div>Совпадений не найдено';el.appendChild(emptyDiv);return;}
const groups={};
items.sort((a,b)=>a.title.localeCompare(b.title,'ru')).forEach(u=>{
const letter=u.title[0].toUpperCase();groups[letter]=groups[letter]||[];groups[letter].push(u);
});
Object.keys(groups).sort().forEach(letter=>{
const head=document.createElement('div');head.className='section-head';head.textContent=letter;el.appendChild(head);
groups[letter].forEach(u=>el.appendChild(contactListItem(u)));
});
}
window.filterDept=d=>{curDept=d;renderList();};

// ---- МОДЕЛЬ ЧАТОВ ----
function getAllMyChats(){
// Личные чаты + групповые чаты где я участник
const dmChats=Object.values(db.chats).filter(c=>c.type==='dm'&&c.parts.includes(me.id));
const groupChats=Object.values(db.chats).filter(c=>c.type==='group'&&c.parts.includes(me.id));
const all=[...dmChats,...groupChats].map(c=>{
const ms=db.msgs[c.id]||[],last=ms[ms.length-1];
if(c.type==='dm'){
const oid=c.parts.find(p=>p!==me.id),o=db.users[oid]||{};
return{id:c.id,type:'dm',title:o.name||'?',sub:(o.dept||'')+' • '+(o.pos||''),ini:ini(o.name),col:col(oid),online:o.online,last:last?fmtPreview(last):'',lastTs:last?last.ts:0,unread:unreadCnt(c.id)};
}else{
// Группа
const members=c.parts.map(pid=>db.users[pid]).filter(Boolean);
const names=members.map(m=>m.name.split(' ')[0]).slice(0,3).join(', ');
return{id:c.id,type:'group',title:c.title||names,sub:members.length+' участников',ini:c.title?c.title.slice(0,2).toUpperCase():'👥',col:col(c.id),online:false,last:last?fmtPreview(last):'',lastTs:last?last.ts:0,unread:unreadCnt(c.id)};
}
}).sort((a,b)=>b.lastTs-a.lastTs);
return all;
}
function getChannels(){
return db.channels.filter(c=>!c.roles.length||c.roles.includes(me.role)||me.role==='admin').map(c=>{
const ms=db.msgs[c.id]||[],last=ms[ms.length-1];
return{id:c.id,type:'channel',title:c.name,sub:c.desc,ini:c.icon||'#',col:col(c.id),online:false,last:last?fmtPreview(last):'',lastTs:last?last.ts:0,unread:unreadCnt(c.id),pin:c.pin};
}).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.lastTs-a.lastTs);
}
function getContacts(){
return Object.values(db.users).filter(u=>u.id!==me.id).map(u=>({id:'ct_'+u.id,type:'contact',uid:u.id,title:u.name,sub:u.dept+' • '+u.pos,ini:ini(u.name),col:col(u.id),online:u.online,phone:u.phone,email:u.email,last:'',lastTs:0,unread:0}));
}
function fmtPreview(m){const s=m.from===me.id?'Вы':(db.users[m.from]?.name?.split(' ')[0]||'???');return s+': '+(m.text||(m.file?'📎 '+m.file.name:'')).slice(0,50);}
function unreadCnt(cid){if(!me)return 0;const rt=(db.reads[cid]||{})[me.id]||0;return(db.msgs[cid]||[]).filter(m=>m.ts>rt&&m.from!==me.id&&!m.deleted).length;}
function updateBadges(){const cu=getAllMyChats().reduce((s,c)=>s+c.unread,0),cn=getChannels().reduce((s,c)=>s+c.unread,0);
setBadge('tbChats',cu);setBadge('tbChan',cn);
const tot=cu+cn;document.title=(tot>0?'('+tot+') ':'')+'КЗ Мессенджер';}
function setBadge(id,n){const el=$(id);if(!el)return;el.textContent=n>99?'99+':n;el.classList.toggle('hidden',n===0);}

function listItem(item){
const d=document.createElement('div');d.className='list-item';
d.onclick=()=>{if(item.type==='contact')openContact(item.uid);else openChat(item.id);};
const av=item.type==='channel'?'avatar ch':'avatar';
d.innerHTML=`<div class="${av}" style="background:${item.col}">${esc(item.ini)}${item.online?'<div class="online-dot"></div>':''}</div>
<div class="li-body"><div class="li-row"><span class="li-name">${esc(item.title)}</span><span class="li-time">${item.lastTs?ago(item.lastTs):''}</span></div>
<div class="li-preview">${esc(item.last||item.sub)}</div></div>
${item.unread?`<span class="badge">${item.unread}</span>`:''}`;
return d;
}
function contactListItem(item){
const d=document.createElement('div');d.className='list-item';
d.onclick=()=>openContact(item.uid);
d.innerHTML=`<div class="avatar" style="background:${item.col}">${esc(item.ini)}${item.online?'<div class="online-dot"></div>':''}</div>
<div class="li-body"><div class="li-row"><span class="li-name">${esc(item.title)}</span></div>
<div class="li-preview">${esc(item.sub)}</div></div>
<button class="icon-btn" onclick="event.stopPropagation();openDM('${item.uid}')">💬</button>`;

// ---- ОТКРЫТЬ ЧАТ ----
function openChat(id){activeChat=id;replyMsg=null;
$('chatScreen').classList.add('open');
renderChatHeader();renderMsgs();markRead(id);buildComposer();
}
function openDM(uid){
let chat=Object.values(db.chats).find(c=>c.type==='dm'&&c.parts.includes(me.id)&&c.parts.includes(uid));
if(!chat){const cid='dm_'+[me.id,uid].sort().join('_');chat={id:cid,type:'dm',parts:[me.id,uid],created:Date.now()};db.chats[cid]=chat;db.msgs[cid]=[];save();}
closeContact();openChat(chat.id);
}
function closeChat(){$('chatScreen').classList.remove('open');activeChat=null;renderList();}

function renderChatHeader(){
const chat=db.chats[activeChat],cn=db.channels.find(c=>c.id===activeChat);
if(cn){$('chName').textContent=cn.name;$('chStatus').textContent=cn.desc;}
else if(chat&&chat.type==='dm'){const oid=chat.parts.find(p=>p!==me.id),o=db.users[oid]||{};$('chName').textContent=o.name||'?';$('chStatus').textContent=o.online?'● в сети':(o.dept||'');}
else if(chat&&chat.type==='group'){$('chName').textContent=chat.title||'Группа';const cnt=chat.parts.length;$('chStatus').textContent=cnt+' участн.';}
}

// ---- НОВЫЙ ЧАТ / ГРУППА ----
function openNewChat(){
const bg=document.createElement('div');bg.className='modal-bg';bg.onclick=e=>{if(e.target===bg)bg.remove();};
const sh=document.createElement('div');sh.className='modal-sheet';
const contacts=getContacts();
sh.innerHTML=`<h3>Новый чат</h3>
<div style="display:flex;gap:8px;margin-bottom:16px">
<button class="btn-main" style="flex:1" onclick="this.closest('.modal-bg').remove();showGroupCreator()">👥 Создать группу</button>
</div>
<div style="font-size:13px;color:var(--text2);margin-bottom:10px;font-weight:600">ИЛИ ЛИЧНЫЙ ЧАТ</div>
<div style="max-height:300px;overflow-y:auto">
${contacts.map(c=>`<div class="list-item" onclick="this.closest('.modal-bg').remove();openDM('${c.uid}')">
<div class="avatar sm" style="background:${c.col}">${esc(c.ini)}${c.online?'<div class="online-dot"></div>':''}</div>
<div class="li-body"><div class="li-name">${esc(c.title)}</div><div class="li-preview">${esc(c.sub)}</div></div>
</div>`).join('')}
</div>`;
bg.appendChild(sh);document.body.appendChild(bg);
}
function showGroupCreator(){
const bg=document.createElement('div');bg.className='modal-bg';bg.onclick=e=>{if(e.target===bg)bg.remove();};
const sh=document.createElement('div');sh.className='modal-sheet';
const contacts=getContacts();
let selected=new Set();
sh.innerHTML=`<h3>Создать группу</h3>
<div class="ng-field"><label>Название группы</label><input class="input" id="gTitle" placeholder="Например: Проект «Локомотив»"></div>
<div class="ng-field"><label>Участники (выберите из списка)</label>
<div class="ng-users" id="gUsers">
${contacts.map(c=>`<button class="ng-user" data-uid="${c.uid}" onclick="toggleGroupUser(this,'${c.uid}')">
<span class="ng-av" style="background:${c.col}">${esc(c.ini)}</span>${esc(c.title.split(' ')[0])}
</button>`).join('')}
</div></div>
<button class="btn-main" onclick="createGroup()">Создать группу</button>`;
bg.appendChild(sh);document.body.appendChild(bg);
window.toggleGroupUser=function(btn,uid){
if(selected.has(uid)){selected.delete(uid);btn.classList.remove('selected');}
else{selected.add(uid);btn.classList.add('selected');}
window._groupSel=selected;
};
window.createGroup=function(){
const title=$('gTitle')?.value.trim()||'Новая группа';
const members=[...selected];
if(!members.length)return toast('Выберите хотя бы одного участника');
const parts=[me.id,...members];
const cid=gid('grp');
db.chats[cid]={id:cid,type:'group',title,parts,createdBy:me.id,created:Date.now()};
db.msgs[cid]=[{id:gid('m'),from:'system',chatId:cid,text:'Группа создана: '+title,ts:Date.now(),reactions:{}}];
save();
// Уведомляем участников
members.forEach(uid=>post({type:'group_created',chatId:cid,userId:uid}));
document.querySelector('.modal-bg')?.remove();
openChat(cid);
toast('Группа «'+title+'» создана');
};
}

// ---- СООБЩЕНИЯ ----
function renderMsgs(){
const el=$('msgsEl');el.innerHTML='';
const msgs=db.msgs[activeChat]||[];
if(!msgs.length){el.innerHTML='<div class="empty-list"><div class="ei">✨</div>Начните диалог — напишите первое сообщение</div>';return;}
let lastDay='';
msgs.forEach(m=>{
const day=fmtD(m.ts);if(day!==lastDay){el.innerHTML+=`<div class="date-sep"><span>${day}</span></div>`;lastDay=day;}
el.appendChild(msgNode(m));
});
setTimeout(()=>el.scrollTop=el.scrollHeight,30);
}
function msgNode(m){
const isMe=m.from===me.id,isSys=m.from==='system';
const w=document.createElement('div');w.className='msg '+(isSys?'sys':isMe?'me':'other');
w.dataset.mid=m.id;
let h='';
if(!isMe&&!isSys){const cn=db.channels.find(c=>c.id===activeChat);const gr=db.chats[activeChat];if(cn||gr?.type==='group'){const s=db.users[m.from];h+=`<div class="sender" style="color:${col(m.from)}">${esc(s?.name||'?')}</div>`;}}
if(m.replyTo){const orig=(db.msgs[activeChat]||[]).find(x=>x.id===m.replyTo);if(orig){const ou=db.users[orig.from];h+=`<div class="reply-ref" onclick="scrollToM('${orig.id}')"><b>${esc(ou?.name?.split(' ')[0]||'?')}</b>: ${esc((orig.text||'📎').slice(0,50))}</div>`;}}
h+='<div class="bubble">';
if(m.deleted)h+='<em>🗑 Сообщение удалено</em>';
else{if(m.text)h+=linkify(esc(m.text));if(m.file)h+=`<div class="file-att" onclick="dlFile('${m.id}')"><span class="fi">${fIcon(m.file.type)}</span><span class="fn">${esc(m.file.name)}</span><span class="fs">${sz(m.file.size)}</span></div>`;}
h+='</div>';
h+=`<div class="m-meta">${fmtT(m.ts)}${m.edited?' · изм.':''}${isMe&&!isSys?`<span class="check${m.status==='read'?' read':''}">${{'sending':'🕐','sent':'✓','delivered':'✓✓','read':'✓✓'}[m.status]||''}</span>`:''}</div>`;
if(m.reactions&&Object.keys(m.reactions).length){h+='<div class="reactions">';Object.entries(m.reactions).forEach(([em,uids])=>{if(!uids.length)return;h+=`<button class="rpill${uids.includes(me.id)?' mine':''}" onclick="event.stopPropagation();toggleReact('${m.id}','${em}')">${em} ${uids.length}</button>`;});h+='</div>';}
w.innerHTML=h;
w.addEventListener('contextmenu',e=>{e.preventDefault();msgCtx(e,m);});
w.addEventListener('dblclick',()=>{if(!m.deleted)toggleReact(m.id,'👍');});
let lpTimer;
w.addEventListener('touchstart',()=>{lpTimer=setTimeout(()=>msgCtx({clientX:innerWidth/2,clientY:innerHeight/2},m),500);});
w.addEventListener('touchend',()=>clearTimeout(lpTimer));
w.addEventListener('touchmove',()=>clearTimeout(lpTimer));
return w;
}
function linkify(t){return t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');}
function fIcon(t){if(!t)return'📄';if(t.startsWith('image/'))return'🖼️';if(t.startsWith('video/'))return'🎬';if(t.startsWith('audio/'))return'🎵';if(t.includes('pdf'))return'📕';if(/zip|rar|7z/.test(t))return'📦';if(/sheet|excel|csv/.test(t))return'📊';if(/word|doc/.test(t))return'📝';return'📄';}
function scrollToM(mid){const el=document.querySelector(`[data-mid="${mid}"]`);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.boxShadow='0 0 0 2px var(--brand)';setTimeout(()=>el.style.boxShadow='',1500);}}
function dlFile(mid){const m=(db.msgs[activeChat]||[]).find(x=>x.id===mid);if(!m||!m.file)return;const a=document.createElement('a');a.href=m.file.data;a.download=m.file.name;a.click();}

// ---- ОТПРАВКА ----
function sendMsg(text,file){
if(!activeChat||(!text&&!file))return;
const m={id:gid('m'),from:me.id,chatId:activeChat,text:text||'',file:file||null,replyTo:replyMsg?replyMsg.id:null,ts:Date.now(),status:'sending',reactions:{},edited:false,deleted:false};
if(!db.msgs[activeChat])db.msgs[activeChat]=[];
db.msgs[activeChat].push(m);save();
renderMsgs();post({type:'msg',chatId:activeChat,payload:m});
setTimeout(()=>{m.status='delivered';save();if(activeChat===m.chatId)renderMsgs();},300);
replyMsg=null;buildComposer();
}

// ---- КОМПОЗЕР ----
function buildComposer(){
const el=$('composerEl');el.innerHTML='';
if(replyMsg){const rb=document.createElement('div');rb.className='reply-bar';rb.innerHTML=`<b>↩</b><span class="rt">${esc((db.users[replyMsg.from]?.name||'')+': '+(replyMsg.text||'📎').slice(0,60))}</span><button class="rx" onclick="cancelReply()">✕</button>`;el.appendChild(rb);}
const row=document.createElement('div');row.style.cssText='display:flex;align-items:flex-end;gap:8px;width:100%';
const att=document.createElement('button');att.className='att-btn';att.textContent='📎';att.onclick=()=>$('fileIn').click();
const fi=document.createElement('input');fi.type='file';fi.id='fileIn';fi.className='hidden';fi.onchange=e=>handleFile(e.target.files[0]);
const ta=document.createElement('textarea');ta.className='comp-input';ta.placeholder='Сообщение…';ta.rows=1;
ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,120)+'px';emitTyping();};
ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg(ta.value.trim());ta.value='';ta.style.height='auto';}};
const sb=document.createElement('button');sb.className='send-btn';sb.textContent='➤';sb.onclick=()=>{sendMsg(ta.value.trim());ta.value='';ta.style.height='auto';};
row.append(att,fi,ta,sb);el.appendChild(row);
}
function cancelReply(){replyMsg=null;buildComposer();}
function handleFile(f){if(!f)return;if(f.size>10*1024*1024)return toast('Файл больше 10 МБ');const r=new FileReader();r.onload=()=>{sendMsg('',{name:f.name,size:f.size,type:f.type,data:r.result});};r.readAsDataURL(f);}

// ---- TYPING ----
function emitTyping(){clearTimeout(typTimer);typTimer=setTimeout(()=>{},2000);post({type:'typing',chatId:activeChat,name:me.name});}
function showTyping(cid,name){if(cid!==activeChat)return;const el=$('msgsEl');let ind=el.parentElement.querySelector('.typing-ind');if(!ind){ind=document.createElement('div');ind.className='typing-ind';ind.style.cssText='font-size:13px;color:var(--brand);padding:4px 14px;min-height:18px;font-weight:500';el.parentElement.insertBefore(ind,$('composerEl'));}ind.textContent=name.split(' ')[0]+' печатает…';setTimeout(()=>{if(ind)ind.textContent='';},3000);}

// ---- READ RECEIPTS ----
function markRead(cid){if(!me)return;if(!db.reads[cid])db.reads[cid]={};db.reads[cid][me.id]=Date.now();save();post({type:'read',chatId:cid,upTo:Date.now()});}
function applyRead(cid,upTo){(db.msgs[cid]||[]).forEach(m=>{if(m.from===me.id&&m.ts<=upTo)m.status='read';});save();if(activeChat===cid)renderMsgs();}

// ---- РЕАКЦИИ ----
function toggleReact(mid,emoji){
const m=(db.msgs[activeChat]||[]).find(x=>x.id===mid);if(!m)return;
if(!m.reactions)m.reactions={};if(!m.reactions[emoji])m.reactions[emoji]=[];
const i=m.reactions[emoji].indexOf(me.id);if(i>=0)m.reactions[emoji].splice(i,1);else m.reactions[emoji].push(me.id);
if(!m.reactions[emoji].length)delete m.reactions[emoji];
save();post({type:'react',chatId:activeChat,msgId:mid,emoji,userId:me.id});renderMsgs();
}
function applyReact(cid,mid,emoji,uid){const m=(db.msgs[cid]||[]).find(x=>x.id===mid);if(!m)return;if(!m.reactions)m.reactions={};if(!m.reactions[emoji])m.reactions[emoji]=[];const i=m.reactions[emoji].indexOf(uid);if(i>=0)m.reactions[emoji].splice(i,1);else m.reactions[emoji].push(uid);save();if(activeChat===cid)renderMsgs();}

// ---- ПРИЁМ СООБЩЕНИЙ ----
function recvMsg(cid,payload){
if(!db.msgs[cid])db.msgs[cid]=[];
if(db.msgs[cid].some(m=>m.id===payload.id))return;
db.msgs[cid].push(payload);save();
if(activeChat===cid){renderMsgs();markRead(cid);}
else notifyUser(payload);
renderList();updateBadges();
}

// ---- PUSH / NOTIF ----
function notifyUser(m){
const sender=db.users[m.from]||{name:'Неизвестный'};
const title=sender.name;const body=(m.text||'📎 Файл').slice(0,100);
if('Notification'in window&&Notification.permission==='granted'){try{const n=new Notification(title,{body,tag:m.id,silent:false});n.onclick=()=>{window.focus();openChat(m.chatId);n.close();};}catch(e){}}
toast(title+': '+body);
}
async function requestPush(){
if(!('serviceWorker'in navigator))return;
try{
const reg=await navigator.serviceWorker.register('./sw.js');
if('Notification'in window&&Notification.permission==='default'){
const perm=await Notification.requestPermission();
if(perm==='granted')subscribePush(reg);
}else if(Notification.permission==='granted'){subscribePush(reg);}
}catch(e){console.warn('SW:',e);}
}
async function subscribePush(reg){try{const sub=await reg.pushManager.subscribe({userVisibleOnly:true});console.log('Push subscribed:',sub.endpoint);}catch(e){console.warn('Push sub:',e);}}

// ---- КОНТЕКСТНОЕ МЕНЮ ----
function msgCtx(e,m){
const menu=document.createElement('div');menu.style.cssText='position:fixed;left:'+Math.min(e.clientX,innerWidth-220)+'px;top:'+Math.min(e.clientY,innerHeight-280)+'px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:6px;z-index:9000;min-width:200px;box-shadow:0 8px 32px rgba(0,0,0,.15)';
const items=[
{l:'↩ Ответить',f:()=>{replyMsg=m;buildComposer();}},
{l:'📋 Копировать текст',f:()=>{navigator.clipboard?.writeText(m.text||'');toast('Скопировано');}},
{l:'sep'},
{l:'😀 Реакции',f:()=>{const ems=['👍','❤️','😂','😮','😢','🎉','✅','🔥'];const row=document.createElement('div');row.style.cssText='display:flex;gap:4px;padding:6px 8px;flex-wrap:wrap';ems.forEach(em=>{const b=document.createElement('button');b.textContent=em;b.style.cssText='font-size:22px;padding:4px;border-radius:6px;background:0;border:0;cursor:pointer';b.onclick=()=>{toggleReact(m.id,em);menu.remove();};row.appendChild(b);});menu.appendChild(row);}},
];
if(m.from===me.id&&!m.deleted){items.push({l:'sep'});items.push({l:'✏️ Редактировать',f:()=>{const v=prompt('Новый текст:',m.text);if(v!=null&&v!==m.text){m.text=v;m.edited=true;save();renderMsgs();}}});items.push({l:'🗑 Удалить',danger:true,f:()=>{if(Date.now()-m.ts>900000)return toast('Можно удалять только сообщения младше 15 минут');m.deleted=true;save();renderMsgs();}});}
items.forEach(it=>{if(it.l==='sep'){const s=document.createElement('div');s.style.cssText='height:1px;background:var(--border);margin:4px 0';menu.appendChild(s);return;}
const b=document.createElement('button');b.textContent=it.l;b.style.cssText='display:block;width:100%;text-align:left;padding:10px 14px;border-radius:8px;font-size:15px;background:0;border:0;color:'+(it.danger?'var(--red)':'var(--text)');b.onclick=()=>{it.f();menu.remove();};menu.appendChild(b);});
document.body.appendChild(menu);
setTimeout(()=>{const off=()=>{menu.remove();document.removeEventListener('click',off);};document.addEventListener('click',off);},0);
}

// ---- ИНФО ЧАТА ----
function chatInfo(){
const chat=db.chats[activeChat],cn=db.channels.find(c=>c.id===activeChat);
let rows=[],actions=[];
if(cn){rows=[['Тип','Канал'],['Название',cn.name],['Описание',cn.desc],['Доступ',cn.roles.length?cn.roles.join(', '):'Все'],['Сообщений',(db.msgs[cn.id]||[]).length]];}
else if(chat&&chat.type==='dm'){const oid=chat.parts.find(p=>p!==me.id),o=db.users[oid]||{};rows=[['Тип','Личный чат'],['Имя',o.name||'?'],['Подразделение',o.dept||'—'],['Должность',o.pos||'—'],['Табельный',o.badge||'—'],['Статус',o.online?'Онлайн':'Офлайн'],['Сообщений',(db.msgs[chat.id]||[]).length]];}
else if(chat&&chat.type==='group'){rows=[['Тип','Групповой чат'],['Название',chat.title||'Группа'],['Создан',new Date(chat.created).toLocaleDateString('ru-RU')],['Участников',chat.parts.length],['Сообщений',(db.msgs[chat.id]||[]).length]];
actions.push({l:'👥 Показать участников',f:()=>{showGroupMembers(chat);}});}
actions.push({l:'🧹 Очистить историю',f:()=>{if(confirm('Очистить всю историю?')){db.msgs[activeChat]=[];save();renderMsgs();document.querySelector('.modal-bg')?.remove();}}});
actions.push({l:'📥 Экспорт .txt',f:()=>{exportChat();document.querySelector('.modal-bg')?.remove();}});
showSheet('Информация',rows,actions);
}
function showGroupMembers(chat){
const bg=document.createElement('div');bg.className='modal-bg';bg.onclick=e=>{if(e.target===bg)bg.remove();};
const sh=document.createElement('div');sh.className='modal-sheet';
sh.innerHTML='<h3>Участники ('+chat.parts.length+')</h3>'+chat.parts.map(pid=>{
const u=db.users[pid];if(!u)return'';
return`<div class="gm-item"><div class="gm-avatar" style="background:${col(pid)}">${esc(ini(u.name))}</div><div class="gm-info"><div class="gm-name">${esc(u.name)}${pid===me.id?' (Вы)':''}</div><div class="gm-pos">${esc(u.dept)} · ${esc(u.pos)}</div></div></div>`;
}).join('');
const cl=document.createElement('button');cl.className='btn-main';cl.textContent='Закрыть';cl.style.marginTop='16px';cl.onclick=()=>bg.remove();sh.appendChild(cl);
bg.appendChild(sh);document.body.appendChild(bg);
}
function exportChat(){
const msgs=db.msgs[activeChat]||[];
const lines=msgs.map(m=>{const u=db.users[m.from];return`[${new Date(m.ts).toLocaleString('ru-RU')}] ${u?.name||m.from}: ${m.deleted?'(удалено)':(m.text||'')}${m.file?' [файл: '+m.file.name+']':''}`;}).join('\n');
const blob=new Blob([lines],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chat_export_'+Date.now()+'.txt';a.click();
}
function showSheet(title,rows,actions){
const bg=document.createElement('div');bg.className='modal-bg';bg.onclick=e=>{if(e.target===bg)bg.remove();};
const sh=document.createElement('div');sh.className='modal-sheet';
sh.innerHTML='<h3>'+esc(title)+'</h3>'+rows.map(r=>'<div class="m-row"><span class="m-key">'+esc(r[0])+'</span><span class="m-val">'+esc(String(r[1]))+'</span></div>').join('');
if(actions){const aw=document.createElement('div');aw.style.marginTop='16px';actions.forEach(a=>{const b=document.createElement('button');b.className='btn-ghost';b.textContent=a.l;b.onclick=a.f;aw.appendChild(b);});sh.appendChild(aw);}
const cl=document.createElement('button');cl.className='btn-main';cl.textContent='Закрыть';cl.style.marginTop='12px';cl.onclick=()=>bg.remove();sh.appendChild(cl);
bg.appendChild(sh);document.body.appendChild(bg);
}

// ---- ПРОФИЛЬ ----

const rows=[['ФИО',me.name],['Табельный номер',me.badge],['Подразделение',me.dept],['Должность',me.pos],['Роль',me.role.toUpperCase()],['Телефон',me.phone||'—'],['Email',me.email||'—']];
showSheet('Мой профиль',rows,[
{l:'🔔 Разрешить уведомления',f:()=>{requestPush();toast('Запрос разрешения отправлен');document.querySelector('.modal-bg')?.remove();}},

}

// ---- ЭКРАН КОНТАКТА ----
function openContact(uid){
activeContact=uid;const u=db.users[uid];if(!u)return;
$('contactScreen').classList.add('open');
const body=$('contactBody');body.innerHTML='';
const hero=document.createElement('div');hero.className='contact-hero';
hero.innerHTML=`<div class="avatar" style="background:${col(uid)};width:88px;height:88px;font-size:32px;margin:0 auto 12px;position:relative">${esc(ini(u.name))}${u.online?'<div class="online-dot" style="width:18px;height:18px;border-width:3px"></div>':''}</div>
<h2>${esc(u.name)}</h2>
<div class="dept">${esc(u.dept)} · ${esc(u.pos)}</div>
<span class="badge-role">${esc(u.role)}</span>`;
body.appendChild(hero);
const actions=document.createElement('div');actions.className='contact-actions';
actions.innerHTML=`<button onclick="openDM('${uid}')">💬 Написать сообщение</button>
<button class="sec" onclick="callNumber('${esc(u.phone||'')}')">📞 Позвонить</button>`;
body.appendChild(actions);
const info=document.createElement('div');info.className='info-grid';
