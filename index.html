<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e10" />
<title>KZ Messenger</title>
<style>
/* ===== TOKENS ===== */
:root,[data-theme="dark"]{--bg:#0e0e10;--panel:#16161a;--panel2:#1e1e24;--panel3:#222228;--line:#2a2a2e;--txt:#e8e8e8;--mut:#8a8a92;--acc:#1a73e8;--acc2:#1557b0;--ok:#0d904f;--warn:#e37400;--err:#d93025;--read:#4fc3f7;--shadow:0 8px 28px rgba(0,0,0,.45)}
[data-theme="light"]{--bg:#f4f5f7;--panel:#fff;--panel2:#eef0f3;--panel3:#e7e9ee;--line:#e2e4e8;--txt:#15171a;--mut:#6b7280;--acc:#1a73e8;--acc2:#1557b0;--ok:#0d904f;--warn:#e37400;--err:#d93025;--read:#1565c0;--shadow:0 8px 28px rgba(20,30,60,.12)}
*{box-sizing:border-box}
html,body,#app{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
a{color:var(--acc)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--mut)}
.boot{height:100%;display:flex;align-items:center;justify-content:center;color:var(--mut)}
/* ===== AVATAR / BADGE ===== */
.avatar{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;position:relative;flex:0 0 auto;user-select:none}
.avatar.online::after{content:"";position:absolute;right:1px;bottom:1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--panel)}
.badge{background:var(--acc);color:#fff;border-radius:10px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:0 5px}
/* ===== SHELL ===== */
.shell{display:flex;height:100vh;overflow:hidden}
.sidebar{width:330px;flex:0 0 330px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);z-index:40}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.sb-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sb-head .who{flex:1;min-width:0}.sb-head .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sb-head .rl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:11px 0;color:var(--mut);border-bottom:2px solid transparent;transition:.15s;font-size:13px}
.tab:hover{color:var(--txt)}.tab.active{color:var(--acc);border-color:var(--acc)}
.search{padding:10px 12px}.search input{padding-left:32px;background:var(--panel2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='%23888' viewBox='0 0 16 16'><path d='M11.7 10.3a5 5 0 1 0-1.4 1.4l3 3 1.4-1.4-3-3zM7 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z'/></svg>") no-repeat 10px center}
.list{flex:1;overflow:auto;padding-bottom:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;text-align:left;border-left:3px solid transparent;transition:.12s}
.item:hover{background:var(--panel2)}.item.active{background:var(--panel2);border-left-color:var(--acc)}
.item .inf{flex:1;min-width:0}.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.item .pv{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.item .tm{font-size:11px;color:var(--mut)}
.pin{font-size:10px}.mute-ic{font-size:11px;opacity:.6}
.empty{padding:28px 16px;text-align:center;color:var(--mut);font-size:13px}
/* ===== CHAT ===== */
.chat{display:flex;flex-direction:column;height:100%;min-width:0}
.ch-head{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-height:60px}
.ch-head .inf{flex:1;min-width:0}.ch-head .nm{font-weight:600}.ch-head .st{font-size:12px;color:var(--mut)}
.ch-head .acts{display:flex;gap:2px}.icon{padding:8px;border-radius:8px;line-height:1}.icon:hover{background:var(--panel2)}
.burger{display:none}
.msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font-size:12px;color:var(--mut);background:var(--panel2);border-radius:12px;padding:4px 12px;margin:8px 0}
.msg{max-width:64%;display:flex;flex-direction:column;position:relative;animation:pop .12s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.out{align-self:flex-end;align-items:flex-end}.msg.in{align-self:flex-start}.msg.system{align-self:center;max-width:90%}
.msg .sender{font-size:11px;font-weight:600;padding:0 4px 1px}
.msg .reply-ref{font-size:12px;color:var(--mut);border-left:3px solid var(--acc);padding:2px 8px;margin-bottom:2px;background:var(--panel2);border-radius:0 6px 6px 0;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble{padding:8px 13px;border-radius:14px;word-break:break-word;white-space:normal}
.msg.out .bubble{background:var(--acc);color:#fff;border-bottom-right-radius:4px}
.msg.in .bubble{background:var(--panel3);border-bottom-left-radius:4px}
.msg.system .bubble{background:none;color:var(--mut);font-size:12px;text-align:center}
.msg.deleted .bubble{background:none!important;color:var(--mut);font-style:italic;border:1px dashed var(--line)}
.bubble code{background:rgba(0,0,0,.25);padding:1px 5px;border-radius:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.msg.in .bubble code{background:rgba(0,0,0,.18)}
.file{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.16);border-radius:8px;padding:7px 10px;margin-top:4px;color:inherit;text-decoration:none}
.msg.in .file{background:rgba(255,255,255,.05)}
.file .fi{font-size:22px}.file .fn{font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file .fs{font-size:11px;opacity:.7}
.meta2{font-size:10px;color:var(--mut);display:flex;gap:4px;padding:2px 4px;align-items:center}
.msg.out .meta2{color:rgba(255,255,255,.6)}
.check.read{color:var(--read)}
.edited{font-style:italic;opacity:.7}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.react{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:1px 7px;font-size:12px;transition:.12s}
.react:hover{border-color:var(--acc)}.react.mine{border-color:var(--acc);background:rgba(26,115,232,.18)}
.typing{font-size:12px;color:var(--acc);padding:2px 18px;min-height:18px}
/* ===== COMPOSER ===== */
.composer{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px}
.composer .row{display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;resize:none;max-height:160px;min-height:42px;line-height:1.4}
.send{background:var(--acc);color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;flex:0 0 auto;transition:.12s;display:flex;align-items:center;justify-content:center}
.send:hover{background:var(--acc2);transform:scale(1.04)}.send:active{transform:scale(.96)}
.reply-bar{display:flex;gap:8px;align-items:center;background:var(--panel2);border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12px}
.reply-bar b{color:var(--acc)}.reply-bar .rt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.reply-bar .x{margin-left:auto;color:var(--mut);font-size:16px}.reply-bar .x:hover{color:var(--txt)}
/* ===== PAGES ===== */
.page{padding:22px;overflow:auto;height:100%}.page h2{margin:0 0 6px}.page .sub{color:var(--mut);margin:0 0 18px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card-mini{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:.15s}
.card-mini:hover{border-color:var(--acc);transform:translateY(-2px)}.card-mini.locked{opacity:.4;cursor:not-allowed}.card-mini.locked:hover{transform:none;border-color:var(--line)}
.cm-av{width:48px;height:48px;border-radius:12px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.cm-nm{font-weight:600}.cm-rl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--panel2);color:var(--mut);text-transform:uppercase}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.set-row .lbl{font-weight:500}.set-row .hint{font-size:12px;color:var(--mut);margin-top:2px}
.set-row select,.set-row button{width:auto;min-width:120px}
.btn{border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--panel2);transition:.12s}
.btn:hover{border-color:var(--acc)}.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}.btn.primary:hover{background:var(--acc2)}
.btn.danger{color:var(--err);border-color:var(--err)}.btn.danger:hover{background:rgba(217,48,37,.12)}
.placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:15px;flex-direction:column;gap:8px}
.placeholder .big{font-size:42px;opacity:.4}
/* ===== LOGIN ===== */
.login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(1200px 600px at 50% -10%,rgba(26,115,232,.18),transparent 60%)}
.login .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;width:360px;max-width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.login h1{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.login .logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.login .sub{color:var(--mut);font-size:12.5px;margin:0;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--mut);font-weight:600}
/* ===== CTX / MODAL / TOAST ===== */
.ctx{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:9999;min-width:190px;box-shadow:var(--shadow);animation:pop .1s}
.ctx-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px;border-radius:6px;font-size:13px}
.ctx-i:hover{background:var(--panel2)}.ctx-i.danger{color:var(--err)}
.ctx-sep{height:1px;background:var(--line);margin:4px 2px}
.ctx-emis{display:flex;gap:2px;padding:4px 6px;flex-wrap:wrap}
.ctx-emis span{font-size:18px;cursor:pointer;padding:2px 4px;border-radius:6px}.ctx-emis span:hover{background:var(--panel2)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:380px;max-width:100%;box-shadow:var(--shadow);animation:pop .15s}
.modal h3{margin:0 0 14px}.modal .mrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.modal .mrow:last-child{border:0}.modal .mrow .k{color:var(--mut)}
.toasts{position:fixed;top:16px;right:16px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);opacity:0;transform:translateX(20px);transition:.3s;font-size:13px}
.toast.in{opacity:1;transform:none}.toast.success{border-left-color:var(--ok)}.toast.error{border-left-color:var(--err)}.toast.warn{border-left-color:var(--warn)}
.note{font-size:12px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.5}
/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .sidebar{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .burger{display:inline-flex}
  .msg{max-width:86%}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
}
</style>
</head>
<body>
<div id="app"><div class="boot">Загрузка KZ Messenger…</div></div>
<script>
(function(){
"use strict";
/* ============================================================
   KZ Messenger — single-file corporate messenger (demo mode)
   Реалтайм между вкладками: BroadcastChannel (+ storage fallback).
   По file:// часть браузеров режет шину — тогда работает
   одновкладочный режим с сидами и кнопкой «симулировать входящее».
   ============================================================ */

/* ---------- 0. УТИЛИТЫ ---------- */
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return ESC[c];});}
function pad(n){return String(n).padStart(2,'0');}
function timeOf(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());}
function dateLabel(ts){var d=new Date(ts),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);
  if(d.toDateString()===n.toDateString())return T('today');
  if(d.toDateString()===y.toDateString())return T('yesterday');
  return d.toLocaleDateString(lang()==='en'?'en-US':'ru-RU',{day:'numeric',month:'short',year:d.getFullYear()!==n.getFullYear()?'numeric':undefined});}
function sizeOf(b){if(!b)return'';var u=['B','KB','MB','GB'],i=0;while(b>=1024&&i<u.length-1){b/=1024;i++;}return b.toFixed(i?1:0)+' '+u[i];}
function md(t){var h=esc(t);h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/_([^_]+)_/g,'<em>$1</em>');h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');return h.replace(/\n/g,'<br>');}
function initials(n){var p=String(n||'?').trim().split(/\s+/);return (p.length>1?p[0][0]+p[1][0]:String(n).slice(0,2)).toUpperCase();}
function colorOf(id){var c=['#d93025','#e37400','#f9ab00','#0d904f','#1a73e8','#673ab7','#e91e63','#00bcd4','#8bc34a','#ff5722','#009688','#795548'],h=0,s=String(id||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return c[Math.abs(h)%c.length];}
function uid(p){return (p||'x')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function now(){return Date.now();}
function clampScroll(el){var wasBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;return wasBottom;}

/* ---------- 1. DOM ХЕЛПЕР ---------- */
function el(tag,props){
  var n=document.createElement(tag);
  if(props)for(var k in props){var v=props[k];if(v==null||v===false)continue;
    if(k==='class')n.className=v;
    else if(k==='html')n.innerHTML=v;
    else if(k==='text')n.textContent=v;
    else if(k==='style'&&typeof v==='object')Object.assign(n.style,v);
    else if(k==='dataset')Object.assign(n.dataset,v);
    else if(k==='on'&&typeof v==='object')for(var ev in v)n.addEventListener(ev,v[ev]);
    else n.setAttribute(k,v===true?'':v);}
  for(var i=2;i<arguments.length;i++)app(n,arguments[i]);
  return n;
}
function app(p,kids){kids=Array.isArray(kids)?kids:[kids];for(var i=0;i<kids.length;i++){var c=kids[i];if(c==null||c===false)continue;
  if(Array.isArray(c))app(p,c);else p.appendChild(typeof c==='object'&&c.nodeType?c:document.createTextNode(String(c)));}return p;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);return n;}

/* ---------- 2. РЕАКТИВНЫЙ СТОР ---------- */
function mkStore(init){var st=Object.assign({},init),subs=[];
  return{get:function(){return st;},
    set:function(p){st=Object.assign({},st,typeof p==='function'?p(st):p);subs.forEach(function(f){try{f(st);}catch(e){console.error(e);}});},
    sub:function(f){subs.push(f);f(st);return function(){subs=subs.filter(function(x){return x!==f;});};}};}

/* ---------- 3. i18n + THEME ---------- */
var DICT={
 ru:{chats:'Чаты',channels:'Каналы',contacts:'Контакты',settings:'Настройки',login:'Войти',logout:'Выйти',
   typeHere:'Написать сообщение…',send:'Отправить',search:'Поиск…',online:'в сети',offline:'не в сети',
   typing:'печатает…',today:'Сегодня',yesterday:'Вчера',noChats:'Нет чатов. Начните переписку из «Контактов».',
   pickChat:'← Выберите чат',name:'Имя',role:'Роль',theme:'Тема',lang:'Язык',dark:'Тёмная',light:'Светлая',
   you:'Вы',reply:'Ответить',copy:'Копировать',star:'В избранное',unstar:'Убрать из избранного',
   edit:'Изменить',del:'Удалить',pin:'Закрепить',unpin:'Открепить',mute:'Без звука',unmute:'Со звуком',
   delChat:'Удалить чат',info:'Информация',clearHist:'Очистить историю',export:'Экспорт .txt',
   members:'участников',desc:'Описание',access:'Доступ',all:'все',saved:'Сохранено',copied:'Скопировано',
   demoNote:'Демо‑режим без сервера. Для realtime между вкладками откройте через http (npx serve .) или используйте «Симулировать входящее».',
   simIn:'Симулировать входящее',reset:'Сбросить все данные',resetQ:'Удалить ВСЮ историю и пользователей? Действие необратимо.',
   newMsg:'Новое сообщение',from:'от',to:'кому',createDm:'Написать',lockedCh:'Недостаточно прав для этого канала',
   emptyMsgs:'Пока нет сообщений. Напишите первым!',fileTooBig:'Файл больше 10 МБ',
   editPh:'Новый текст сообщения',delLimit:'Удалять можно только свои сообщения не старше 15 минут',
   notifOn:'Уведомления включены',notifOff:'Уведомления отклонены браузером'},
 en:{chats:'Chats',channels:'Channels',contacts:'Contacts',settings:'Settings',login:'Sign in',logout:'Sign out',
   typeHere:'Type a message…',send:'Send',search:'Search…',online:'online',offline:'offline',
   typing:'typing…',today:'Today',yesterday:'Yesterday',noChats:'No chats. Start from Contacts.',
   pickChat:'← Select a chat',name:'Name',role:'Role',theme:'Theme',lang:'Language',dark:'Dark',light:'Light',
   you:'You',reply:'Reply',copy:'Copy',star:'Star',unstar:'Unstar',
   edit:'Edit',del:'Delete',pin:'Pin',unpin:'Unpin',mute:'Mute',unmute:'Unmute',
   delChat:'Delete chat',info:'Info',clearHist:'Clear history',export:'Export .txt',
   members:'members',desc:'Description',access:'Access',all:'all',saved:'Saved',copied:'Copied',
   demoNote:'Demo mode without a server. For cross‑tab realtime open via http (npx serve .) or use “Simulate incoming”.',
   simIn:'Simulate incoming',reset:'Reset all data',resetQ:'Delete ALL history and users? Irreversible.',
   newMsg:'New message',from:'from',to:'to',createDm:'Message',lockedCh:'Not enough rights for this channel',
   emptyMsgs:'No messages yet. Say hi!',fileTooBig:'File larger than 10 MB',
   editPh:'New message text',delLimit:'You can delete only your own messages younger than 15 min',
   notifOn:'Notifications enabled',notifOff:'Notifications denied by browser'}
};
function lang(){return localStorage.getItem('kz_lang')||'ru';}
function setLang(l){localStorage.setItem('kz_lang',l);document.documentElement.lang=l;}
function T(k){var L=DICT[lang()]||DICT.ru;return L[k]!=null?L[k]:(DICT.ru[k]!=null?DICT.ru[k]:k);}
function theme(){return localStorage.getItem('kz_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme());}
function toggleTheme(){localStorage.setItem('kz_theme',theme()==='dark'?'light':'dark');applyTheme();}

/* ---------- 4. DB СЛОЙ (localStorage + шина) ---------- */
var DB_KEY='kz_msg_db_v1', BUS='kz-msg-bus';
var db=loadDb();
function blank(){return{users:{},chats:{},messages:{},reads:{},seq:1};}
function loadDb(){try{var d=JSON.parse(localStorage.getItem(DB_KEY));return d&&d.users?d:blank();}catch(e){return blank();}}
function saveDb(){try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){console.warn('save fail',e);}}
var bus=('BroadcastChannel'in window)?new BroadcastChannel(BUS):null;
function busPost(ev){if(bus){try{bus.postMessage(ev);return;}catch(e){}}
  try{localStorage.setItem('kz-bus',JSON.stringify({t:now(),ev:ev}));}catch(e){}}
if(bus)bus.onmessage=function(e){applyRemote(e.data);};
window.addEventListener('storage',function(e){if(e.key==='kz-bus'&&e.newValue){try{applyRemote(JSON.parse(e.newValue).ev);}catch(_){}}});

/* сид при первом запуске */
function seed(){
  if(Object.keys(db.users).length>1)return;
  var peers=[
    {id:'u_dir',name:'Иванов И.И.',role:'admin',dept:'Дирекция'},
    {id:'u_dep',name:'Петров П.П.',role:'manager',dept:'Зам.'},
    {id:'u_eng',name:'Сидоров С.С.',role:'manager',dept:'Инженерия'},
    {id:'u_hr',name:'Кузнецова А.В.',role:'employee',dept:'HR'},
    {id:'u_it',name:'Волков Д.М.',role:'employee',dept:'ИТ'},
    {id:'u_fin',name:'Смирнов Е.О.',role:'employee',dept:'Финансы'}
  ];
  peers.forEach(function(p){p.online=false;p.created=now();db.users[p.id]=p;});
  // каналы
  var chans=[
    {id:'ch_all',kind:'channel',title:'Общий',roles:[],pinned:true,desc:'Все сотрудники',members:peers.map(function(p){return p.id;})},
    {id:'ch_admin',kind:'channel',title:'Администрация',roles:['admin','manager'],pinned:false,desc:'Только admin/manager',members:[]},
    {id:'ch_it',kind:'channel',title:'ИТ‑поддержка',roles:[],pinned:false,desc:'Заявки и инциденты',members:[]},
    {id:'ch_sos',kind:'channel',title:'Аварийные',roles:[],pinned:true,desc:'Критические оповещения',members:[]}
  ];
  chans.forEach(function(c){c.created=now();c.updated=now();db.chats[c.id]=c;db.messages[c.id]=[];});
  var t0=now()-3600e3;
  pushSeed('ch_all','u_dir','Доброе утро, команда. Планёрка в 10:00.',t0);
  pushSeed('ch_all','u_hr','Напомню: заполняем табели до пятницы.',t0+6e5);
  pushSeed('ch_it','u_it','Плановые работы на сервере в 23:00, possible downtime 10 мин.',t0+12e5);
  pushSeed('ch_admin','u_dep','Бюджет Q3 на согласовании у директора.',t0+18e5);
  saveDb();
}
function pushSeed(chatId,from,text,ts){db.messages[chatId].push({id:uid('m'),from:from,chatId:chatId,text:text,file:null,replyTo:null,ts:ts,status:'read',reactions:{},starred:false,edited:false,deleted:false});}

/* применение события к db (локально или удалённо) */
function applyEvent(ev){
  var p=ev.payload||{};
  switch(ev.type){
    case 'message':
      if(!db.messages[ev.chatId])db.messages[ev.chatId]=[];
      if(!db.messages[ev.chatId].some(function(m){return m.id===p.id;}))db.messages[ev.chatId].push(p);
      var ch=db.chats[ev.chatId];if(ch){ch.last=p;ch.updated=p.ts;}
      break;
    case 'edit':{var m=findMsg(ev.chatId,p.id);if(m){m.text=p.text;m.edited=true;}break;}
    case 'delete':{var d=findMsg(ev.chatId,p.id);if(d)d.deleted=true;break;}
    case 'reaction':{var r=findMsg(ev.chatId,p.id);if(r){r.reactions=r.reactions||{};var a=r.reactions[p.emoji]||(r.reactions[p.emoji]=[]);var i=a.indexOf(ev.from);if(i>=0)a.splice(i,1);else a.push(ev.from);if(!a.length)delete r.reactions[p.emoji];}break;}
    case 'read':db.reads[ev.chatId]=db.reads[ev.chatId]||{};db.reads[ev.chatId][ev.from]=p.upTo;break;
    case 'presence':if(db.users[ev.from])db.users[ev.from].online=!!p.online;break;
    case 'chat':if(!db.chats[p.id])db.chats[p.id]=p;if(!db.messages[p.id])db.messages[p.id]=[];break;
    case 'star':{var s=findMsg(ev.chatId,p.id);if(s)s.starred=!!p.starred;break;}
  }
}
function findMsg(chatId,id){var a=db.messages[chatId]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function applyRemote(ev){applyEvent(ev);saveDb();refresh();maybeNotify(ev);}

/* отправка события: себе + шина */
function emit(ev){ev.from=ev.from||(me()&&me().id);ev.ts=ev.ts||now();applyEvent(ev);saveDb();busPost(ev);refresh();}

/* ---------- 5. СЕССИЯ / МОДЕЛЬ ---------- */
var session=mkStore({me:null,ready:false});
var ui=mkStore({activeChat:null,view:'chats',q:'',reply:null,typing:{},chatSearch:''});
function me(){return session.get().me;}
function isLocal(){return !localStorage.getItem('kz_server');} // всегда true в этом файле

function doLogin(name,role){
  name=(name||'').trim()||'Гость';
  var id='u_'+btoa(unescape(encodeURIComponent(name))).replace(/[^a-z0-9]/gi,'').slice(0,10);
  var u=db.users[id]||{id:id,name:name,role:role||'employee',dept:'',online:true,created:now()};
  u.name=name;u.role=role||u.role||'employee';u.online=true;db.users[id]=u;saveDb();
  session.set({me:u,ready:true});localStorage.setItem('kz_me',id);
  emit({type:'presence',from:id,payload:{online:true}});
  requestNotif();
  location.hash='#/';
}
function logout(){var m=me();if(m){emit({type:'presence',from:m.id,payload:{online:false}});}localStorage.removeItem('kz_me');session.set({me:null,ready:false});location.hash='#/login';}
function setRole(r){var m=me();if(!m)return;m.role=r;db.users[m.id]=m;saveDb();session.set({me:Object.assign({},m)});emit({type:'presence',from:m.id,payload:{online:true}});toast(T('saved'),'success');refresh();}

/* чаты пользователя */
function myChats(){
  var m=me();if(!m)return[];
  return Object.keys(db.chats).map(function(id){return db.chats[id];}).filter(function(c){
    if(c.kind==='channel')return chanVisible(c,m);
    return (c.members||[]).indexOf(m.id)>=0;
  }).sort(function(a,b){
    if((b.pinned?1:0)-(a.pinned?1:0))return (b.pinned?1:0)-(a.pinned?1:0);
    return (b.updated||0)-(a.updated||0);
  });
}
function chanVisible(c,m){if(!c.roles||!c.roles.length)return true;if(m.role==='admin')return true;return c.roles.indexOf(m.role)>=0;}
function chanCanWrite(c,m){return chanVisible(c,m);}
function unreadCount(chatId){var m=me();if(!m)return 0;var lr=(db.reads[chatId]||{})[m.id]||0;return (db.messages[chatId]||[]).filter(function(x){return x.ts>lr&&x.from!==m.id&&!x.deleted;}).length;}
function totalUnread(){return myChats().reduce(function(s,c){return s+unreadCount(c.id);},0);}
function dmId(a,b){return 'dm_'+[a,b].sort().join('_');}
function ensureDm(peerId){
  var m=me();var id=dmId(m.id,peerId);
  if(!db.chats[id]){db.chats[id]={id:id,kind:'dm',title:(db.users[peerId]||{}).name||peerId,peerId:peerId,members:[m.id,peerId],created:now(),updated:now()};db.messages[id]=[];emit({type:'chat',payload:db.chats[id]});}
  return db.chats[id];
}
function sendMessage(chatId,text,file,replyTo){
  var m=me();var payload={id:uid('m'),from:m.id,chatId:chatId,text:text||'',file:file||null,replyTo:replyTo?{id:replyTo.id,from:replyTo.from,text:replyTo.text}:null,ts:now(),status:'sending',reactions:{},starred:false,edited:false,deleted:false};
  emit({type:'message',chatId:chatId,from:m.id,payload:payload});
  setTimeout(function(){var mm=findMsg(chatId,payload.id);if(mm&&mm.status==='sending'){mm.status='delivered';saveDb();refresh();}},250);
  return payload;
}
function markRead(chatId){var m=me();if(!m)return;emit({type:'read',chatId:chatId,from:m.id,payload:{upTo:now()}});}
function react(chatId,msgId,emoji){emit({type:'reaction',chatId:chatId,from:me().id,payload:{id:msgId,emoji:emoji}});}
function editMsg(chatId,msgId,text){emit({type:'edit',chatId:chatId,from:me().id,payload:{id:msgId,text:text}});}
function delMsg(chatId,msgId){var mm=findMsg(chatId,msgId);if(!mm||mm.from!==me().id)return toast(T('delLimit'),'error');if(now()-mm.ts>15*60e3)return toast(T('delLimit'),'error');emit({type:'delete',chatId:chatId,from:me().id,payload:{id:msgId}});}
function starMsg(chatId,msgId,v){emit({type:'star',chatId:chatId,from:me().id,payload:{id:msgId,starred:v}});}
function emitTyping(chatId){busPost({type:'typing',chatId:chatId,from:me().id,ts:now()});}
function simIncoming(){ // демо: коллега пишет в активный/общий чат
  var peers=Object.keys(db.users).filter(function(i){return i!==me().id;});
  if(!peers.length)return;
  var from=peers[Math.floor(Math.random()*peers.length)];
  var texts=lang()==='en'?['Got it, thanks.','Can you review this?','Meeting moved to 11:00.','Approved ✅','On my way.','Please check the attachment.']:['Принято, спасибо.','Сможете посмотреть?','Встреча перенесена на 11:00.','Согласовано ✅','Уже еду.','Проверьте вложение.'];
  var chatId=ui.get().activeChat||'ch_all';
  var payload={id:uid('m'),from:from,chatId:chatId,text:texts[Math.floor(Math.random()*texts.length)],file:null,replyTo:null,ts:now(),status:'delivered',reactions:{},starred:false,edited:false,deleted:false};
  emit({type:'message',chatId:chatId,from:from,payload:payload});
}

/* ---------- 6. УВЕДОМЛЕНИЯ ---------- */
function requestNotif(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission().then(function(){});}
function maybeNotify(ev){
  if(ev.type!=='message')return;var m=me();if(!m||ev.from===m.id)return;
  if(ui.get().activeChat===ev.chatId&&document.hasFocus()){markRead(ev.chatId);return;}
  var u=db.users[ev.from]||{name:ev.from};var p=ev.payload||{};
  if('Notification'in window&&Notification.permission==='granted'){
    try{var n=new Notification(u.name,{body:(p.text||'📎').slice(0,120),tag:p.id});n.onclick=function(){window.focus();openChat(ev.chatId);};}catch(e){}
  }
  toast(u.name+': '+(p.text||'📎').slice(0,60),'info');
  document.title='('+totalUnread()+') KZ Messenger';
}
function updateTitle(){var n=totalUnread();document.title=(n>0?'('+n+') ':'')+'KZ Messenger';}

function Avatar(u,size,square){size=size||42;return el('div',{class:'avatar'+(u&&u.online?' online':''),style:{width:size+'px',height:size+'px',background:colorOf(u?u.id:''),borderRadius:square?'10px':'50%',fontSize:Math.round(size*0.4)+'px'}},initials(u?u.name:'?'));}
var toastBox;
function toast(text,kind){if(!toastBox){toastBox=el('div',{class:'toasts'});document.body.appendChild(toastBox);}
  var t=el('div',{class:'toast '+(kind||'info'),text:text});toastBox.appendChild(t);requestAnimationFrame(function(){t.classList.add('in');});
  setTimeout(function(){t.classList.remove('in');setTimeout(function(){t.remove();},300);},3500);}
function closeCtx(){var o=document.querySelector('.ctx');if(o)o.remove();}
document.addEventListener('click',function(e){if(!e.target.closest('.ctx'))closeCtx();});
function ctxMenu(x,y,items){closeCtx();var m=el('div',{class:'ctx',style:{left:x+'px',top:y+'px'}});
  items.forEach(function(it){if(it.sep){m.appendChild(el('div',{class:'ctx-sep'}));return;}
    if(it.emis){var row=el('div',{class:'ctx-emis'});it.emis.forEach(function(em){row.appendChild(el('span',{text:em,on:{click:function(e){e.stopPropagation();closeCtx();it.onEm&&it.onEm(em);}}}));});m.appendChild(row);return;}
    m.appendChild(el('button',{class:'ctx-i'+(it.danger?' danger':''),text:it.label,on:{click:function(e){e.stopPropagation();closeCtx();it.fn();}}}));});
  document.body.appendChild(m);var r=m.getBoundingClientRect();
  if(r.right>innerWidth)m.style.left=(innerWidth-r.width-8)+'px';if(r.bottom>innerHeight)m.style.top=(innerHeight-r.height-8)+'px';}
function modal(title,rows,extra){var bg=el('div',{class:'modal-bg',on:{click:function(e){if(e.target===bg)bg.remove();}}});
  var box=el('div',{class:'modal'},el('h3',{text:title}));rows.forEach(function(r){box.appendChild(el('div',{class:'mrow'},el('span',{class:'k',text:r[0]}),el('span',{text:String(r[1])})));});
  if(extra)box.appendChild(extra);box.appendChild(el('div',{style:{marginTop:'14px',textAlign:'right'}},el('button',{class:'btn',text:'OK',on:{click:function(){bg.remove();}}},' ')));
  bg.appendChild(box);document.body.appendChild(bg);}

function ShellView(){
  if(!me()){location.hash='#/login';return el('div');}
  var root=el('div',{class:'shell'});
  var side=el('aside',{class:'sidebar',id:'sidebar'});
  var main=el('main',{class:'main',id:'main'});
  root.appendChild(side);root.appendChild(main);
  var scrim=el('div',{class:'scrim',style:{display:'none'},on:{click:function(){side.classList.remove('open');scrim.style.display='none';}}});
  root.appendChild(scrim);

  function renderSide(){
    clear(side);var m=me();
    side.appendChild(el('header',{class:'sb-head'},
      Avatar(m,36),
      el('div',{class:'who'},el('div',{class:'nm',text:m.name}),el('div',{class:'rl',text:m.role})),
      el('button',{class:'icon',title:T('theme'),text:theme()==='dark'?'☀️':'🌙',on:{click:function(){toggleTheme();renderSide();}}}),
      el('button',{class:'icon',title:T('logout'),text:'⏻',on:{click:logout}})));
    var path=location.hash.replace(/^#/,'')||'/';
    var tabs=[['#/','💬 '+T('chats')],['#/channels','📢 '+T('channels')],['#/contacts','👥 '+T('contacts')],['#/settings','⚙ '+T('settings')]];
    var nav=el('nav',{class:'tabs'});
    tabs.forEach(function(t){var act=(t[0]==='#/'&&(path==='/'||path.indexOf('/chat/')===0))||path===t[0];
      nav.appendChild(el('button',{class:'tab'+(act?' active':''),text:t[1],on:{click:function(){location.hash=t[0];side.classList.remove('open');scrim.style.display='none';}}}));});
    side.appendChild(nav);
    var qI=el('input',{type:'search',placeholder:T('search'),value:ui.get().q,on:{input:function(e){ui.set({q:e.target.value});paintList();}}});
    side.appendChild(el('div',{class:'search'},qI));
    var list=el('div',{class:'list',id:'chat-list'});side.appendChild(list);paintList();
  }
  function paintList(){
    var list=document.getElementById('chat-list');if(!list)return;clear(list);
    var q=(ui.get().q||'').toLowerCase();var items=myChats().filter(function(c){
      if(!q)return true;var last=c.last&&c.last.text?c.last.text.toLowerCase():'';return (c.title||'').toLowerCase().indexOf(q)>=0||last.indexOf(q)>=0;});
    if(!items.length){list.appendChild(el('div',{class:'empty',text:T('noChats')}));return;}
    items.forEach(function(c){
      var un=unreadCount(c.id);var peer=c.kind==='dm'?db.users[c.peerId]:null;
      var av=c.kind==='channel'?Avatar({id:c.id,name:c.title},42,true):Avatar(peer||{id:c.id,name:c.title},42);
      var nm=el('div',{class:'nm'},c.pinned?el('span',{class:'pin',text:'📌'}):null,c.mute?el('span',{class:'mute-ic',text:'🔇'}):null,c.title);
      var pv=c.last?(c.last.deleted?'🗑':(c.last.from===me().id?'↗ ':'')+((db.users[c.last.from]||{}).name? (c.kind==='channel'? (db.users[c.last.from].name.split(' ')[0]+': '):'') :'')+(c.last.text||(c.last.file?'📎':''))):'—';
      var it=el('button',{class:'item'+(ui.get().activeChat===c.id?' active':''),on:{click:function(){openChat(c.id);side.classList.remove('open');scrim.style.display='none';},contextmenu:function(e){e.preventDefault();chatCtx(e,c);}}},
        av,el('div',{class:'inf'},nm,el('div',{class:'pv',text:pv})),
        el('div',{class:'meta'},c.last?el('span',{class:'tm',text:timeOf(c.last.ts)}):null,un?el('span',{class:'badge',text:String(un>99?'99+':un)}):null));
      list.appendChild(it);
    });
  }
  function chatCtx(e,c){ctxMenu(e.clientX,e.clientY,[
    {label:c.pinned?('📌 '+T('unpin')):('📌 '+T('pin')),fn:function(){c.pinned=!c.pinned;saveDb();paintList();}},
    {label:c.mute?('🔔 '+T('unmute')):('🔇 '+T('mute')),fn:function(){c.mute=!c.mute;saveDb();paintList();}},
    {sep:true},
    {label:'🗑 '+T('delChat'),danger:true,fn:function(){if(confirm(T('delChat')+' «'+c.title+'»?')){delete db.chats[c.id];delete db.messages[c.id];if(ui.get().activeChat===c.id){ui.set({activeChat:null});location.hash='#/';}saveDb();renderAll();}}}
  ]);}

  function renderMain(){
    clear(main);var path=location.hash.replace(/^#/,'')||'/';
    if(path.indexOf('/chat/')===0)main.appendChild(ChatView(path.split('/')[2]));
    else if(path==='/channels')main.appendChild(ChannelsPage());
    else if(path==='/contacts')main.appendChild(ContactsPage());
    else if(path==='/settings')main.appendChild(SettingsPage());
    else main.appendChild(el('div',{class:'placeholder'},el('div',{class:'big',text:'💬'}),T('pickChat')));
  }
  function renderAll(){renderSide();renderMain();updateTitle();}

  // подписки
  var unsub=[];
  unsub.push(ui.sub(function(){ /* перерисовка активного чата при смене */ }));
  window.__kzRefresh=function(){renderSide();if(ui.get().activeChat&&location.hash.indexOf('/chat/')===0){repaintMsgs();repaintTyping();}updateTitle();};
  renderAll();
  window.addEventListener('hashchange',function(){renderSide();renderMain();});
  return root;
}

function renderComposer(host,c){
  clear(host);var reply=ui.get().reply;
  var ta=el('textarea',{rows:1,placeholder:T('typeHere'),on:{input:function(e){e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px';debTyping(c.id);},keydown:function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend(c);}}}});
  var fileIn=el('input',{type:'file',style:{display:'none'},on:{change:function(e){var f=e.target.files[0];if(f)readFile(f,function(d){sendMessage(c.id,'',d,ui.get().reply);ui.set({reply:null});renderComposer(document.getElementById('comp'),c);});e.target.value='';}}});
  var row=el('div',{class:'row'},
    el('button',{class:'icon',title:'📎',text:'📎',on:{click:function(){fileIn.click();}}}),fileIn,
    ta,
    el('button',{class:'send',title:T('send'),text:'➤',on:{click:function(){doSend(c);}}})
  );
  var bar=reply?el('div',{class:'reply-bar'},el('b',{text:'↩ '+(db.users[reply.from]||{}).name||reply.from}),el('span',{class:'rt',text:(reply.text||'📎').slice(0,80)}),el('button',{class:'x',text:'✕',on:{click:function(){ui.set({reply:null});renderComposer(host,c);ta.focus();}}})):null;
  host.appendChild(el('div',{class:'composer'},bar,row));

function doSend(c){var ta=document.querySelector('#comp textarea');if(!ta)return;var v=ta.value.trim();if(!v)return;ta.value='';ta.style.height='auto';sendMessage(c.id,v,null,ui.get().reply);ui.set({reply:null});renderComposer(document.getElementById('comp'),c);}
var typLock=0;function debTyping(id){var n=now();if(n-typLock>1500){typLock=n;emitTyping(id);}}
function readFile(file,cb){if(file.size>10*1024*1024)return toast(T('fileTooBig'),'error');var r=new FileReader();r.onload=function(){cb({name:file.name,size:file.size,type:file.type,url:r.result});};r.readAsDataURL(file);}

function repaintMsgs(){
  var sc=document.getElementById('msgs');if(!sc)return;var id=ui.get().activeChat;var list=(db.messages[id]||[]).slice();
  var cs=(ui.get().chatSearch||'').toLowerCase();
  var wasBottom=clampScroll(sc);clear(sc);
  if(!list.length){sc.appendChild(el('div',{class:'empty',text:T('emptyMsgs')}));return;}
  var lastDay='',lastFrom='';
  list.forEach(function(m){
    if(cs&&!(m.text||'').toLowerCase().indexOf(cs)>=0&&!m.file)return;
    var dl=dateLabel(m.ts);if(dl!==lastDay){sc.appendChild(el('div',{class:'day',text:dl}));lastDay=dl;lastFrom='';}
    sc.appendChild(MsgNode(m,id,lastFrom!==m.from));lastFrom=m.from;
  });
  if(wasBottom)sc.scrollTop=sc.scrollHeight;else sc.scrollTop=wasBottomScroller;
}
var wasBottomScroller=0;
function MsgNode(m,chatId,showSender){
  var meId=me().id;var out=m.from===meId;var sys=m.from==='system';var dir=sys?'system':out?'out':'in';
  var author=db.users[m.from]||{id:m.from,name:sys?'SYSTEM':m.from};
  var w=el('div',{class:'msg '+dir+(m.deleted?' deleted':''),dataset:{id:m.id}});
  if(showSender&&!out&&!sys){var ch=db.chats[chatId];if(ch&&ch.kind==='channel')w.appendChild(el('div',{class:'sender',style:{color:colorOf(m.from)},text:author.name}));}
  if(m.replyTo)w.appendChild(el('div',{class:'reply-ref',text:'↩ '+(db.users[m.replyTo.from]||{}).name+': '+(m.replyTo.text||'📎').slice(0,60),on:{click:function(){var t=sc.querySelector('[data-id="'+m.replyTo.id+'"]');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.style.outline='2px solid var(--acc)';setTimeout(function(){t.style.outline='';},1200);}}}}));
  var bub=el('div',{class:'bubble'});
  if(m.deleted)bub.appendChild(el('span',{text:'🗑 '+(T('del'))}));
  else{
    if(m.text)bub.appendChild(el('div',{html:md(m.text)}));
    if(m.file){var a=el('a',{class:'file',href:m.file.url||'#',download:m.file.name||'',target:'_blank'},el('span',{class:'fi',text:fileIcon(m.file.type)}),el('span',{class:'fn',text:m.file.name}),el('span',{class:'fs',text:sizeOf(m.file.size)}));bub.appendChild(a);}
  }
  w.appendChild(bub);
  var meta=el('div',{class:'meta2'},timeOf(m.ts),m.edited?el('span',{class:'edited',text:'· '+T('edit')}):null,out&&!sys&&!m.deleted?el('span',{class:'check'+(m.status==='read'?' read':''),text:{sending:'🕐',sent:'✓',delivered:'✓✓',read:'✓✓',error:'✗'}[m.status]||''}):null);
  w.appendChild(meta);
  if(m.reactions&&Object.keys(m.reactions).length){var rr=el('div',{class:'reactions'});Object.keys(m.reactions).forEach(function(em){rr.appendChild(el('button',{class:'react'+((m.reactions[em]||[]).indexOf(meId)>=0?' mine':''),text:em+' '+m.reactions[em].length,on:{click:function(e){e.stopPropagation();react(chatId,m.id,em);}}}));});w.appendChild(rr);}
  w.addEventListener('dblclick',function(){if(!m.deleted)react(chatId,m.id,'👍');});
  w.addEventListener('contextmenu',function(e){e.preventDefault();msgCtx(e,chatId,m);});
  return w;
}
function fileIcon(t){if(!t)return'📄';if(t.indexOf('image/')===0)return'🖼️';if(t.indexOf('video/')===0)return'🎬';if(t.indexOf('audio/')===0)return'🎵';if(t.indexOf('pdf')>=0)return'📕';if(/zip|rar|7z|tar|gz/.test(t))return'📦';if(/sheet|excel|csv/.test(t))return'📊';if(/word|document/.test(t))return'📝';return'📄';}
function msgCtx(e,chatId,m){
  var out=m.from===me().id;var items=[
    {label:'↩ '+T('reply'),fn:function(){ui.set({reply:m});var h=document.getElementById('comp');if(h)renderComposer(h,db.chats[chatId]);}},
    {label:'📋 '+T('copy'),fn:function(){navigator.clipboard&&navigator.clipboard.writeText(m.text||'');toast(T('copied'),'success');}},
    {label:(m.starred?'⭐ ':'☆ ')+(m.starred?T('unstar'):T('star')),fn:function(){starMsg(chatId,m.id,!m.starred);}},
    {sep:true},
    {emis:['👍','❤️','😂','😮','😢','🎉','','✅'],onEm:function(em){react(chatId,m.id,em);}}
  ];
  if(out&&!m.deleted){items.push({sep:true});items.push({label:'✏️ '+T('edit'),fn:function(){var v=prompt(T('editPh'),m.text);if(v!=null&&v!==m.text)editMsg(chatId,m.id,v);}});items.push({label:'🗑 '+T('del'),danger:true,fn:function(){delMsg(chatId,m.id);}});}

function repaintTyping(){
  var t=document.getElementById('typing');if(!t)return;var id=ui.get().activeChat;var tp=ui.get().typing[id];
  if(tp&&now()-tp.ts<4000&&tp.from!==me().id){var u=db.users[tp.from];t.textContent=(u?u.name.split(' ')[0]:'…')+' '+T('typing');}else t.textContent='';

function toggleChatSearch(id){
  var head=document.querySelector('.ch-head');if(!head)return;var ex=document.getElementById('cs-bar');if(ex){ex.remove();ui.set({chatSearch:''});repaintMsgs();return;}
  var inp=el('input',{type:'search',placeholder:T('search'),style:{flex:1},on:{input:function(e){ui.set({chatSearch:e.target.value});repaintMsgs();}}});
  var bar=el('div',{id:'cs-bar',style:{display:'flex',gap:'8px',alignItems:'center',padding:'8px 16px',background:'var(--panel2)',borderBottom:'1px solid var(--line)'}},inp,el('button',{class:'icon',text:'✕',on:{click:function(){bar.remove();ui.set({chatSearch:''});repaintMsgs();}}}));
  head.parentNode.insertBefore(bar,head.nextSibling);inp.focus();

function chatHeadCtx(e,c){ctxMenu(e.clientX,e.clientY,[
  {label:'ℹ️ '+T('info'),fn:function(){showInfo(c);}},
  {label:'🧹 '+T('clearHist'),fn:function(){if(confirm(T('clearHist')+'?')){db.messages[c.id]=[];saveDb();repaintMsgs();}}},
  {label:'📥 '+T('export'),fn:function(){exportChat(c.id);}}
]);}
function showInfo(c){
  var rows=[];
  if(c.kind==='channel'){rows.push([T('desc'),c.desc||'—']);rows.push([T('access'),(c.roles&&c.roles.length)?c.roles.join(', '):T('all')]);rows.push(['ID',c.id]);}
  else{var p=db.users[c.peerId]||{};rows.push([T('name'),p.name||c.title]);rows.push([T('role'),p.role||'—']);rows.push(['Dept',p.dept||'—']);rows.push(['ID',p.id||c.id]);}
  rows.push(['Messages',(db.messages[c.id]||[]).length]);
  modal(c.title,rows);
}
function exportChat(id){
  var a=db.messages[id]||[];var txt=a.map(function(m){var u=db.users[m.from]||{name:m.from};return '['+new Date(m.ts).toLocaleString()+'] '+u.name+': '+(m.deleted?'(deleted)':(m.text||'')+(m.file?(' [file: '+m.file.name+']'):''));}).join('\n');
  var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});var link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='chat_'+id+'.txt';link.click();setTimeout(function(){URL.revokeObjectURL(link.href);},1000);
}

function ChannelsPage(){
  var m=me();var chans=Object.keys(db.chats).map(function(i){return db.chats[i];}).filter(function(c){return c.kind==='channel';});
  var grid=el('div',{class:'grid'});

    grid.appendChild(el('button',{class:'card-mini'+(vis?'':' locked'),disabled:!vis,on:{click:function(){if(!vis)return toast(T('lockedCh'),'warn');openChat(c.id);}}},
      el('div',{class:'cm-av',text:'#'}),el('div',{class:'cm-nm',text:c.title}),el('div',{class:'cm-rl',text:(c.roles&&c.roles.length)?c.roles.join('/'):T('all')}),
      un?el('span',{class:'badge',text:String(un)}):null));});
  return el('div',{class:'page'},el('h2',{text:T('channels')}),el('p',{class:'sub',text:T('demoNote')}),grid);

  var m=me();var peers=Object.keys(db.users).map(function(i){return db.users[i];}).filter(function(u){return u.id!==m.id;});
  var grid=el('div',{class:'grid'});
  peers.forEach(function(u){grid.appendChild(el('button',{class:'card-mini',on:{click:function(){var c=ensureDm(u.id);openChat(c.id);}}},
    Avatar(u,56),el('div',{class:'cm-nm',text:u.name}),el('div',{class:'cm-rl',text:(u.dept?u.dept+' · ':'')+u.role}),el('span',{class:'tag',text:T('createDm')})));});
  return el('div',{class:'page'},el('h2',{text:T('contacts')}),el('p',{class:'sub',text:'—'}),grid);

function SettingsPage(){
  var m=me();
  var themeBtn=el('button',{class:'btn',text:theme()==='dark'?T('dark'):T('light'),on:{click:function(e){toggleTheme();e.target.textContent=theme()==='dark'?T('dark'):T('light');}}});
  var langS=el('select',{on:{change:function(e){setLang(e.target.value);location.reload();}}},el('option',{value:'ru',text:'Русский',selected:lang()==='ru'}),el('option',{value:'en',text:'English',selected:lang()==='en'}));
  var roleS=el('select',{on:{change:function(e){setRole(e.target.value);}}},['admin','manager','employee'].map(function(r){return el('option',{value:r,text:r,selected:m.role===r});}));
  var notifS=('Notification'in window)?Notification.permission:'—';
  return el('div',{class:'page'},el('h2',{text:T('settings')}),
    el('div',{class:'note',style:{marginBottom:'16px'},text:T('demoNote')}),
    el('div',{class:'set-row'},el('div',{},el('div',{class:'lbl',text:T('name')}),el('div',{class:'hint',text:m.name})),el('span',{class:'tag',text:m.id})),
    el('div',{class:'set-row'},el('div',{class:'lbl',text:T('role')}),roleS),
    el('div',{class:'set-row'},el('div',{class:'lbl',text:T('theme')}),themeBtn),

    el('div',{class:'set-row'},el('div',{class:'lbl',text:'Data'}),el('button',{class:'btn danger',text:T('reset'),on:{click:function(){if(confirm(T('resetQ'))){localStorage.removeItem(DB_KEY);localStorage.removeItem('kz_me');location.reload();}}}})),
    el('div',{style:{marginTop:'18px'}},el('button',{class:'btn danger',text:T('logout'),on:{click:logout}}))

/* ---------- 9. РОУТЕР + BOOT ---------- */
function renderRoute(){
  var app=document.getElementById('app');clear(app);
  var path=location.hash.replace(/^#/,'')||'/';
  if(!me()){app.appendChild(LoginView());return;}
  if(path==='/login'){location.hash='#/';return;}
  app.appendChild(ShellView());
}
window.addEventListener('hashchange',renderRoute);
window.addEventListener('beforeunload',function(){var m=me();if(m)try{busPost({type:'presence',from:m.id,payload:{online:false},ts:now()});db.users[m.id].online=false;saveDb();}catch(e){}});
// входящие typing из шины (не трогаем db)
if(bus)bus.onmessage=function(e){var ev=e.data;if(ev&&ev.type==='typing'){ui.set({typing:Object.assign({},ui.get().typing,(function(){var o={};o[ev.chatId]={from:ev.from,ts:ev.ts};return o;})()}));repaintTyping();}else applyRemote(ev);};
window.addEventListener('storage',function(e){if(e.key==='kz-bus'&&e.newValue){try{var ev=JSON.parse(e.newValue).ev;if(ev&&ev.type==='typing'){ui.set({typing:Object.assign({},ui.get().typing,(function(){var o={};o[ev.chatId]={from:ev.from,ts:ev.ts};return o;})()}));repaintTyping();}else applyRemote(ev);}catch(_){}}});

applyTheme();
seed();
var savedMe=localStorage.getItem('kz_me');
if(savedMe&&db.users[savedMe]){var u=db.users[savedMe];u.online=true;session.set({me:u,ready:true});emit({type:'presence',from:u.id,payload:{online:true}});}
renderRoute();
// heartbeat presence
setInterval(function(){var m=me();if(m)emit({type:'presence',from:m.id,payload:{online:true}});},25000);
// очистка зависших typing
setInterval(function(){var t=ui.get().typing,n=now(),o={};for(var k in t)if(n-t[k].ts<4000)o[k]=t[k];ui.set({typing:o});repaintTyping();},2000);
})();
