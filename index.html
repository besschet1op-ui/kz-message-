### Причина:
В коде используется импорт модулей (`import ... from "https://..."`), который работает только внутри тега `<script type="module">`. Если браузер iPhone (Safari) блокирует эти скрипты из-за настроек безопасности или CORS, приложение просто зависает без ошибок на экране.

Давай исправим это радикально. Мы перепишем код так, чтобы он был максимально совместим с Safari и гарантированно загружал данные.

**Что мы сделаем:**
1.  Используем **CDN ссылки напрямую** в HTML (без `type="module"` для критических частей, если возможно, или правильно настроим их).
2.  Добавим **обработку ошибок**, чтобы ты видел текст ошибки прямо на экране телефона, а не пустоту.
3.  Упростим структуру, чтобы она точно работала.

```html

<style>

<!-- Firebase SDK через CDN (UMD формат для максимальной совместимости со старыми браузерами/Safari iOS) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

<script>
// ==========================================
// ЛОГИКА ПРИЛОЖЕНИЯ (Compat Mode)
// ==========================================

let db = null;
let messaging = null;
let currentUser = null;
let currentChatId = null;
let unsubscribeMessages = null;
let allUsersCache = {};

// Конфигурация твоего проекта
const firebaseConfig = {
  apiKey: "AIzaSyDyuK9iREDYiA-NmjeWgECT2np57V-m86s",
  authDomain: "kz-messenger-test.firebaseapp.com",
  projectId: "kz-messenger-test",
  storageBucket: "kz-messenger-test.firebasestorage.app",
  messagingSenderId: "60956478899",
  appId: "1:60956478899:web:43fbbc9d9755e967b68fc6"
};

// Инициализация при загрузке страницы
window.onload = function() {
    log("Starting app...");
    try {
        // Инициализируем Firebase
        const app = firebase.initializeApp(firebaseConfig);
        db = app.firestore();
        
        // Проверяем соединение
        log("Firebase initialized successfully.");
        
        // Пробуем прочитать данные пользователей
        loadAllUsers().then(() => {
            checkSession();
        }).catch(err => {
            logError("Failed to load users:", err);
            alert("Ошибка подключения к базе данных:\n" + err.message);
        });

    } catch (e) {
        logError("Critical Init Error:", e);
        document.getElementById('authErr').innerText = "Критическая ошибка: " + e.message;
        document.getElementById('authErr').style.display = 'block';
    }
};

function log(msg) {
    console.log(msg);
    const box = document.getElementById('debugBox');
    if(box) {
        box.style.display = 'block';
        box.innerHTML += `<div>${new Date().toLocaleTimeString()} - ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }
}

function logError(msg, err) {
    console.error(msg, err);
    log(`ERROR: ${msg} ${err.stack || err}`);
}

// ===== AUTHENTICATION =====
function toggleReg() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('regForm').classList.toggle('hidden');
    document.getElementById('authErr').style.display = 'none';
}

async function handleLogin(e) {
    e.preventDefault();
    const badge = document.getElementById('badgeInput').value.toUpperCase().trim();
    if (!badge) return showError("Введите табельный номер");
    
    log(`Attempting login for ${badge}...`);
    
    try {
        const snapshot = await db.collection("users").where("badge", "==", badge).limit(1).get();
        
        let userFound = null;
        snapshot.forEach(docSnap => {
            userFound = { id: docSnap.id, ...docSnap.data() };
        });

        if (!userFound) throw new Error("Пользователь не найден");
        
        loginUser(userFound);
    } catch (err) {
        logError("Login failed", err);
        showError(err.message);
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const dept = document.getElementById('regDept').value.trim();
    const badge = document.getElementById('regBadge').value.toUpperCase().trim();
    
    if (!name || !dept || !badge) return showError("Заполните все поля");

    try {
        const exists = await db.collection("users").where("badge", "==", badge).limit(1).get();
        if (!exists.empty) throw new Error("Такой табельный уже занят");

        const newUser = { badge, name, dept, role: 'employee', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        const userDocRef = await db.collection("users").add(newUser);
        const userId = userDocRef.id;

        await ensureGeneralChannelExists(userId);
        
        loginUser({ id: userId, ...newUser });
    } catch (err) {
        logError("Register failed", err);
        showError(err.message);
    }
}

async function ensureGeneralChannelExists(userId) {
    const channelsCol = db.collection("chats");
    const q = channelsCol.where("type", "==", "channel").where("title", "==", "Общий завод");
    const snapshot = await q.get();

    if (snapshot.empty) {
        const channelData = {
            type: 'channel', title: 'Общий завод', description: 'Главный канал предприятия',
            members: [userId], createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessageText: 'Добро пожаловать!', lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
        };
        await channelsCol.add(channelData);
    } else {
        const firstDoc = snapshot.docs[0];
        const data = firstDoc.data();
        if (!data.members.includes(userId)) {
            await firstDoc.ref.update({ members: [...data.members, userId] });
        }
    }
}

function loginUser(user) {
    currentUser = user;
    localStorage.setItem('kz_cloud_session', JSON.stringify(user));
    showScreen('home-screen');
    initApp();
}

function logout() {
    currentUser = null;
    localStorage.removeItem('kz_cloud_session');
    if (unsubscribeMessages) unsubscribeMessages();
    showScreen('auth-screen');
}

function checkSession() {
    const sess = localStorage.getItem('kz_cloud_session');
    if (sess) {
        try {
            currentUser = JSON.parse(sess);
            showScreen('home-screen');
            initApp();
        } catch (e) { logout(); }
    } else {
        showScreen('auth-screen');
    }
}

function showError(msg) {
    const el = document.getElementById('authErr');
    el.textContent = msg;
    el.style.display = 'block';
}

// ===== NAVIGATION & RENDERING =====
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
}

let currentTab = 'chats';
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    renderList(tab);
}

function initApp() {
    loadAllUsers().then(() => {
        renderList('chats');
    });
}

async function loadAllUsers() {
    const snapshot = await db.collection("users").get();
    snapshot.forEach(docSnap => {
        allUsersCache[docSnap.id] = { id: docSnap.id, ...docSnap.data() };
    });
}

function renderList(tab) {
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    
    let items = [];
    
    // Загружаем чаты пользователя
    const chatsRef = db.collection("chats");
    const q = chatsRef.where("members", "array-contains", currentUser.id);
    
    // Используем onSnapshot для realtime обновления списка
    if(window.unsubscribeChats) window.unsubscribeChats();
    
    window.unsubscribeChats = q.onSnapshot((snapshot) => {
        items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Фильтрация по типу таба
        if (tab === 'channels') items = items.filter(c => c.type === 'channel');
        else if (tab === 'contacts') {
            items = Object.values(allUsersCache).filter(u => u.id !== currentUser.id).map(u => ({
                id: 'contact_' + u.id, type: 'contact', userId: u.id, displayTitle: u.name, subtitle: u.dept
            }));
        } else {
            items = items.filter(c => c.type === 'dm');
        }

        if (items.length === 0) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Нет элементов</div>';
            return;
        }

        items.sort((a,b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.onclick = () => {
                if (item.type === 'contact') openOrCreateDM(item.userId);
                else openChat(item.id);
            };
            
            const preview = item.lastMessageText ? item.lastMessageText.substring(0, 30) : 'Нет сообщений';
            
            div.innerHTML = `
                <div class="avatar">${getInitials(item.displayTitle || item.title)}</div>
                <div class="li-body">
                    <div class="li-name">${escapeHtml(item.displayTitle || item.title)}</div>
                    <div class="li-preview">${escapeHtml(preview)}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }, (error) => {
        logError("Chat list listener error", error);
        container.innerHTML = `<div style="padding:20px;color:red">Ошибка загрузки чатов: ${error.message}</div>`;
    });
}

// ===== CHAT LOGIC =====
async function openOrCreateDM(userId) {
    try {
        const existing = await findExistingDM(userId);
        if (existing) { openChat(existing.id); return; }

        const sortedIds = [currentUser.id, userId].sort();
        const chatData = {
            type: 'dm', members: sortedIds, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(), lastMessageText: '', lastMessageSender: ''
        };
        
        const docRef = await db.collection("chats").add(chatData);
        openChat(docRef.id);
    } catch (e) { alert("Ошибка: " + e.message); }
}

async function findExistingDM(userId) {
    const chatsRef = db.collection("chats");
    const q = chatsRef.where("type", "==", "dm").where("members", "array-contains", currentUser.id);
    const snapshot = await q.get();
    for(const doc of snapshot.docs) {
        const data = doc.data();
        if(data.members.includes(userId)) return { id: doc.id, ...data };
    }
    return null;
}

function openChat(chatId) {
    currentChatId = chatId;
    document.getElementById('chatHeaderName').textContent = "Загрузка...";
    showScreen('chat-screen');
    loadHistorySafe(chatId);
}

async function loadHistorySafe(chatId) {
    const msgsRef = db.collection("messages");
    const q = msgsRef.where("chatId", "==", chatId).orderBy("createdAt", "asc").limit(100);
    
    try {
        const snapshot = await q.get();
        const docs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        renderMessages(docs);
        
        // Обновляем заголовок
        const chatInfo = await db.collection("chats").doc(chatId).get();
        if(chatInfo.exists) {
             const data = chatInfo.data();
             document.getElementById('chatHeaderName').textContent = data.title || "Диалог";
        }

        subscribeToNewMessages(chatId);
    } catch (error) {
        console.warn("Index missing? Trying fallback...", error);
        // Fallback без orderBy
        const qFallback = msgsRef.where("chatId", "==", chatId).limit(100);
        const snap = await qFallback.get();
        const docs = snap.docs.map(d => ({id:d.id, ...d.data()}));
        docs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderMessages(docs);
        subscribeToNewMessages(chatId);
    }
}

function subscribeToNewMessages(chatId) {
    if (unsubscribeMessages) unsubscribeMessages();
    
    const msgsRef = db.collection("messages");
    const q = msgsRef.where("chatId", "==", chatId);
    
    unsubscribeMessages = q.onSnapshot((snapshot) => {
        const msgs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        msgs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderMessages(msgs);
    });
}

function closeChat() {
    if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
    currentChatId = null;
    showScreen('home-screen');
    renderList(currentTab);
}

function renderMessages(msgs) {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    
    msgs.forEach(m => {
        const isMe = m.senderId === currentUser.id;
        const senderName = allUsersCache[m.senderId]?.name || '???';
        const timeStr = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        div.innerHTML = `
            ${!isMe ? `<div style="font-size:11px;color:var(--brand);margin-bottom:2px">${senderName.split(' ')[0]}</div>` : ''}
            <div>${escapeHtml(m.text)}</div>
            <div class="msg-meta">${timeStr}</div>
        `;
        container.appendChild(div);
    });
    
    container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    input.value = '';
    
    try {
        const msgData = { chatId: currentChatId, senderId: currentUser.id, text: text, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        await db.collection("messages").add(msgData);
        
        const chatRef = db.collection("chats").doc(currentChatId);
        await chatRef.set({
            lastMessageText: text, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(), lastMessageSender: currentUser.id
        }, { merge: true });
        
    } catch (e) { alert("Не удалось отправить: " + e.message); }
}

// UTILS
function getInitials(name) {
    if (!name) return '?';
    const parts = name.split(' ');
    return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, m => map[m]);
}
</script>
</head>

<div id="app-container">
  
  <!-- 1. ЭКРАН ВХОДА -->
  <div id="auth-screen" class="screen active">

      <p style="color:var(--text2)">Корпоративная связь</p>
    </div>
    <div id="authErr" class="err-msg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field"><label>Табельный номер</label><input class="input" id="badgeInput" placeholder="KZ-00001" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="passInput" placeholder="••••••" required></div>
      <button class="btn-main">Войти</button>
      <a href="#" class="link" onclick="toggleReg()">Нет аккаунта? Зарегистрироваться</a>
    </form>
    <form id="regForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="field"><label>ФИО</label><input class="input" id="regName" placeholder="Иванов И.И." required></div>
      <div class="field"><label>Подразделение</label><input class="input" id="regDept" placeholder="IT-отдел" required></div>
      <div class="field"><label>Табельный номер</label><input class="input" id="regBadge" placeholder="KZ-00100" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="regPass" placeholder="Мин 6 символов" required minlength="6"></div>
      <button class="btn-main">Создать аккаунт</button>
      <a href="#" class="link" onclick="toggleReg()">Уже есть аккаунт? Войти</a>
    </form>
  </div>

  <!-- 2. ГЛАВНЫЙ ЭКРАН -->
  <div id="home-screen" class="screen">
    <div class="nav-bar">
      <div class="nav-title" id="pageTitle">Чаты</div>
      <button onclick="logout()" style="color:red;font-size:14px">Выйти</button>
    </div>
    <div class="list-scroll" id="chatListContainer"></div>
    <div class="tab-bar">
      <button class="tab-item active" onclick="switchTab('chats')" id="tabChats">💬<br>Чаты</button>
      <button class="tab-item" onclick="switchTab('channels')" id="tabChannels">📢<br>Каналы</button>
      <button class="tab-item" onclick="switchTab('contacts')" id="tabContacts">👥<br>Контакты</button>
    </div>
  </div>

  <!-- 3. ЭКРАН ЧАТА -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">‹ Назад</button>
      <div class="nav-title" id="chatHeaderName">Чат</div>
    </div>
    <div class="msg-list" id="messagesContainer"></div>
    <div class="composer">
      <textarea class="comp-input" id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<!-- Debug Box (виден только при ошибке) -->
<div id="debugBox"></div>

</body>
</html>
