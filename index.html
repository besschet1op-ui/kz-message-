<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KZ Messenger | Коломенский завод</title>
<style>
/* ===== ДИЗАЙН СИСТЕМА iOS ===== */
:root{--brand:#0057b8;--bg:#fff;--surface:#f2f2f7;--text:#000;--text2:#8e8e93;--border:#c6c6c8;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--green:#34c759;--red:#ff3b30}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;font-size:16px;line-height:1.4;overscroll-behavior:none}
button{cursor:pointer;border:0;background:0;color:inherit;font:inherit;outline:0}
input,textarea{font:inherit;color:inherit;background:0;border:0;outline:0;width:100%}
::-webkit-scrollbar{display:none}
.hidden{display:none!important}

/* ЭКРАНЫ */
#app-container{position:relative;width:100%;height:100%;overflow:hidden}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;transition:.3s cubic-bezier(.32,.72,0,1);z-index:1;opacity:0;pointer-events:none;}
.screen.active{z-index:10;opacity:1;pointer-events:auto;}

/* АВТОРИЗАЦИЯ */
#auth-screen{justify-content:center;padding:20px calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l));background:linear-gradient(180deg,#fff,#f2f2f7)}
.brand{text-align:center;margin-bottom:30px}
.brand h1{font-size:24px;font-weight:700;color:var(--brand)}
.field{margin-bottom:16px}
.input{padding:14px 16px;background:var(--surface);border-radius:12px;font-size:16px;border:1px solid transparent}
.btn-main{width:100%;padding:16px;background:var(--brand);color:#fff;border-radius:12px;font-size:17px;font-weight:600;margin-top:10px}
.link{display:block;text-align:center;color:var(--brand);font-size:15px;margin-top:16px}
.err-msg{background:#fee;color:red;padding:12px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none}

/* ГЛАВНЫЙ ЭКРАН */
.nav-bar{padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);min-height:50px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:20}
.nav-title{font-size:17px;font-weight:600;flex:1;text-align:center}
.tab-bar{display:flex;border-top:1px solid var(--border);background:rgba(255,255,255,.95);backdrop-filter:blur(20px);padding:5px 0 calc(5px + var(--safe-b));flex-shrink:0}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;color:var(--text2);font-size:10px;font-weight:500}
.tab-item.active{color:var(--brand)}
.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.list-item:active{background:var(--surface)}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;flex-shrink:0;position:relative}
.online-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}
.li-body{flex:1;min-width:0}
.li-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-preview{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.badge{background:var(--red);color:#fff;font-size:12px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}

/* ЧАТ */
.chat-header{padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{color:var(--brand);font-size:17px;font-weight:500;display:flex;align-items:center;gap:4px}
.msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);-webkit-overflow-scrolling:touch}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.3;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.other{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-meta{font-size:11px;opacity:.7;margin-top:2px;text-align:right}
.composer{padding:10px 16px calc(10px + var(--safe-b));background:#fff;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.comp-input{flex:1;background:var(--surface);border-radius:20px;padding:10px 14px;min-height:40px;max-height:120px;font-size:16px;resize:none}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.attach-btn{font-size:24px;color:var(--text2);padding:6px}

/* TOAST / NOTIFICATION SIMULATION */
.toast{position:fixed;top:calc(20px + var(--safe-t));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 20px;border-radius:20px;font-size:14px;z-index:9999;display:none;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>

<!-- Firebase SDK Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
// ==========================================
// ЛОГИКА ПРИЛОЖЕНИЯ (iOS Optimized)
// ==========================================

let db = null;
let currentUser = null;
let currentChatId = null;
let unsubscribeMessages = null;
let allUsersCache = {}; 

const firebaseConfig = {
  apiKey: "AIzaSyDyuK9iREDYiA-NmjeWgECT2np57V-m86s",
  authDomain: "kz-messenger-test.firebaseapp.com",
  projectId: "kz-messenger-test",
  storageBucket: "kz-messenger-test.firebasestorage.app",
  messagingSenderId: "60956478899",
  appId: "1:60956478899:web:43fbbc9d9755e967b68fc6"
};

window.onload = async function() {
    try {
        const app = firebase.initializeApp(firebaseConfig);
        db = app.firestore();
        
        // Безопасная загрузка пользователей
        await loadAllUsersToCache(); 
        
        checkSession();

    } catch (e) {
        console.error("Init Error:", e);
        showError("Ошибка запуска: " + e.message);
    }
};

function log(msg) { console.log(msg); }
function logError(msg, err) { console.error(msg, err); }

// --- ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ ---
async function loadAllUsersToCache() {
    try {
        const snapshot = await db.collection("users").limit(50).get();
        snapshot.forEach(doc => {
            allUsersCache[doc.id] = { id: doc.id, ...doc.data() };
        });
        
        if (snapshot.empty) {
             const testUser = { badge: 'TEST-001', name: 'Тестовый Сотрудник', dept: 'QA', role: 'employee' };
             const ref = await db.collection("users").add(testUser);
             allUsersCache[ref.id] = { id: ref.id, ...testUser };
        }
    } catch (e) {
        logError("Load users failed", e);
    }
}

// --- АВТОРИЗАЦИЯ ---
function toggleReg() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('regForm').classList.toggle('hidden');
    document.getElementById('authErr').style.display = 'none';
}

async function handleLogin(e) {
    e.preventDefault();
    const badge = document.getElementById('badgeInput').value.toUpperCase().trim();
    if (!badge) return showError("Введите табельный номер");
    
    try {
        const snapshot = await db.collection("users").where("badge", "==", badge).limit(1).get();
        let userFound = null;
        snapshot.forEach(docSnap => { userFound = { id: docSnap.id, ...docSnap.data() }; });

        if (!userFound) throw new Error("Пользователь не найден");
        
        loginUser(userFound);
    } catch (err) {
        showError(err.message);
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const dept = document.getElementById('regDept').value.trim();
    const badge = document.getElementById('regBadge').value.toUpperCase().trim();
    
    if (!name || !dept || !badge) return showError("Заполните все поля");

    try {
        const exists = await db.collection("users").where("badge", "==", badge).limit(1).get();
        if (!exists.empty) throw new Error("Такой табельный уже занят");

        const newUser = { badge, name, dept, role: 'employee', createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        const userDocRef = await db.collection("users").add(newUser);
        const userId = userDocRef.id;

        allUsersCache[userId] = { id: userId, ...newUser };
        await addToGeneralChannel(userId);
        
        loginUser({ id: userId, ...newUser });
    } catch (err) {
        showError(err.message);
    }
}

async function addToGeneralChannel(userId) {
    try {
        const channelsCol = db.collection("chats");
        const q = channelsCol.where("type", "==", "channel").where("title", "==", "Общий завод");
        const snapshot = await q.get();

        if (!snapshot.empty) {
            const firstDoc = snapshot.docs[0];
            const data = firstDoc.data();
            if (!data.members.includes(userId)) {
                await firstDoc.ref.update({ members: [...data.members, userId] });
            }
        } else {
            await channelsCol.add({
                type: 'channel', title: 'Общий завод', description: 'Главный канал',
                members: [userId], createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                lastMessageText: 'Добро пожаловать!', lastMessageTime: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
    } catch(e) { logError("Add to channel failed", e); }
}

function loginUser(user) {
    currentUser = user;
    localStorage.setItem('kz_cloud_session', JSON.stringify(user));
    showScreen('home-screen');
    initApp();
}

function logout() {
    currentUser = null;
    localStorage.removeItem('kz_cloud_session');
    if (unsubscribeMessages) unsubscribeMessages();
    showScreen('auth-screen');
}

function checkSession() {
    const sess = localStorage.getItem('kz_cloud_session');
    if (sess) {
        try {
            currentUser = JSON.parse(sess);
            showScreen('home-screen');
            initApp();
        } catch (e) { logout(); }
    } else {
        showScreen('auth-screen');
    }
}

function showError(msg) {
    const el = document.getElementById('authErr');
    el.textContent = msg;
    el.style.display = 'block';
}

// --- НАВИГАЦИЯ ---
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
}

let currentTab = 'chats';
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    renderList(tab);
}

function initApp() {
    renderList('chats');
}

// --- РЕНДЕРИНГ СПИСКА ЧАТОВ ---
function renderList(tab) {
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Загрузка...</div>';
    
    const chatsRef = db.collection("chats");
    const q = chatsRef.where("members", "array-contains", currentUser.id);
    
    if(window.unsubscribeChats) window.unsubscribeChats();
    
    window.unsubscribeChats = q.onSnapshot((snapshot) => {
        container.innerHTML = '';
        let items = [];
        
        snapshot.forEach(doc => {
            const data = doc.data();
            items.push({ id: doc.id, ...data });
        });

        if (tab === 'channels') {
            items = items.filter(c => c.type === 'channel');
        } else if (tab === 'contacts') {
            items = Object.values(allUsersCache).filter(u => u.id !== currentUser.id).map(u => ({
                id: 'contact_' + u.id, type: 'contact', userId: u.id, displayTitle: u.name || 'Без имени', subtitle: u.dept || '-'
            }));
        } else {
            items = items.filter(c => c.type === 'dm');
        }

        if (items.length === 0) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Нет элементов</div>';
            return;
        }

        items.sort((a,b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.onclick = () => {
                if (item.type === 'contact') openOrCreateDM(item.userId);
                else openChat(item.id);
            };
            
            const displayName = item.displayTitle || item.title || "Чат";
            const preview = item.lastMessageText ? item.lastMessageText.substring(0, 30) : 'Нет сообщений';
            
            div.innerHTML = `
                <div class="avatar">${getInitials(displayName)}</div>
                <div class="li-body">
                    <div class="li-name">${escapeHtml(displayName)}</div>
                    <div class="li-preview">${escapeHtml(preview)}</div>
                </div>
            `;
            container.appendChild(div);
        });
    }, (error) => {
        logError("Chat list error", error);
        container.innerHTML = `<div style="padding:20px;color:red">Ошибка: ${error.message}</div>`;
    });
}

// --- ОТКРЫТИЕ ЧАТА ---
async function openOrCreateDM(userId) {
    try {
        const existing = await findExistingDM(userId);
        if (existing) { openChat(existing.id); return; }

        const sortedIds = [currentUser.id, userId].sort();
        const chatData = {
            type: 'dm', members: sortedIds, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(), lastMessageText: '', lastMessageSender: ''
        };
        
        const docRef = await db.collection("chats").add(chatData);
        openChat(docRef.id);
    } catch (e) { alert("Ошибка создания чата: " + e.message); }
}

async function findExistingDM(userId) {
    const chatsRef = db.collection("chats");
    const q = chatsRef.where("type", "==", "dm").where("members", "array-contains", currentUser.id);
    const snapshot = await q.get();
    for(const doc of snapshot.docs) {
        const data = doc.data();
        if(data.members.includes(userId)) return { id: doc.id, ...data };
    }
    return null;
}

function openChat(chatId) {
    currentChatId = chatId;
    document.getElementById('chatHeaderName').textContent = "Загрузка...";
    showScreen('chat-screen');
    loadHistorySafe(chatId);
}

async function loadHistorySafe(chatId) {
    const msgsRef = db.collection("messages");
    let q = msgsRef.where("chatId", "==", chatId).orderBy("createdAt", "asc").limit(100);
    
    try {
        const snapshot = await q.get();
        const docs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        renderMessages(docs);
        
        const chatInfo = await db.collection("chats").doc(chatId).get();
        if(chatInfo.exists) {
             const data = chatInfo.data();
             let title = data.title || "Диалог";
             if (data.type === 'dm') {
                 const otherId = data.members.find(m => m !== currentUser.id);
                 title = allUsersCache[otherId]?.name || "Собеседник";
             }
             document.getElementById('chatHeaderName').textContent = title;
        }
        subscribeToNewMessages(chatId);
    } catch (error) {
        const qFallback = msgsRef.where("chatId", "==", chatId).limit(100);
        const snap = await qFallback.get();
        const docs = snap.docs.map(d => ({id:d.id, ...d.data()}));
        docs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderMessages(docs);
        subscribeToNewMessages(chatId);
    }
}

function subscribeToNewMessages(chatId) {
    if (unsubscribeMessages) unsubscribeMessages();
    
    const msgsRef = db.collection("messages");
    const q = msgsRef.where("chatId", "==", chatId);
    
    unsubscribeMessages = q.onSnapshot((snapshot) => {
        const msgs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        msgs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderMessages(msgs);
    });
}

function closeChat() {
    if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
    currentChatId = null;
    showScreen('home-screen');
    renderList(currentTab);
}

function renderMessages(msgs) {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    
    msgs.forEach(m => {
        const isMe = m.senderId === currentUser.id;
        const senderName = allUsersCache[m.senderId]?.name || '???';
        const timeStr = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        div.innerHTML = `
            ${!isMe ? `<div style="font-size:11px;color:var(--brand);margin-bottom:2px">${senderName.split(' ')[0]}</div>` : ''}
            <div>${escapeHtml(m.text)}</div>
            <div class="msg-meta">${timeStr}</div>
        `;
        container.appendChild(div);
    });
    
    container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    input.value = '';
    
    try {
        const msgData = { chatId: currentChatId, senderId: currentUser.id, text: text, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        await db.collection("messages").add(msgData);
        
        const chatRef = db.collection("chats").doc(currentChatId);
        await chatRef.set({
            lastMessageText: text, lastMessageTime: firebase.firestore.FieldValue.serverTimestamp(), lastMessageSender: currentUser.id
        }, { merge: true });
        
    } catch (e) { alert("Не удалось отправить: " + e.message); }
}

// UTILS
function getInitials(name) {
    if (!name) return '?';
    const parts = String(name).split(' ');
    return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, m => map[m]);
}
</script>
</head>
<body>

<div id="app-container">
  
  <!-- 1. ЭКРАН ВХОДА -->
  <div id="auth-screen" class="screen active">
    <div class="brand">
      <h1>КОЛОМЕНСКИЙ ЗАВОД</h1>
      <p style="color:var(--text2)">Корпоративная связь</p>
    </div>
    <div id="authErr" class="err-msg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field"><label>Табельный номер</label><input class="input" id="badgeInput" placeholder="KZ-00001" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="passInput" placeholder="••••••" required></div>
      <button class="btn-main">Войти</button>
      <a href="#" class="link" onclick="toggleReg()">Нет аккаунта? Зарегистрироваться</a>
    </form>
    <form id="regForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="field"><label>ФИО</label><input class="input" id="regName" placeholder="Иванов И.И." required></div>
      <div class="field"><label>Подразделение</label><input class="input" id="regDept" placeholder="IT-отдел" required></div>
      <div class="field"><label>Табельный номер</label><input class="input" id="regBadge" placeholder="KZ-00100" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="regPass" placeholder="Мин 6 символов" required minlength="6"></div>
      <button class="btn-main">Создать аккаунт</button>
      <a href="#" class="link" onclick="toggleReg()">Уже есть аккаунт? Войти</a>
    </form>
  </div>

  <!-- 2. ГЛАВНЫЙ ЭКРАН -->
  <div id="home-screen" class="screen">
    <div class="nav-bar">
      <div class="nav-title" id="pageTitle">Чаты</div>
      <button onclick="logout()" style="color:red;font-size:14px">Выйти</button>
    </div>
    <div class="list-scroll" id="chatListContainer"></div>
    <div class="tab-bar">
      <button class="tab-item active" onclick="switchTab('chats')" id="tabChats">💬<br>Чаты</button>
      <button class="tab-item" onclick="switchTab('channels')" id="tabChannels">📢<br>Каналы</button>
      <button class="tab-item" onclick="switchTab('contacts')" id="tabContacts">👥<br>Контакты</button>
    </div>
  </div>

  <!-- 3. ЭКРАН ЧАТА -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">‹ Назад</button>
      <div class="nav-title" id="chatHeaderName">Чат</div>
    </div>
    <div class="msg-list" id="messagesContainer"></div>
    <div class="composer">
      <textarea class="comp-input" id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

</body>
</html>
