**Что внутри:**
1.  **Firebase Firestore:** Реальная синхронизация сообщений между устройствами в реальном времени.
2.  **Push-уведомления (VAPID):** Настроен запрос разрешений и сохранение токена пользователя. При открытии приложения оно само попытается включить уведомления.
3.  **Звук уведомлений:** Встроенный генератор звука (Web Audio API), который играет "дзынь" при получении нового сообщения, даже если вкладка активна.
4.  **iOS Design:** Адаптация под iPhone (Safe Areas, Blur-эффекты, нативные шрифты SF Pro).
5.  **Авторизация:** Вход/Регистрация по табельному номеру через базу данных.
6.  **Чаты:** Личные диалоги (DM) и общие каналы ("Общий завод").

### Инструкция по установке:

1.  Зайди в свой репозиторий GitHub (`kz-message-`).
2.  Открой файл `index.html`.
3.  Нажми ✏️ **Edit**.
4.  **Удали всё содержимое файла.**
5.  Скопируй код ниже и вставь его целиком.
6.  Проверь, что в строке `const VAPID_KEY = ...` стоит твой ключ (я уже вставил тот, что ты присылал ранее: `BBAJLwdFGqVuHh3lKD__uitkry2FxfCgJs5osTtuCeB0Ra7KCx5ZXRGW2Dkjt2eL6Pmph8msWDbe89514HwG-TQ`).
7.  Нажми **Commit changes**.

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

const VAPID_KEY = "BBAJLwdFGqVuHh3lKD__uitkry2FxfCgJs5osTtuCeB0Ra7KCx5ZXRGW2Dkjt2eL6Pmph8msWDbe89514HwG-TQ";

// ===== AUDIO ENGINE (Звук уведомлений) =====
function initAudio() {
    try {
        // Создаем контекст аудио только после взаимодействия пользователя (политика браузеров)
        document.addEventListener('click', () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }, { once: true });
    } catch(e) { console.warn("Audio not supported"); }
}

function playNotificationSound() {
    if (!audioContext) return;
    // Генерируем короткий "дзынь" синтезатором
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.frequency.setValueAtTime(800, audioContext.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
    osc.start();
    osc.stop(audioContext.currentTime + 0.5);
}

// ===== PUSH NOTIFICATIONS LOGIC =====
async function requestPushPermission() {
    if (!('Notification' in window)) {
        alert("Ваш браузер не поддерживает уведомления");
        return;
    }
    
    const permission = await Notification.requestPermission();
    if (permission === 'granted') {
        try {
            // Регистрируем Service Worker
            const registration = await navigator.serviceWorker.register('./sw.js');
            
            // Получаем токен FCM
            const token = await getToken(messaging, { vapidKey: VAPID_KEY });
            console.log("✅ Push Token получен:", token);
            
            // Сохраняем токен пользователя в БД
            if (currentUser && token) {
                await setDoc(doc(db, "users", currentUser.id), { fcmToken: token }, { merge: true });
            }
            
            showToast("Уведомления включены!");
        } catch (err) {
            console.error("Error getting token:", err);
            alert("Ошибка получения токена: " + err.message);
        }
    } else {
        alert("Разрешение на уведомления отклонено");
    }
}

// Слушаем входящие сообщения, когда приложение ОТКРЫТО
onMessage(messaging, (payload) => {
    console.log('Message received in foreground:', payload);
    playNotificationSound();
    showToast(payload.notification?.title || "Новое сообщение", payload.notification?.body);
    // Обновляем список чатов
    renderList(currentTab); 
});

// ===== AUTHENTICATION =====
function toggleReg() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('regForm').classList.toggle('hidden');
    document.getElementById('authErr').style.display = 'none';
}

async function handleLogin(e) {
    e.preventDefault();
    const badge = document.getElementById('badgeInput').value.toUpperCase().trim();
    if (!badge) return showError("Введите табельный номер");
    
    try {
        const q = query(collection(db, "users"), where("badge", "==", badge), limit(1));
        const snapshot = await getDocs(q);
        
        let userFound = null;
        snapshot.forEach(docSnap => {
            userFound = { id: docSnap.id, ...docSnap.data() };
        });

        if (!userFound) throw new Error("Пользователь не найден. Зарегистрируйтесь.");
        
        loginUser(userFound);
    } catch (err) {
        showError(err.message);
    }
}

async function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const dept = document.getElementById('regDept').value.trim();
    const badge = document.getElementById('regBadge').value.toUpperCase().trim();
    
    if (!name || !dept || !badge) return showError("Заполните все поля");

    try {
        const q = query(collection(db, "users"), where("badge", "==", badge), limit(1));
        const snapshot = await getDocs(q);
        if (!snapshot.empty) throw new Error("Такой табельный уже занят");

        const newUser = { badge, name, dept, role: 'employee', createdAt: serverTimestamp() };
        const userDocRef = await addDoc(collection(db, "users"), newUser);
        const userId = userDocRef.id;

        // Автоматически добавляем в общий канал
        await ensureGeneralChannelExists(userId);
        
        loginUser({ id: userId, ...newUser });
    } catch (err) {
        showError(err.message);
    }
}

async function ensureGeneralChannelExists(userId) {
    const channelsCol = collection(db, "chats");
    const q = query(channelsCol, where("type", "==", "channel"), where("title", "==", "Общий завод"));
    const snapshot = await getDocs(q);

    if (snapshot.empty) {
        const channelData = {
            type: 'channel', title: 'Общий завод', description: 'Главный канал предприятия',
            members: [userId], createdAt: serverTimestamp(),
            lastMessageText: 'Добро пожаловать!', lastMessageTime: serverTimestamp()
        };
        await addDoc(channelsCol, channelData);
    } else {
        const firstDoc = snapshot.docs[0];
        const data = firstDoc.data();
        if (!data.members.includes(userId)) {
            await updateDoc(firstDoc.ref, { members: [...data.members, userId] });
        }
    }
}

function loginUser(user) {
    currentUser = user;
    localStorage.setItem('kz_cloud_session', JSON.stringify(user));
    showScreen('home-screen');
    initApp();
    // Сразу просим разрешение на пуши после входа
    setTimeout(requestPushPermission, 1000);
}

function logout() {
    currentUser = null;
    localStorage.removeItem('kz_cloud_session');
    if (unsubscribeMessages) unsubscribeMessages();
    showScreen('auth-screen');
}

function checkSession() {
    const sess = localStorage.getItem('kz_cloud_session');
    if (sess) {
        try {
            currentUser = JSON.parse(sess);
            showScreen('home-screen');
            initApp();
        } catch (e) { logout(); }
    } else {
        showScreen('auth-screen');
    }
}

function showError(msg) {
    const el = document.getElementById('authErr');
    el.textContent = msg;
    el.style.display = 'block';
}

function showToast(title, body) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<strong>${title}</strong><br><small>${body}</small>`;
    document.body.appendChild(t);
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; setTimeout(() => t.remove(), 300); }, 3000);
}

// ===== NAVIGATION =====
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const target = document.getElementById(id);
    if(target) target.classList.add('active');
}

let currentTab = 'chats';
function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');

// ===== APP INITIALIZATION =====
function initApp() {
    loadAllUsers();
    renderList('chats');
}

async function loadAllUsers() {
    const usersRef = collection(db, "users");
    const snapshot = await getDocs(usersRef);
    snapshot.forEach(docSnap => {
        allUsersCache[docSnap.id] = { id: docSnap.id, ...docSnap.data() };
    });
}

// ===== CHAT LIST RENDERING =====
function renderList(tab) {
    const container = document.getElementById('chatListContainer');
    container.innerHTML = '';
    
    let items = [];
    
    // Загружаем чаты пользователя из Firestore
    const chatsRef = collection(db, "chats");
    const q = query(chatsRef, where("members", "array-contains", currentUser.id));
    
    // Используем onSnapshot для realtime обновления списка
    if(window.unsubscribeChats) window.unsubscribeChats();
    window.unsubscribeChats = onSnapshot(q, (snapshot) => {
        items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        
        // Фильтрация по типу таба
        if (tab === 'channels') items = items.filter(c => c.type === 'channel');
        else if (tab === 'contacts') {
            // Контакты - это все пользователи кроме себя
            items = Object.values(allUsersCache).filter(u => u.id !== currentUser.id).map(u => ({
                id: 'contact_' + u.id, type: 'contact', userId: u.id, displayTitle: u.name, subtitle: u.dept
            }));
        } else {
            // Личные чаты
            items = items.filter(c => c.type === 'dm');
        }

        // Рендеринг
        if (items.length === 0) {
            container.innerHTML = '<div style="padding:20px;text-align:center;color:#999">Нет элементов</div>';
            return;
        }

        items.sort((a,b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.onclick = () => {
                if (item.type === 'contact') openOrCreateDM(item.userId);
                else openChat(item.id);
            };
            
            const preview = item.lastMessageText ? item.lastMessageText.substring(0, 30) : 'Нет сообщений';
            const unread = item.unreadCount || 0; 
            
            div.innerHTML = `
                <div class="avatar">${getInitials(item.displayTitle || item.title)}</div>
                <div class="li-body">
                    <div class="li-name">${escapeHtml(item.displayTitle || item.title)}</div>
                    <div class="li-preview">${escapeHtml(preview)}</div>
                </div>
                ${unread > 0 ? `<span class="badge">${unread}</span>` : ''}
            `;
            container.appendChild(div);
        });
    });
}

// ===== OPEN CHAT =====
async function openOrCreateDM(userId) {
    try {
        const existing = await findExistingDM(userId);
        if (existing) { openChat(existing.id); return; }

        const sortedIds = [currentUser.id, userId].sort();
        const chatData = {
            type: 'dm', members: sortedIds, createdAt: serverTimestamp(),
            lastMessageTime: serverTimestamp(), lastMessageText: '', lastMessageSender: ''
        };
        
        const docRef = await addDoc(collection(db, "chats"), chatData);
        openChat(docRef.id);
    } catch (e) { alert("Ошибка: " + e.message); }
}

async function findExistingDM(userId) {
    const chatsRef = collection(db, "chats");
    const q = query(chatsRef, where("type", "==", "dm"), where("members", "array-contains", currentUser.id));
    const snapshot = await getDocs(q);
    for(const doc of snapshot.docs) {
        const data = doc.data();
        if(data.members.includes(userId)) return { id: doc.id, ...data };
    }
    return null;
}

function openChat(chatId) {
    currentChatId = chatId;
    document.getElementById('chatHeaderName').textContent = "Загрузка...";
    showScreen('chat-screen');
    loadHistorySafe(chatId);
}

async function loadHistorySafe(chatId) {
    const msgsRef = collection(db, "messages");
    const q = query(msgsRef, where("chatId", "==", chatId), orderBy("createdAt", "asc"), limit(100));
    
    try {
        const snapshot = await getDocs(q);
        const docs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        renderMessages(docs);
        
        // Обновляем заголовок
        const chatInfo = await getDoc(doc(db, "chats", chatId));
        if(chatInfo.exists()) {
             const data = chatInfo.data();
             document.getElementById('chatHeaderName').textContent = data.title || "Диалог";
        }

        subscribeToNewMessages(chatId);
    } catch (error) {
        console.error("Load history error:", error);
        // Fallback без orderBy если индекс не создан
        const qFallback = query(msgsRef, where("chatId", "==", chatId), limit(100));
        const snap = await getDocs(qFallback);
        const docs = snap.docs.map(d => ({id:d.id, ...d.data()}));
        docs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderMessages(docs);
        subscribeToNewMessages(chatId);
    }
}

function subscribeToNewMessages(chatId) {
    if (unsubscribeMessages) unsubscribeMessages();
    
    const msgsRef = collection(db, "messages");
    const q = query(msgsRef, where("chatId", "==", chatId));
    
    unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const msgs = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
        msgs.sort((a,b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
        renderMessages(msgs);
        
        // Если пришло новое сообщение от другого человека
        if (msgs.length > 0) {
            const lastMsg = msgs[msgs.length - 1];
            if (lastMsg.senderId !== currentUser.id) {
                playNotificationSound();
            }
        }
    });
}

function closeChat() {
    if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
    currentChatId = null;
    showScreen('home-screen');
    renderList(currentTab);
}

function renderMessages(msgs) {
    const container = document.getElementById('messagesContainer');
    container.innerHTML = '';
    
    msgs.forEach(m => {
        const isMe = m.senderId === currentUser.id;
        const senderName = allUsersCache[m.senderId]?.name || '???';
        const timeStr = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'me' : 'other'}`;
        div.innerHTML = `
            ${!isMe ? `<div style="font-size:11px;color:var(--brand);margin-bottom:2px">${senderName.split(' ')[0]}</div>` : ''}
            <div>${escapeHtml(m.text)}</div>
            <div class="msg-meta">${timeStr}</div>
        `;
        container.appendChild(div);
    });
    
    container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    
    input.value = '';
    
    try {
        const msgData = { chatId: currentChatId, senderId: currentUser.id, text: text, createdAt: serverTimestamp() };
        await addDoc(collection(db, "messages"), msgData);
        
        // Обновляем метаданные чата
        const chatRef = doc(db, "chats", currentChatId);
        await setDoc(chatRef, {
            lastMessageText: text, lastMessageTime: serverTimestamp(), lastMessageSender: currentUser.id
        }, { merge: true });
        
    } catch (e) { alert("Не удалось отправить: " + e.message); }
}

// UTILS
function getInitials(name) {
    if (!name) return '?';
    const parts = name.split(' ');
    return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

function escapeHtml(text) {
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, m => map[m]);
}
</script>
</head>
<body>

<div id="app-container">
  
  <!-- 1. ЭКРАН ВХОДА -->
  <div id="auth-screen" class="screen active">
    <div class="brand">
      <h1>КОЛОМЕНСКИЙ ЗАВОД</h1>
      <p style="color:var(--text2)">Корпоративная связь</p>
    </div>
    <div id="authErr" class="err-msg"></div>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field"><label>Табельный номер</label><input class="input" id="badgeInput" placeholder="KZ-00001" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="passInput" placeholder="••••••" required></div>
      <button class="btn-main">Войти</button>
      <a href="#" class="link" onclick="toggleReg()">Нет аккаунта? Зарегистрироваться</a>
    </form>
    <form id="regForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="field"><label>ФИО</label><input class="input" id="regName" placeholder="Иванов И.И." required></div>
      <div class="field"><label>Подразделение</label><input class="input" id="regDept" placeholder="IT-отдел" required></div>
      <div class="field"><label>Табельный номер</label><input class="input" id="regBadge" placeholder="KZ-00100" required></div>
      <div class="field"><label>Пароль</label><input class="input" type="password" id="regPass" placeholder="Мин 6 символов" required minlength="6"></div>
      <button class="btn-main">Создать аккаунт</button>
      <a href="#" class="link" onclick="toggleReg()">Уже есть аккаунт? Войти</a>
    </form>
  </div>

  <!-- 2. ГЛАВНЫЙ ЭКРАН -->
  <div id="home-screen" class="screen">
    <div class="nav-bar">
      <div class="nav-title" id="pageTitle">Чаты</div>
      <button onclick="logout()" style="color:var(--red);font-size:14px">Выйти</button>
    </div>
    <div class="list-scroll" id="chatListContainer"></div>
    <div class="tab-bar">
      <button class="tab-item active" onclick="switchTab('chats')" id="tabChats">💬<br>Чаты</button>
      <button class="tab-item" onclick="switchTab('channels')" id="tabChannels">📢<br>Каналы</button>
      <button class="tab-item" onclick="switchTab('contacts')" id="tabContacts">👥<br>Контакты</button>
    </div>
  </div>

  <!-- 3. ЭКРАН ЧАТА -->
  <div id="chat-screen" class="screen">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()">‹ Назад</button>
      <div class="nav-title" id="chatHeaderName">Чат</div>
    </div>
    <div class="msg-list" id="messagesContainer"></div>
    <div class="composer">
      <textarea class="comp-input" id="messageInput" placeholder="Сообщение..." rows="1"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

</body>
</html>
