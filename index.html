<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>KZ Messenger</title>
<link rel="manifest" href="./manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#252540;--border:#2d2d4a;--text:#e8e8f0;--text2:#a0a0b8;--accent:#4a9eff;--accent2:#3a7edc;--success:#4caf50;--error:#f44336;--warning:#ff9800;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;width:100%;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== ЭКРАНЫ ===== */
.screen{display:none;height:100vh;flex-direction:column}
.screen.active{display:flex}

/* ===== ЗАГРУЗКА ===== */
#loading{align-items:center;justify-content:center;gap:20px}
.spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{color:var(--text2);font-size:14px}
.load-error{color:var(--error);font-size:13px;text-align:center;max-width:300px;line-height:1.5}

/* ===== АВТОРИЗАЦИЯ ===== */
#auth{align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a3e 100%)}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.auth-logo{text-align:center;margin-bottom:24px}
.auth-logo h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.auth-logo p{color:var(--text2);font-size:13px;margin-top:6px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.btn-primary{width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:var(--radius);font-weight:600;font-size:15px;transition:all .2s;margin-top:8px}
.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{width:100%;padding:12px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:var(--radius);font-weight:500;font-size:14px;margin-top:12px;transition:all .2s}
.btn-secondary:hover{background:rgba(74,158,255,.1)}
.auth-switch{text-align:center;margin-top:20px;font-size:13px;color:var(--text2)}
.auth-switch a{color:var(--accent);text-decoration:none;font-weight:500}
.auth-error{background:rgba(244,67,54,.1);border:1px solid rgba(244,67,54,.3);color:var(--error);padding:12px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none}
.auth-success{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);color:var(--success);padding:12px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:none}

/* ===== ГЛАВНЫЙ ЭКРАН ===== */
#main{flex-direction:row}
.sidebar{width:320px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;z-index:100}
.chat-area{flex:1;display:flex;flex-direction:column;height:100vh;background:var(--bg);position:relative}

/* Мобильная кнопка открытия сайдбара */
.mobile-menu-btn{position:absolute;top:12px;left:12px;z-index:101;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:none;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* Сайбар */
.sb-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:var(--text2);text-transform:capitalize}
.sb-actions{display:flex;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;transition:background .2s}
.icon-btn:hover{background:var(--surface2)}

.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.search-box{padding:12px 16px}
.search-input{position:relative}
.search-input input{padding-left:36px;font-size:13px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:14px}

.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius);cursor:pointer;transition:background .2s;margin-bottom:4px}
.chat-item:hover{background:var(--surface2)}
.chat-item.active{background:var(--surface2);border-left:3px solid var(--accent)}
.chat-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0;position:relative}
.chat-avatar.channel{border-radius:10px}
.online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;border-radius:50%;background:var(--success);border:2px solid var(--surface)}
.chat-content{flex:1;min-width:0}
.chat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.chat-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--text2);flex-shrink:0}
.chat-preview{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-badge{background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0}

.empty-state{padding:40px 20px;text-align:center;color:var(--text2)}
.empty-icon{font-size:48px;margin-bottom:12px;opacity:.5}

/* Область чата */
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface)}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:600;font-size:15px}
.chat-header-status{font-size:12px;color:var(--text2)}
.messages-container{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px}
.date-divider{text-align:center;margin:16px 0;font-size:12px;color:var(--text2)}
.date-divider span{background:var(--surface2);padding:4px 12px;border-radius:12px}

.message{display:flex;flex-direction:column;max-width:70%;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.outgoing{align-self:flex-end;align-items:flex-end}
.message.incoming{align-self:flex-start;align-items:flex-start}
.message.system{align-self:center;max-width:90%}
.msg-sender{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:2px;padding:0 4px}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word;position:relative}
.message.outgoing .msg-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.message.incoming .msg-bubble{background:var(--surface2);border-bottom-left-radius:4px}
.message.system .msg-bubble{background:transparent;color:var(--text2);font-size:12px;text-align:center}
.msg-meta{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2);margin-top:2px;padding:0 4px}
.message.outgoing .msg-meta{color:rgba(255,255,255,.7)}
.msg-check{font-size:12px}
.msg-check.read{color:#4fc3f7}
.msg-reply{border-left:3px solid var(--accent);padding:4px 8px;margin-bottom:4px;font-size:12px;color:var(--text2);background:rgba(0,0,0,.1);border-radius:0 6px 6px 0;cursor:pointer}
.msg-file{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.15);padding:8px 12px;border-radius:8px;margin-top:6px;cursor:pointer}
.msg-file-icon{font-size:24px}
.msg-file-info{flex:1;min-width:0}
.msg-file-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-file-size{font-size:11px;opacity:.7}
.reactions-bar{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.reaction-pill{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:2px 8px;font-size:12px;cursor:pointer;transition:all .2s}
.reaction-pill:hover{border-color:var(--accent)}
.reaction-pill.mine{border-color:var(--accent);background:rgba(74,158,255,.15)}

.typing-indicator{font-size:12px;color:var(--accent);padding:4px 16px;min-height:20px}

.composer{padding:12px 16px;border-top:1px solid var(--border);background:var(--surface)}
.reply-preview{display:flex;align-items:center;gap:8px;background:var(--surface2);padding:8px 12px;border-radius:8px;margin-bottom:8px;font-size:12px}
.reply-preview-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.reply-close{color:var(--text2);font-size:16px;padding:0 4px}
.reply-close:hover{color:var(--text)}
.composer-row{display:flex;align-items:flex-end;gap:8px}
.composer-input{flex:1;resize:none;min-height:44px;max-height:120px;padding:12px 16px;font-size:14px}
.send-btn{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:all .2s}
.send-btn:hover{background:var(--accent2);transform:scale(1.05)}
.send-btn:active{transform:scale(.95)}
.attach-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;transition:background .2s}
.attach-btn:hover{background:var(--surface2)}

.no-chat-selected{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text2)}
.no-chat-icon{font-size:64px;opacity:.3}

/* Контекстное меню */
.context-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px;z-index:1000;min-width:180px;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:ctxIn .15s ease}
@keyframes ctxIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;transition:background .15s}
.ctx-item:hover{background:var(--surface2)}
.ctx-item.danger{color:var(--error)}
.ctx-separator{height:1px;background:var(--border);margin:4px 0}
.ctx-reactions{display:flex;gap:4px;padding:8px;flex-wrap:wrap}
.ctx-reaction{font-size:20px;cursor:pointer;padding:4px;border-radius:6px;transition:background .15s}
.ctx-reaction:hover{background:var(--surface2)}

/* Тосты */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 16px;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:toastIn .3s ease;font-size:13px}
@keyframes toastIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--error)}
.toast.warning{border-left-color:var(--warning)}
.toast.hide{animation:toastOut .3s ease forwards}
@keyframes toastOut{to{opacity:0;transform:translateX(100%)}}

/* Модалка */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;animation:modalIn .3s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal h3{font-size:18px;margin-bottom:20px}
.modal-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.modal-row:last-of-type{border:none}
.modal-key{color:var(--text2)}
.modal-actions{display:flex;gap:12px;margin-top:20px}
.modal-actions button{flex:1}

/* Настройки */
.settings-section{margin-bottom:24px}
.settings-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.settings-label{font-size:14px}
.settings-hint{font-size:12px;color:var(--text2);margin-top:2px}
.settings-value{font-size:13px;color:var(--accent);font-weight:500}
.toggle{width:48px;height:26px;background:var(--border);border-radius:13px;position:relative;cursor:pointer;transition:background .2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(22px)}
.btn-danger{background:var(--error);color:#fff}
.btn-danger:hover{background:#d32f2f}

/* Адаптив */
@media(max-width:768px){
.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .3s ease;width:85vw;max-width:320px}
.sidebar.open{transform:translateX(0)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;display:none}
.scrim.show{display:block}
.mobile-menu-btn{display:flex!important}
.message{max-width:85%}
}
</style>
</head>
<body>

<!-- ЭКРАН ЗАГРУЗКИ -->
<div id="loading" class="screen active">
<div class="spinner"></div>
<div class="load-text">Инициализация KZ Messenger…</div>
<div class="load-error" id="loadError" style="display:none"></div>
</div>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<div id="auth" class="screen">
<div class="auth-card">
<div class="auth-logo">
<h1>KZ Messenger</h1>
<p>Корпоративный мессенджер</p>
</div>
<div class="auth-error" id="authError"></div>
<div class="auth-success" id="authSuccess"></div>

<!-- Форма входа -->
<div id="loginForm">
<div class="form-group">
<label class="form-label">Табельный номер</label>
<input type="text" id="loginBadge" placeholder="Например: KZ-00123" autocomplete="off">
</div>
<div class="form-group">
<label class="form-label">Пароль</label>
<input type="password" id="loginPassword" placeholder="••••••••">
</div>
<button class="btn-primary" onclick="handleLogin()">Войти</button>
<div class="auth-switch">Нет аккаунта? <a href="#" onclick="showRegister(event)">Зарегистрироваться</a></div>
</div>

<!-- Форма регистрации -->
<div id="registerForm" style="display:none">
<div class="form-group">
<label class="form-label">ФИО</label>
<input type="text" id="regName" placeholder="Иванов Иван Иванович">
</div>
<div class="form-group">
<label class="form-label">Табельный номер</label>
<input type="text" id="regBadge" placeholder="KZ-XXXXX">
</div>
<div class="form-group">
<label class="form-label">Подразделение</label>
<select id="regDept">
<option value="">Выберите...</option>
<option value="Дирекция">Дирекция</option>
<option value="Инженерия">Инженерия</option>
<option value="Производство">Производство</option>
<option value="IT">IT-отдел</option>
<option value="HR">Отдел кадров</option>
<option value="Финансы">Финансы</option>
<option value="Безопасность">Служба безопасности</option>
<option value="Логистика">Логистика</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Должность</label>
<input type="text" id="regPosition" placeholder="Инженер-технолог">
</div>
<div class="form-group">
<label class="form-label">Пароль</label>
<input type="password" id="regPassword" placeholder="Минимум 6 символов">
</div>
<div class="form-group">
<label class="form-label">Повторите пароль</label>
<input type="password" id="regPassword2" placeholder="••••••••">
</div>
<button class="btn-primary" onclick="handleRegister()">Зарегистрироваться</button>
<div class="auth-switch">Уже есть аккаунт? <a href="#" onclick="showLogin(event)">Войти</a></div>
</div>
</div>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="main" class="screen">
<div class="scrim" id="scrim" onclick="closeSidebar()"></div>

<!-- Кнопка открытия меню (для мобильных) -->
<button class="mobile-menu-btn" onclick="toggleSidebar()" title="Меню">☰</button>

<!-- Сайдбар -->
<aside class="sidebar" id="sidebar">
<div class="sb-header">
<div class="user-avatar" id="currentUserAvatar">?</div>
<div class="user-info">
<div class="user-name" id="currentUserName">—</div>
<div class="user-role" id="currentUserRole">—</div>
</div>
<div class="sb-actions">
<button class="icon-btn" onclick="openSettings()" title="Настройки">⚙</button>
</div>
</div>

<div class="tabs">
<button class="tab active" data-tab="chats" onclick="switchTab('chats')">Чаты</button>
<button class="tab" data-tab="channels" onclick="switchTab('channels')">Каналы</button>
<button class="tab" data-tab="contacts" onclick="switchTab('contacts')">Контакты</button>
</div>

<div class="search-box">
<div class="search-input">
<span class="search-icon">🔍</span>
<input type="text" id="globalSearch" placeholder="Поиск..." oninput="handleGlobalSearch(this.value)">
</div>
</div>

<div class="chat-list" id="chatList"></div>
</aside>

<!-- Область чата -->
<main class="chat-area" id="chatArea">
<div class="no-chat-selected" id="noChatSelected">
<div class="no-chat-icon">💬</div>
<div>Выберите чат для начала общения</div>
</div>

<div id="activeChatView" style="display:none;flex-direction:column;height:100%">
<div class="chat-header">
<button class="icon-btn menu-toggle" onclick="toggleSidebar()">←</button>
<div class="chat-avatar" id="chatHeaderAvatar">?</div>
<div class="chat-header-info">
<div class="chat-header-name" id="chatHeaderName">—</div>
<div class="chat-header-status" id="chatHeaderStatus">—</div>
</div>
<button class="icon-btn" onclick="showChatInfo()" title="Информация">ℹ️</button>
<button class="icon-btn" onclick="showChatMenu(event)" title="Меню">⋮</button>
</div>

<div class="messages-container" id="messagesContainer"></div>
<div class="typing-indicator" id="typingIndicator"></div>

<div class="composer">
<div class="reply-preview" id="replyPreview" style="display:none">
<span>↩ Ответ:</span>
<span class="reply-preview-text" id="replyPreviewText"></span>
<button class="reply-close" onclick="cancelReply()">✕</button>
</div>
<div class="composer-row">
<button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить файл">📎</button>
<input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(this)">
<textarea class="composer-input" id="messageInput" placeholder="Написать сообщение..." rows="1" onkeydown="handleComposerKey(event)" oninput="autoResizeTextarea(this);emitTyping()"></textarea>
<button class="send-btn" onclick="sendMessage()" title="Отправить">➤</button>
</div>
</div>
</div>
</main>
</div>

<script>
// ============================================================
// KZ MESSENGER v2.1 — Single File Corporate Messenger
// Регистрация по табельному номеру + Web Push уведомления
// Исправление мобильного интерфейса
// ============================================================

(function(){
'use strict';

// ---------- КОНСТАНТЫ ----------
const DB_KEY = 'kz_messenger_db_v2';
const SESSION_KEY = 'kz_session_v2';
const BUS_CHANNEL = 'kz-msg-bus-v2';
const SW_NAME = './sw.js';
const VAPID_PUBLIC_KEY = ''; // Заполнить при подключении реального сервера push

// ---------- СОСТОЯНИЕ ----------
let db = null;
let currentUser = null;

// ---------- УТИЛИТЫ ----------
function $(id){return document.getElementById(id);}
function qs(sel){return document.querySelector(sel);}
function qsa(sel){return document.querySelectorAll(sel);}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function genId(prefix){return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function timeAgo(ts){
const diff=Date.now()-ts;
if(diff<60000)return'сейчас';
if(diff<3600000)return Math.floor(diff/60000)+' мин';
if(diff<86400000)return Math.floor(diff/3600000)+' ч';
return new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function formatTime(ts){return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}
function formatDate(ts){
const d=new Date(ts),now=new Date();
if(d.toDateString()===now.toDateString())return'Сегодня';
const yest=new Date(now);yest.setDate(now.getDate()-1);
if(d.toDateString()===yest.toDateString())return'Вчера';
return d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
}
function getInitials(name){
if(!name)return'?';
const parts=name.trim().split(/\s+/);
return parts.length>=2?(parts[0][0]+parts[1][0]).toUpperCase():name.slice(0,2).toUpperCase();
}
function getColor(str){
const colors=['#e91e63','#9c27b0','#673ab7','#3f51b5','#2196f3','#00bcd4','#009688','#4caf50','#ff9800','#ff5722','#795548','#607d8b'];
let hash=0;for(let i=0;i<str.length;i++)hash=str.charCodeAt(i)+((hash<<5)-hash);
return colors[Math.abs(hash)%colors.length];
}
function debounce(fn,ms){let t;return function(...args){clearTimeout(t);t=setTimeout(()=>fn.apply(this,args),ms);};}

// ---------- ТОСТЫ ----------
function showToast(msg,type='info'){
const container=document.createElement('div');
container.className='toast-container';
document.body.appendChild(container);
const toast=document.createElement('div');
toast.className='toast '+type;
toast.textContent=msg;
container.appendChild(toast);
setTimeout(()=>{toast.classList.add('hide');setTimeout(()=>container.remove(),300);},4000);
}

// ---------- ШИНА СОБЫТИЙ (BroadcastChannel) ----------
function initBus(){
try{
bus=new BroadcastChannel(BUS_CHANNEL);
bus.onmessage=e=>handleBusMessage(e.data);
console.log('✅ BroadcastChannel initialized');
}catch(e){
console.warn('⚠️ BroadcastChannel not available, using storage events fallback');
window.addEventListener('storage',e=>{
if(e.key==='kz_bus_event'&&e.newValue){
try{handleBusMessage(JSON.parse(e.newValue));}catch(err){}
}
});
}
}
function broadcastEvent(ev){
ev.timestamp=Date.now();
ev.senderId=currentUser?.id;
if(bus){try{bus.postMessage(ev);return;}catch(e){}}
try{localStorage.setItem('kz_bus_event',JSON.stringify({...ev,_r:Math.random()}));}catch(e){}
}
function handleBusMessage(ev){
if(!ev||ev.senderId===currentUser?.id)return;
switch(ev.type){
case'message':applyRemoteMessage(ev);break;
case'typing':updateTypingIndicator(ev.chatId,ev.userId,ev.name);break;
case'read':applyRemoteRead(ev);break;
case'presence':applyPresenceUpdate(ev);break;
case'reaction':applyRemoteReaction(ev);break;
}
}

function showLogin(e){if(e)e.preventDefault();$('loginForm').style.display='block';$('registerForm').style.display='none';hideAuthMessages();}
function showRegister(e){if(e)e.preventDefault();$('loginForm').style.display='none';$('registerForm').style.display='block';hideAuthMessages();}
function hideAuthMessages(){$('authError').style.display='none';$('authSuccess').style.display='none';}
function showAuthError(msg){$('authError').textContent=msg;$('authError').style.display='block';$('authSuccess').style.display='none';}
function showAuthSuccess(msg){$('authSuccess').textContent=msg;$('authSuccess').style.display='block';$('authError').style.display='none';}

function handleRegister(){
const name=$('regName').value.trim();
const badge=$('regBadge').value.trim().toUpperCase();
const dept=$('regDept').value;
const position=$('regPosition').value.trim();
const pass=$('regPassword').value;
const pass2=$('regPassword2').value;

if(!name||!badge||!dept||!pass){showAuthError('Заполните все обязательные поля');return;}
if(pass.length<6){showAuthError('Пароль должен быть минимум 6 символов');return;}
if(pass!==pass2){showAuthError('Пароли не совпадают');return;}
if(!/^KZ-\d+$/.test(badge)){showAuthError('Формат табельного номера: KZ-XXXXX (например KZ-00123)');return;}

// Проверка уникальности
const existing=Object.values(db.users).find(u=>u.badge===badge);
if(existing){showAuthError('Табельный номер уже зарегистрирован');return;}

const userId=genId('u');
db.users[userId]={
id:userId,badge,name,dept,position,role:'employee',
password:btoa(pass),// В проде использовать bcrypt на сервере!
online:true,lastSeen:Date.now(),createdAt:Date.now(),avatar:null
};
saveDB();
showAuthSuccess('Регистрация успешна! Теперь войдите.');
setTimeout(()=>showLogin(),1500);
}

function handleLogin(){
const badge=$('loginBadge').value.trim().toUpperCase();
const pass=$('loginPassword').value;

if(!badge||!pass){showAuthError('Введите табельный номер и пароль');return;}

const user=Object.values(db.users).find(u=>u.badge===badge&&atob(u.password)===pass);
if(!user){showAuthError('Неверный табельный номер или пароль');return;}

user.online=true;user.lastSeen=Date.now();
saveDB();
currentUser=user;
localStorage.setItem(SESSION_KEY,JSON.stringify({userId:user.id,token:genId('tok')}));
broadcastEvent({type:'presence',userId:user.id,name:user.name,online:true});

enterApp();
}

function logout(){
if(currentUser){
currentUser.online=false;
saveDB();
broadcastEvent({type:'presence',userId:currentUser.id,name:currentUser.name,online:false});
}
localStorage.removeItem(SESSION_KEY);
currentUser=null;currentChatId=null;
showScreen('auth');
$('loginBadge').value='';$('loginPassword').value='';
}

function checkSession(){
try{
const sess=JSON.parse(localStorage.getItem(SESSION_KEY));
if(sess&&sess.userId&&db.users[sess.userId]){
currentUser=db.users[sess.userId];
currentUser.online=true;
saveDB();
enterApp();

}
}catch(e){}
return false;
}

function switchTab(tab){

}

function renderChatList(){
const listEl=$('chatList');
listEl.innerHTML='';
const searchQuery=($('globalSearch')?.value||'').toLowerCase();

let items=[];
if(currentTab==='chats'){
items=getUserDMChats();
}else if(currentTab==='channels'){
items=getVisibleChannels();
}else if(currentTab==='contacts'){
items=getContactCards();
}

if(searchQuery){
items=items.filter(item=>{
const name=(item.name||item.title||'').toLowerCase();
return name.includes(searchQuery);
});
}

if(items.length===0){
listEl.innerHTML=`<div class="empty-state"><div class="empty-icon">${currentTab==='contacts'?'👥':'💬'}</div><div>${currentTab==='contacts'?'Контакты не найдены':'Нет активных чатов'}</div></div>`;
return;
}

items.forEach(item=>{
const el=createChatListItem(item);
listEl.appendChild(el);
});
}

function getUserDMChats(){
const myChats=Object.values(db.chats).filter(c=>
c.type==='dm'&&(c.participants.includes(currentUser.id))
);
return myChats.map(c=>{
const otherId=c.participants.find(p=>p!==currentUser.id);
const other=db.users[otherId];
const msgs=db.messages[c.id]||[];
const last=msgs[msgs.length-1];
return{
id:c.id,type:'dm',
title:other?other.name:'Неизвестный',
subtitle:other?`${other.dept} • ${other.position}`:'',
avatar:other?getInitials(other.name):'?',
color:other?getColor(other.id):'#666',
online:other?.online||false,
lastMessage:last?formatLastMsg(last):'',
lastTime:last?last.ts:0,
unread:getUnreadCount(c.id)
};
}).sort((a,b)=>b.lastTime-a.lastTime);
}

function getVisibleChannels(){
return db.channels.filter(ch=>{
if(!ch.roles||ch.roles.length===0)return true;
return ch.roles.includes(currentUser.role)||currentUser.role==='admin';
}).map(ch=>{
const msgs=db.messages[ch.id]||[];
const last=msgs[msgs.length-1];
return{
id:ch.id,type:'channel',
title:ch.name,
subtitle:ch.description,
avatar:'#',
color:getColor(ch.id),
online:false,
lastMessage:last?formatLastMsg(last):'',
lastTime:last?last.ts:0,
unread:getUnreadCount(ch.id),
pinned:ch.pinned
};
}).sort((a,b)=>{
if(a.pinned&&!b.pinned)return-1;
if(!a.pinned&&b.pinned)return 1;
return b.lastTime-a.lastTime;
});
}

function getContactCards(){
return Object.values(db.users).filter(u=>u.id!==currentUser.id).map(u=>({
id:'contact_'+u.id,
type:'contact',
userId:u.id,
title:u.name,
subtitle:`${u.dept} • ${u.position}`,
avatar:getInitials(u.name),
color:getColor(u.id),
online:u.online,
lastMessage:'',
lastTime:0,
unread:0
})).sort((a,b)=>(b.online?1:0)-(a.online?1:0)||a.title.localeCompare(b.title));
}

function formatLastMsg(msg){
const sender=msg.from===currentUser.id?'Вы':(db.users[msg.from]?.name?.split(' ')[0]||'???');
const text=msg.text||(msg.file?`📎 ${msg.file.name}`:'');
return `${sender}: ${text.substring(0,50)}`;
}

function getUnreadCount(chatId){
if(!currentUser)return 0;
const readTs=db.reads[chatId]?.[currentUser.id]||0;
const msgs=db.messages[chatId]||[];
return msgs.filter(m=>m.ts>readTs&&m.from!==currentUser.id).length;
}

function getTotalUnread(){
let total=0;
Object.keys(db.chats).forEach(cid=>total+=getUnreadCount(cid));
db.channels.forEach(ch=>total+=getUnreadCount(ch.id));
return total;
}

function createChatListItem(item){
const div=document.createElement('div');
div.className='chat-item'+(currentChatId===item.id?' active':'');
div.onclick=()=>{
if(item.type==='contact'){openOrCreateDM(item.userId);}
else{openChat(item.id);}
closeSidebar();
};

const avatarClass=item.type==='channel'?'chat-avatar channel':'chat-avatar';
div.innerHTML=`
<div class="${avatarClass}" style="background:${item.color}">
${esc(item.avatar)}
${item.online?'<div class="online-dot"></div>':''}
</div>
<div class="chat-content">
<div class="chat-top">
<span class="chat-name">${esc(item.title)}</span>
${item.lastTime?`<span class="chat-time">${timeAgo(item.lastTime)}</span>`:''}
</div>
<div class="chat-preview">${esc(item.lastMessage||item.subtitle||'')}</div>
</div>
${item.unread?`<span class="chat-badge">${item.unread>99?'99+':item.unread}</span>`:''}
`;
return div;
}

function openOrCreateDM(userId){
// Найти существующий DM или создать новый
let chat=Object.values(db.chats).find(c=>
c.type==='dm'&&c.participants.includes(currentUser.id)&&c.participants.includes(userId)
);
if(!chat){
const chatId=genId('dm');
chat={id:chatId,type:'dm',participants:[currentUser.id,userId],createdAt:Date.now()};
db.chats[chatId]=chat;
db.messages[chatId]=[];
saveDB();
}
openChat(chat.id);
}

function renderChatHeader(){
const chat=db.chats[currentChatId];
const channel=db.channels.find(c=>c.id===currentChatId);

let name,status,avatar,color,online;
if(channel){
name=channel.name;status=channel.description;avatar='#';color=getColor(channel.id);online=false;
}else if(chat&&chat.type==='dm'){
const otherId=chat.participants.find(p=>p!==currentUser.id);
const other=db.users[otherId];
name=other?other.name:'Неизвестный';
status=other?`${other.dept} • ${other.position}`:'';

$('chatHeaderAvatar').className='chat-avatar'+(channel?' channel':'');

// ---------- СООБЩЕНИЯ ----------
function renderMessages(){
const container=$('messagesContainer');
container.innerHTML='';
const msgs=db.messages[currentChatId]||[];

if(msgs.length===0){
container.innerHTML='<div class="empty-state"><div class="empty-icon">✨</div><div>Начните диалог — напишите первое сообщение!</div></div>';
return;
}

let lastDate='';
msgs.forEach(msg=>{
const msgDate=formatDate(msg.ts);
if(msgDate!==lastDate){
container.innerHTML+=`<div class="date-divider"><span>${msgDate}</span></div>`;
lastDate=msgDate;
}
container.appendChild(createMessageElement(msg));
});

scrollToBottom();
}

function createMessageElement(msg){
const isMine=msg.from===currentUser.id;
const isSystem=msg.from==='system';
const wrapper=document.createElement('div');
wrapper.className=`message ${isSystem?'system':isMine?'outgoing':'incoming'}`;
wrapper.dataset.msgId=msg.id;

let html='';

// Sender name (для входящих в каналах)
if(!isMine&&!isSystem){
const channel=db.channels.find(c=>c.id===currentChatId);
if(channel){
const sender=db.users[msg.from];
html+=`<div class="msg-sender" style="color:${getColor(msg.from)}">${esc(sender?.name||'Неизвестный')}</div>`;
}
}

// Reply reference
if(msg.replyTo){
const origMsg=(db.messages[currentChatId]||[]).find(m=>m.id===msg.replyTo);
if(origMsg){
const origSender=db.users[origMsg.from];
html+=`<div class="msg-reply" onclick="scrollToMessage('${origMsg.id}')">
<strong>${esc(origSender?.name?.split(' ')[0]||'???')}</strong>: ${esc((origMsg.text||'📎').substring(0,60))}
</div>`;
}
}

// Bubble
html+='<div class="msg-bubble">';
if(msg.deleted){
html+='<em style="opacity:.6">🗑 Сообщение удалено</em>';
}else{
if(msg.text)html+=linkify(esc(msg.text)).replace(/\n/g,'<br>');
if(msg.file){
html+=`<div class="msg-file" onclick="downloadFile('${msg.id}')">
<div class="msg-file-icon">${getFileIcon(msg.file.type)}</div>
<div class="msg-file-info">
<div class="msg-file-name">${esc(msg.file.name)}</div>
<div class="msg-file-size">${formatFileSize(msg.file.size)}</div>
</div>
</div>`;
}
}
html+='</div>';

// Meta
html+=`<div class="msg-meta">
<span>${formatTime(msg.ts)}</span>
${msg.edited?'<span style="opacity:.6">(изм.)</span>':''}
${isMine&&!isSystem?`<span class="msg-check ${msg.status==='read'?'read':''}">${msg.status==='sending'?'🕐':msg.status==='sent'?'✓':msg.status==='delivered'?'✓✓':'✓✓'}</span>`:''}
</div>`;

// Reactions
if(msg.reactions&&Object.keys(msg.reactions).length>0){
html+='<div class="reactions-bar">';
Object.entries(msg.reactions).forEach(([emoji,userIds])=>{
if(userIds.length===0)return;
const mine=userIds.includes(currentUser.id);
html+=`<button class="reaction-pill ${mine?'mine':''}" onclick="toggleReaction('${msg.id}','${emoji}')">${emoji} ${userIds.length}</button>`;
});
html+='</div>';
}

wrapper.innerHTML=html;

// Context menu
wrapper.addEventListener('contextmenu',e=>{
e.preventDefault();
showMessageContextMenu(e,msg);
});
// Double-click reaction
wrapper.addEventListener('dblclick',()=>{
if(!msg.deleted)toggleReaction(msg.id,'👍');
});

return wrapper;
}

function linkify(text){
return text.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');
}
function getFileIcon(type){
if(!type)return'📄';
if(type.startsWith('image/'))return'🖼️';
if(type.startsWith('video/'))return'🎬';
if(type.startsWith('audio/'))return'🎵';
if(type.includes('pdf'))return'📕';
if(type.includes('zip')||type.includes('rar'))return'📦';
if(type.includes('sheet')||type.includes('excel'))return'📊';
if(type.includes('word')||type.includes('document'))return'📝';
return'📄';
}
function formatFileSize(bytes){
if(!bytes)return'';
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB';
return(bytes/1048576).toFixed(1)+' MB';
}
function scrollToBottom(){
const c=$('messagesContainer');
requestAnimationFrame(()=>{c.scrollTop=c.scrollHeight;});
}
function scrollToMessage(msgId){
const el=document.querySelector(`[data-msg-id="${msgId}"]`);
if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--accent)';setTimeout(()=>el.style.outline='',1500);}
}

// ---------- ОТПРАВКА СООБЩЕНИЙ ----------
function sendMessage(){
const input=$('messageInput');
const text=input.value.trim();
if(!text&&!pendingFile)return;
if(!currentChatId)return;

const msg={
id:genId('m'),
from:currentUser.id,
chatId:currentChatId,
text:text,
file:pendingFile||null,
replyTo:replyTo?replyTo.id:null,
ts:Date.now(),
status:'sending',
reactions:{},
edited:false,
deleted:false
};

if(!db.messages[currentChatId])db.messages[currentChatId]=[];
db.messages[currentChatId].push(msg);
saveDB();

// Оптимистичный рендер
renderMessages();
input.value='';
input.style.height='auto';
cancelReply();
pendingFile=null;

// Broadcast
broadcastEvent({type:'message',chatId:currentChatId,message:msg,userId:currentUser.id});

// Статус delivered через 300мс
setTimeout(()=>{
msg.status='delivered';
saveDB();
if(currentChatId===msg.chatId)renderMessages();
},300);

// Отправка push-уведомлений (если есть сервер)
sendPushNotifications(msg);
}

let pendingFile=null;
function handleFileSelect(input){
const file=input.files[0];
if(!file)return;
if(file.size>10*1024*1024){showToast('Файл больше 10 МБ','error');input.value='';return;}
const reader=new FileReader();
reader.onload=()=>{
pendingFile={name:file.name,size:file.size,type:file.type,data:reader.result};
showToast(`Файл "${file.name}" готов к отправке`,'success');
sendMessage();
};
reader.readAsDataURL(file);
input.value='';
}
function downloadFile(msgId){
const msg=(db.messages[currentChatId]||[]).find(m=>m.id===msgId);
if(!msg||!msg.file)return;
const a=document.createElement('a');
a.href=msg.file.data;
a.download=msg.file.name;
a.click();
}

// ---------- РЕДАКТИРОВАНИЕ / УДАЛЕНИЕ / РЕАКЦИИ ----------
function toggleReaction(msgId,emoji){
const msgs=db.messages[currentChatId]||[];
const msg=msgs.find(m=>m.id===msgId);
if(!msg)return;
if(!msg.reactions)msg.reactions={};
if(!msg.reactions[emoji])msg.reactions[emoji]=[];
const idx=msg.reactions[emoji].indexOf(currentUser.id);
if(idx>=0)msg.reactions[emoji].splice(idx,1);
else msg.reactions[emoji].push(currentUser.id);
if(msg.reactions[emoji].length===0)delete msg.reactions[emoji];
saveDB();
broadcastEvent({type:'reaction',chatId:currentChatId,msgId,emoji,userId:currentUser.id});
renderMessages();
}

function editMessage(msgId){
const msgs=db.messages[currentChatId]||[];
const msg=msgs.find(m=>m.id===msgId);
if(!msg||msg.from!==currentUser.id)return;
const newText=prompt('Новый текст:',msg.text);
if(newText===null||newText===msg.text)return;
msg.text=newText;msg.edited=true;
saveDB();
renderMessages();
}

function deleteMessage(msgId){
const msgs=db.messages[currentChatId]||[];
const msg=msgs.find(m=>m.id===msgId);
if(!msg||msg.from!==currentUser.id)return;
if(Date.now()-msg.ts>15*60*1000){showToast('Можно удалять только свои сообщения младше 15 минут','warning');return;}
msg.deleted=true;msg.text='';msg.file=null;
saveDB();
renderMessages();
}

function setReply(msg){
replyTo=msg;
$('replyPreview').style.display='flex';
$('replyPreviewText').textContent=(msg.text||'📎 файл').substring(0,80);
$('messageInput').focus();
}
function cancelReply(){
replyTo=null;
$('replyPreview').style.display='none';
}

// ---------- КОНТЕКСТНОЕ МЕНЮ ----------
function showMessageContextMenu(e,msg){
closeContextMenu();
const menu=document.createElement('div');
menu.className='context-menu';
menu.style.left=Math.min(e.clientX,window.innerWidth-200)+'px';
menu.style.top=Math.min(e.clientY,window.innerHeight-300)+'px';

const isMine=msg.from===currentUser.id;
const items=[];
items.push({label:'↩ Ответить',fn:()=>setReply(msg)});
items.push({label:'📋 Копировать',fn:()=>{navigator.clipboard?.writeText(msg.text||'');showToast('Скопировано','success');}});
if(msg.text)items.push({sep:true});
items.push({reactions:['👍','❤️','😂','😮','😢','','','✅']});
if(isMine&&!msg.deleted){
items.push({sep:true});
items.push({label:'✏️ Редактировать',fn:()=>editMessage(msg.id)});
items.push({label:'🗑 Удалить',danger:true,fn:()=>deleteMessage(msg.id)});
}

items.forEach(item=>{
if(item.sep){menu.appendChild(Object.assign(document.createElement('div'),{className:'ctx-separator'}));return;}
if(item.reactions){
const row=document.createElement('div');row.className='ctx-reactions';
item.reactions.forEach(em=>{
const btn=document.createElement('button');btn.className='ctx-reaction';btn.textContent=em;
btn.onclick=()=>{toggleReaction(msg.id,em);closeContextMenu();};
row.appendChild(btn);
});
menu.appendChild(row);return;
}
const btn=document.createElement('button');
btn.className='ctx-item'+(item.danger?' danger':'');
btn.textContent=item.label;
btn.onclick=()=>{item.fn();closeContextMenu();};
menu.appendChild(btn);
});

document.body.appendChild(menu);
setTimeout(()=>document.addEventListener('click',closeContextMenu,{once:true}),0);
}
function closeContextMenu(){qsa('.context-menu').forEach(m=>m.remove());}
function showChatMenu(e){
closeContextMenu();
const menu=document.createElement('div');
menu.className='context-menu';
menu.style.left=Math.min(e.clientX,window.innerWidth-200)+'px';
menu.style.top=(e.clientY+40)+'px';
[{label:'ℹ️ Информация',fn:showChatInfo},{label:'🧹 Очистить историю',fn:()=>{if(confirm('Очистить всю историю?')){db.messages[currentChatId]=[];saveDB();renderMessages();}}},{label:'📥 Экспорт .txt',fn:exportChat}].forEach(item=>{
const btn=document.createElement('button');btn.className='ctx-item';btn.textContent=item.label;
btn.onclick=()=>{item.fn();closeContextMenu();};menu.appendChild(btn);
});
document.body.appendChild(menu);
setTimeout(()=>document.addEventListener('click',closeContextMenu,{once:true}),0);
}
function exportChat(){
const msgs=db.messages[currentChatId]||[];
const lines=msgs.map(m=>{
const u=db.users[m.from];
return`[${new Date(m.ts).toLocaleString('ru-RU')}] ${u?.name||m.from}: ${m.deleted?'(удалено)':(m.text||'')}${m.file?' [файл: '+m.file.name+']':''}`;
}).join('\n');
const blob=new Blob([lines],{type:'text/plain;charset=utf-8'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='chat_export_'+Date.now()+'.txt';a.click();
}
function showChatInfo(){
const chat=db.chats[currentChatId];
const channel=db.channels.find(c=>c.id===currentChatId);
let rows=[];
if(channel){
rows=[['Тип','Канал'],['Название',channel.name],['Описание',channel.description||'—'],['Доступ',(channel.roles?.length?channel.roles.join(', '):'Все')],['Сообщений',(db.messages[channel.id]||[]).length]];
}else if(chat){
const otherId=chat.participants.find(p=>p!==currentUser.id);
const other=db.users[otherId];
rows=[['Тип','Личный чат'],['Собеседник',other?.name||'—'],['Подразделение',other?.dept||'—'],['Должность',other?.position||'—'],['Табельный',other?.badge||'—'],['Статус',other?.online?'Онлайн':'Офлайн'],['Сообщений',(db.messages[chat.id]||[]).length]];
}
showModal('Информация о чате',rows);
}
function showModal(title,rows){
const overlay=document.createElement('div');overlay.className='modal-overlay';
overlay.onclick=e=>{if(e.target===overlay)overlay.remove();};
const modal=document.createElement('div');modal.className='modal';
modal.innerHTML=`<h3>${esc(title)}</h3>`+rows.map(r=>`<div class="modal-row"><span class="modal-key">${esc(r[0])}</span><span>${esc(String(r[1]))}</span></div>`).join('')+`<div class="modal-actions"><button class="btn-primary" onclick="this.closest('.modal-overlay').remove()">Закрыть</button></div>`;
overlay.appendChild(modal);document.body.appendChild(overlay);
}

// ---------- TYPING ----------
function emitTyping(){
if(!currentChatId||!currentUser)return;
clearTimeout(typingTimeout);
broadcastEvent({type:'typing',chatId:currentChatId,userId:currentUser.id,name:currentUser.name});
typingTimeout=setTimeout(()=>{/* stop typing implicit */},3000);
}
function updateTypingIndicator(chatId,userId,name){
if(chatId!==currentChatId)return;
typingMap[userId]={name,ts:Date.now()};
renderTypingUI();
}
function renderTypingUI(){
const now=Date.now();
const active=Object.entries(typingMap).filter(([uid,d])=>now-d.ts<4000&&uid!==currentUser?.id);
$('typingIndicator').textContent=active.length?active.map(([_,d])=>d.name.split(' ')[0]).join(', ')+' печатает...':'';
}
setInterval(renderTypingUI,1000);

// ---------- READ RECEIPTS ----------
function markAsRead(chatId){
if(!currentUser)return;
if(!db.reads[chatId])db.reads[chatId]={};
db.reads[chatId][currentUser.id]=Date.now();
saveDB();
broadcastEvent({type:'read',chatId,userId:currentUser.id,timestamp:Date.now()});
updateUnreadBadges();
}
function applyRemoteRead(ev){
// Собеседник прочитал наши сообщения
const msgs=db.messages[ev.chatId]||[];
msgs.forEach(m=>{
if(m.from===currentUser.id&&m.ts<=ev.timestamp)m.status='read';
});
saveDB();
if(currentChatId===ev.chatId)renderMessages();
}
function applyRemoteMessage(ev){
const msg=ev.message;
if(!db.messages[msg.chatId])db.messages[msg.chatId]=[];
if(db.messages[msg.chatId].some(m=>m.id===msg.id))return;
db.messages[msg.chatId].push(msg);
saveDB();
if(currentChatId===msg.chatId){
renderMessages();
markAsRead(msg.chatId);
}else{
showNotification(msg);
}
updateUnreadBadges();
renderChatList();
}
function applyRemoteReaction(ev){
const msgs=db.messages[ev.chatId]||[];
const msg=msgs.find(m=>m.id===ev.msgId);
if(!msg)return;
if(!msg.reactions)msg.reactions={};
if(!msg.reactions[ev.emoji])msg.reactions[ev.emoji]=[];
const idx=msg.reactions[ev.emoji].indexOf(ev.userId);
if(idx>=0)msg.reactions[ev.emoji].splice(idx,1);
else msg.reactions[ev.emoji].push(ev.userId);
if(msg.reactions[ev.emoji].length===0)delete msg.reactions[ev.emoji];
saveDB();
if(currentChatId===ev.chatId)renderMessages();
}
function applyPresenceUpdate(ev){
const user=db.users[ev.userId];
if(user){user.online=ev.online;user.lastSeen=Date.now();saveDB();renderChatList();}
}
function updateUnreadBadges(){
const total=getTotalUnread();
document.title=total>0?`(${total}) KZ Messenger`:'KZ Messenger';
}

// ---------- PUSH УВЕДОМЛЕНИЯ ----------
async function requestPushPermission(){
if(!('Notification'in window))return;
if(Notification.permission==='default'){
try{await Notification.requestPermission();}catch(e){}
}
// Регистрация Service Worker для Web Push
if('serviceWorker'in navigator){
try{
const reg=await navigator.serviceWorker.register(SW_NAME);
console.log('✅ Service Worker registered:',reg.scope);
// Подписка на push (нужен сервер с VAPID ключом)
if(VAPID_PUBLIC_KEY&&'PushManager'in window){
const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToBuffer(VAPID_PUBLIC_KEY)});
console.log('📱 Push subscription:',JSON.stringify(sub));
// Отправить subscription на сервер (в проде)
// fetch('/api/push/subscribe',{method:'POST',body:JSON.stringify(sub)})
}
}catch(e){console.warn('SW registration failed:',e);}
}
}
function urlBase64ToBuffer(base64String){
const padding='='.repeat((4-base64String.length%4)%4);
const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
const decoded=atob(base64);
return Uint8Array.from([...decoded].map(c=>c.charCodeAt(0)));
}
function showNotification(msg){
if(Notification.permission!=='granted')return;
const sender=db.users[msg.from];
const chatName=currentChatId===msg.chatId?null:(db.chats[msg.chatId]?.id||db.channels.find(c=>c.id===msg.chatId)?.name||msg.chatId);
const title=sender?.name||'Новое сообщение';
const body=(msg.text||'📎 Файл').substring(0,100);
try{
const n=new Notification(title,{body,icon:'./icon.png',badge:'./icon.png',tag:msg.id,requireInteraction:false});
n.onclick=()=>{window.focus();openChat(msg.chatId);n.close();};
setTimeout(()=>n.close(),8000);
}catch(e){}
showToast(`${title}: ${body}`,'info');
}
async function sendPushNotifications(msg){
// В проде: отправить на сервер, который разошлёт push всем участникам чата
// Здесь — имитация для демонстрации
if(VAPID_PUBLIC_KEY){
try{
await fetch('/api/push/send',{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({chatId:msg.chatId,message:msg,excludeUserId:currentUser.id})
});
}catch(e){console.warn('Push send failed:',e);}
}
}

// ---------- PRESENCE HEARTBEAT ----------
function startPresenceHeartbeat(){
setInterval(()=>{
if(!currentUser)return;
currentUser.online=true;currentUser.lastSeen=Date.now();
saveDB();
broadcastEvent({type:'presence',userId:currentUser.id,name:currentUser.name,online:true});
},25000);
// Помечаем офлайн других пользователей, которые не были видны >60 сек
setInterval(()=>{
const cutoff=Date.now()-60000;
Object.values(db.users).forEach(u=>{
if(u.id!==currentUser?.id&&u.online&&u.lastSeen<cutoff){
u.online=false;saveDB();
}
});
},30000);
}
